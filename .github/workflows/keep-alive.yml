name: Keep database awake
# Free Supabase projects pause after a week without activity. This calls a harmless database function every 3 days.
# (Direct table reads are blocked by design, so the ping uses the public "ping" function, which runs a real query.)
on:
  schedule:
    - cron: "17 6 */3 * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          curl -fsS -X POST "https://wjuqtjlrtcywjaspjpwu.supabase.co/rest/v1/rpc/ping" \
            -H "apikey: sb_publishable_uEEI8iTld1pPzys6GL0QnA_b4WVb_2A" -H "Content-Type: application/json" -d '{}' -w "\nHTTP %{http_code}\n"
