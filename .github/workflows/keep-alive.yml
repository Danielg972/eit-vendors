name: Keep database awake
# Free Supabase projects pause after a week without activity. This pings the database every 3 days.
on:
  schedule:
    - cron: "17 6 */3 * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          curl -fsS "https://wjuqtjlrtcywjaspjpwu.supabase.co/rest/v1/vendors?select=id&limit=1" \
            -H "apikey: sb_publishable_uEEI8iTld1pPzys6GL0QnA_b4WVb_2A" -o /dev/null -w "HTTP %{http_code}\n"
