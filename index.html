const KINDS=['Price list','Booking confirmation','Receipt','Quote','Contract','Kosher certificate','Photo','Other'];
function loadScript(src){ return new Promise((res,rej)=>{ if(document.querySelector(`script[src="${src}"]`)) return res(); const sc=document.createElement('script'); sc.src=src; sc.onload=res; sc.onerror=()=>rej(new Error('Could not load '+src)); document.head.appendChild(sc); }); }
const PDFJS='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js', PDFJS_WORKER='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js', JSPDF='https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js';
async function fileToCanvases(f){
  if(f.type==='application/pdf' || /\.pdf$/i.test(f.name)){
    await loadScript(PDFJS); window.pdfjsLib.GlobalWorkerOptions.workerSrc=PDFJS_WORKER;
    const pdf=await window.pdfjsLib.getDocument({data:await f.arrayBuffer()}).promise; const out=[];
    for(let i=1;i<=Math.min(pdf.numPages,20);i++){ const pg=await pdf.getPage(i); const vp=pg.getViewport({scale:2}); const c=document.createElement('canvas'); c.width=vp.width; c.height=vp.height; await pg.render({canvasContext:c.getContext('2d'),viewport:vp}).promise; out.push(c); }
    return {pdf:true,pages:out};
  }
  const bmp=await createImageBitmap(f); const k=Math.min(1,2400/Math.max(bmp.width,bmp.height)); const c=document.createElement('canvas'); c.width=Math.round(bmp.width*k); c.height=Math.round(bmp.height*k); c.getContext('2d').drawImage(bmp,0,0,c.width,c.height); return {pdf:false,pages:[c]};
}
// Lets people black out private details; the result is flattened, so hidden text can't be recovered.
function redactFiles(files){
  return new Promise(resolve=>{
    let idx=0; const results=[];
    const next=async()=>{
      if(idx>=files.length){ resolve(results); return; }
      const f=files[idx++];
      if(!/^image\/(jpeg|png|webp|gif)$/.test(f.type) && !(f.type==='application/pdf'||/\.pdf$/i.test(f.name))){ results.push(f); return next(); }
      let doc; try{ doc=await fileToCanvases(f); }catch(e){ toast("Couldn't open "+f.name+" for blacking out; uploading as is."); results.push(f); return next(); }
      const boxes=doc.pages.map(()=>[]);
      const w=sheet(`Hide private details · ${f.name}`, `<div class="red-wrap"><div class="red-tools"><span class="hint">Drag over anything private (client names, phone numbers, card details) to black it out.</span><button class="mini" id="rUndo" type="button">Undo</button></div>
        ${doc.pages.map((c,i)=>`<div class="red-page" data-i="${i}"></div>`).join('')}${doc.pages.length===20?'<p class="hint">Only the first 20 pages are kept.</p>':''}</div>`,
        `<button class="btn soft" id="rCancel" type="button">Cancel</button><button class="btn soft" id="rSkip" type="button">Nothing to hide</button><button class="btn primary" id="rSave" type="button">Save with black boxes</button>`);
      const views=[...w.querySelectorAll('.red-page')].map((holder,i)=>{ const base=doc.pages[i]; const vc=document.createElement('canvas'); vc.width=base.width; vc.height=base.height; holder.appendChild(vc);
        const draw=(tmp)=>{ const g=vc.getContext('2d'); g.drawImage(base,0,0); g.fillStyle='#000'; boxes[i].concat(tmp?[tmp]:[]).forEach(b=>g.fillRect(b.x,b.y,b.w,b.h)); };
        draw(); let start=null;
        const pos=e=>{ const r=vc.getBoundingClientRect(); return {x:(e.clientX-r.left)*vc.width/r.width, y:(e.clientY-r.top)*vc.height/r.height}; };
        vc.addEventListener('pointerdown',e=>{ start=pos(e); vc.setPointerCapture(e.pointerId); });
        vc.addEventListener('pointermove',e=>{ if(!start) return; const p=pos(e); draw({x:Math.min(start.x,p.x),y:Math.min(start.y,p.y),w:Math.abs(p.x-start.x),h:Math.abs(p.y-start.y)}); });
        vc.addEventListener('pointerup',e=>{ if(!start) return; const p=pos(e); const b={x:Math.min(start.x,p.x),y:Math.min(start.y,p.y),w:Math.abs(p.x-start.x),h:Math.abs(p.y-start.y)}; start=null; if(b.w>4&&b.h>4){ boxes[i].push(b); undoStack.push(i); } draw(); });
        return {vc,draw}; });
      const undoStack=[];
      w.querySelector('#rUndo').onclick=()=>{ const i=undoStack.pop(); if(i===undefined) return; boxes[i].pop(); views[i].draw(); };
      w.querySelector('#rCancel').onclick=()=>{ closeSheet(); resolve(null); };
      w.querySelector('#rSkip').onclick=()=>{ closeSheet(); results.push(f); next(); };
      w.querySelector('#rSave').onclick=async()=>{ const btn=w.querySelector('#rSave'); btn.disabled=true; btn.textContent='Preparing…';
        try{
          const base=f.name.replace(/\.[^.]+$/,'');
          if(doc.pdf){ await loadScript(JSPDF); const { jsPDF } = window.jspdf; let pdf;
            views.forEach((v,i)=>{ const c=v.vc; const o=c.width>c.height?'l':'p'; if(!pdf) pdf=new jsPDF({orientation:o,unit:'px',format:[c.width,c.height]}); else pdf.addPage([c.width,c.height],o); pdf.addImage(c.toDataURL('image/jpeg',0.85),'JPEG',0,0,c.width,c.height); });
            results.push(new File([pdf.output('blob')], base+'-redacted.pdf', {type:'application/pdf'}));
          } else { const blob=await new Promise(r=>views[0].vc.toBlob(r,'image/jpeg',0.88)); results.push(new File([blob], base+'-redacted.jpg', {type:'image/jpeg'})); }
          closeSheet(); next();
        }catch(e){ btn.disabled=false; btn.textContent='Save with black boxes'; toast(e.message); }
      };
    };
    next();
  });
}
async function shrink(file){
  // Phone photos are large; resize to max 2000px JPEG. Keep PDFs and anything the browser can't decode as-is.
  if(!/^image\/(jpeg|png|webp)$/.test(file.type) || file.size < 1500000) return file;
  try{
    const bmp = await createImageBitmap(file); const k = Math.min(1, 2000/Math.max(bmp.width,bmp.height));
    const c=document.createElement('canvas'); c.width=Math.round(bmp.width*k); c.height=Math.round(bmp.height*k);
    c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);
    const blob = await new Promise(r=>c.toBlob(r,'image/jpeg',0.85));
    return blob && blob.size < file.size ? new File([blob], file.name.replace(/\.\w+$/,'')+'.jpg', {type:'image/jpeg'}) : file;
  }catch(e){ return file; }
}

        ${canRm?`<button class="rm" data-i="${i}" type="button">Remove</button>`:''}</div>`; }).join('')}</div>`
    : `<p class="hint" style="margin:8px 0 10px">${qid?'No attachments yet. Add the quote email screenshot or PDF.':'No files yet. Add a photo of the place, a receipt, a price list or a contract.'}</p>`)

      <label class="btn accent" for="${sid}_file" style="display:inline-block">Add photo or file</label>

      <span class="hint" id="${sid}_msg">Price lists, booking confirmations, receipts: photos or PDFs up to 10 MB. Before saving you can black out names, phone numbers, card details or anything private.</span></div>`:'');
  box.querySelectorAll('.rm').forEach(b=>b.onclick=async()=>{ if(b.dataset.c!=='1'){ b.dataset.c='1'; b.textContent='Tap again'; return; }
    try{ await DB.removeFile(files[+b.dataset.i]); toast('File removed'); redraw(); }catch(e){ toast(e.message); } });
  const input=box.querySelector('#'+sid+'_file'), msg=box.querySelector('#'+sid+'_msg'); if(!input) return;

    let picked=[...input.files]; input.value=''; if(!picked.length) return; const kind=box.querySelector('#'+sid+'_kind').value; const priv=box.querySelector('#'+sid+'_priv').checked; let ok=0;

const isOwnPhone=p=>{ const d=String(p).replace(/\D/g,''); const mine=[...OWN_PHONES, String((S.me&&S.me.phone)||'').replace(/\D/g,'').slice(-9)].filter(x=>x.length>=8); return mine.some(m=>d.endsWith(m)); };
function parseContactText(txt){
  const out={phones:[],emails:[],urls:[],maps:'',name:'',org:'',address:''};
  // Keep only the newest message of a pasted email thread: quoted replies carry other people's (and our own) details
  let t=String(txt||'').split(/\n[>\s]*(?:On .{5,120} wrote:|-{2,}\s*(?:Original|Forwarded) message|From: .+|‫?בתאריך .{5,120}(?:מאת|כתב)|נשלח מה)/)[0];
  if(/BEGIN:VCARD/i.test(String(txt))){ t=String(txt);
    const un=t.replace(/\r?\n[ \t]/g,''); // unfold
    un.split(/\r?\n/).forEach(l=>{ const m=l.match(/^([A-Z\-]+)(?:;[^:]*)?:(.*)$/i); if(!m) return; const k=m[1].toUpperCase(), val=m[2].replace(/\\,/g,',').replace(/\;/g,';').trim();
      if(k==='FN'&&!out.name) out.name=val; else if(k==='N'&&!out.name) out.name=val.split(';').slice(0,2).reverse().join(' ').trim();
      else if(k==='ORG') out.org=val.split(';')[0]; else if(k==='TEL') out.phones.push(val); else if(k==='EMAIL') out.emails.push(val);
      else if(k==='URL') out.urls.push(val); else if(k==='ADR') out.address=val.split(';').filter(Boolean).join(', '); });
  }

  return `<div class="cbox" id="cliBox"><div class="ch"><b>For clients</b>${locked?'':`<button class="mini" id="cliEdit" type="button">${has?'Edit':'+ Add'}</button>`}</div>

    <div class="cpics" id="cliPics"></div>
    ${v.client_bio?`<p class="cbio" dir="auto">${esc(v.client_bio)}</p>`:`<p class="hint" style="margin:10px 0 0">${none}</p>`}
    ${v.retail_price?`<p class="cret"><span class="hint">Retail price${S.admin&&v.prices_private?' · private, only you see it':''}</span><br><b dir="auto">${esc(v.retail_price)}</b></p>`:''}
    <div class="btn-row" id="cliActs" style="margin-top:10px"${v.client_bio?'':' hidden'}><button class="btn soft" id="cliCopy" type="button">Copy bio</button><button class="btn soft" id="cliShare" type="button" hidden>Share with a client</button></div></div>`;
}
// The pictures arrive with the supplier's other files (drawFiles calls this).
const cliBlobs={};
function drawClientPics(v, files){
  const box=document.getElementById('cliPics'); if(!box) return; const pics=clientPics(files);
  box.innerHTML=pics.map(f=>`<a class="cpic" href="${esc(f.url||'#')}" target="_blank" rel="noopener">${f.url?`<img src="${esc(f.url)}" alt="Picture of ${esc(v.name)}" loading="lazy">`:''}</a>`).join('');
  const acts=document.getElementById('cliActs'), sh=document.getElementById('cliShare'); if(!acts) return;
  const canShare=!!navigator.share && !!(v.client_bio||pics.length);
  acts.hidden=!(v.client_bio||canShare);
  const ed=document.getElementById('cliEdit'); if(ed && pics.length) ed.textContent='Edit';
  const cp=document.getElementById('cliCopy'); if(cp){ cp.hidden=!v.client_bio; cp.onclick=()=>copyText(clientText(v)); }
  if(sh && canShare){ sh.hidden=false; sh.onclick=()=>clientShare(v, pics);
    // fetch the pictures ahead of the tap: a phone only lets a page share straight after a tap
    pics.forEach(f=>{ if(f.url&&!cliBlobs[f.id]) fetch(f.url).then(r=>r.ok?r.blob():null).then(b=>{ if(b) cliBlobs[f.id]=new File([b], f.file_name||'picture.jpg', {type:b.type||f.mime_type||'image/jpeg'}); }).catch(()=>{}); }); }
}
async function clientShare(v, pics){
  const text=clientText(v), files=pics.map(f=>cliBlobs[f.id]).filter(Boolean);
  try{
    if(files.length && navigator.canShare && navigator.canShare({files})) await navigator.share(text?{files,text}:{files});
    else if(text) await navigator.share({text});
    else toast('The pictures are not ready yet. Try again in a moment.');
  }catch(e){ if(e&&e.name==='AbortError') return; if(text) copyText(text); else toast('This phone cannot share from here. Open a picture and save it.'); }
}
function openClientForm(v){
  const priv=!!v.prices_private&&!S.admin, me=(S.user.email||'').toLowerCase();
  const body=`<p style="margin:0 0 12px;color:var(--ink-2)">What a client may see about <b>${esc(v.name)}</b>. Colleagues can copy it and send it to their clients, so write it for clients: no agent rates, no phone number.</p>
    <div class="f wide"><label for="cbBio">Bio for clients</label><textarea id="cbBio" rows="8" maxlength="${CLIENT_BIO_MAX}" dir="auto" placeholder="Who the guide is, in a few sentences: background, languages, what they love to show people, the kind of groups they guide.">${esc(v.client_bio||'')}</textarea><span class="ccount" id="cbN"></span></div>
    <div class="f wide" style="margin-top:12px"><span class="lab">Pictures for clients · up to four</span><div class="cpics" id="cbPics"></div>
      <input id="cbFile" type="file" accept="image/jpeg,image/png,image/webp" hidden>
      <span class="hint" id="cbMsg">JPEG or PNG. A picture is saved as soon as you add it. Use pictures you have the right to share, and that the people in them are happy to have shown.</span></div>
    ${priv?'':`<div class="f wide" style="margin-top:12px"><label for="cbRet">Retail price <span class="hint">· optional</span></label><input id="cbRet" type="text" maxlength="${CLIENT_RETAIL_MAX}" dir="auto" value="${esc(v.retail_price||'')}" placeholder="$650 a day, up to 9 hours. Vehicle extra.">
      <span class="hint">What a client pays when booking this guide directly, in your own words. ${S.admin&&v.prices_private?'Prices on this supplier are private, so only you see it.':'Every colleague on the list sees it.'}</span></div>`}
    <div id="cbErr"></div>`;
  const w=sheet('For clients', body, `<button class="btn soft" id="cbC" type="button">Back</button><button class="btn primary" id="cbS" type="button">Save</button>`);
  const bio=w.querySelector('#cbBio'), cnt=w.querySelector('#cbN'), box=w.querySelector('#cbPics'), inp=w.querySelector('#cbFile'), msg=w.querySelector('#cbMsg');
  const count=()=>{ cnt.textContent=bio.value.length+' / '+CLIENT_BIO_MAX; }; bio.oninput=count; count();
  const say=(t,bad)=>{ if(!document.body.contains(msg)) return toast(t); msg.textContent=t; msg.style.color=bad?'var(--bad)':''; };
  const drawPics=async()=>{
    let files=[]; try{ files=await DB.listFiles(v.id); }catch(e){ box.innerHTML=''; say("Couldn't load the pictures: "+e.message, true); return; }
    if(!document.body.contains(box)) return;
    const pics=clientPics(files);
    box.innerHTML=pics.map((f,i)=>`<div class="cpic">${f.url?`<img src="${esc(f.url)}" alt="Picture ${i+1}">`:''}<button class="rm" data-i="${i}" type="button">Remove</button></div>`).join('')
      + (pics.length<CLIENT_PICS?`<label class="cpic add" for="cbFile" tabindex="0" role="button"><b aria-hidden="true">+</b>Add picture</label>`:'');
    box.querySelectorAll('.rm').forEach(b=>b.onclick=async()=>{ if(b.dataset.c!=='1'){ b.dataset.c='1'; b.textContent='Tap again'; return; }
      const f=pics[+b.dataset.i]; b.disabled=true;
      // the person who added the picture, or Eretz Israel Tours, removes the file; anyone else only takes it off the client pictures
      try{ if(S.admin||f.mine||f.uploaded_by===me) await DB.removeFile(f); else await DB.fileForClients(f,false); say('Picture removed'); }catch(e){ say(e.message, true); }
      drawPics(); });
    const add=box.querySelector('.cpic.add'); if(add) add.onkeydown=e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); inp.click(); } };
  };
  inp.onchange=async()=>{ const f0=inp.files[0]; inp.value=''; if(!f0) return;
    if(!/^image\/(jpeg|png|webp)$/.test(f0.type)) return say('Use a JPEG or PNG picture.', true);
    say('Uploading…'); const f=await shrink(f0);
    if(f.size>10485760) return say('That picture is over 10 MB.', true);
    let row=null;
    try{ row=await DB.upload(v.id, f, 'Photo'); await DB.fileForClients(row, true); say('Picture added'); }
    catch(e){ say(row?'The picture was saved under Photos, but not as a client picture: '+e.message:e.message, true); }
    drawPics(); };
  drawPics();
  w.querySelector('#cbC').onclick=()=>openDetail(v.id);
  w.querySelector('#cbS').onclick=async()=>{ const b=w.querySelector('#cbS'), r=w.querySelector('#cbRet'); b.disabled=true;
    try{ await DB.setClient(v.id, bio.value.trim(), r?r.value.trim():''); toast('Saved'); openDetail(v.id); }
    catch(e){ b.disabled=false; w.querySelector('#cbErr').innerHTML=`<div class="msg err">${esc(e.message)}</div>`; } };
}

// ---------- jobs between colleagues, and My days ----------
// A member posts a job with the price he pays. It goes to the colleagues it fits, or to the ones he picks.
// A colleague answers "I'm available"; the poster gives the job to one of them. Nothing is charged on a job.
// My days: each member marks the days he is busy; a poster sees only Free / Busy / Not marked for his job's dates.
const JOB_KINDS=[['guide','Guide','מדריך/ה'],['guide_vehicle','Guide with vehicle','מדריך/ה עם רכב'],['van_driver','Van driver','נהג/ת ואן'],['jeep_driver','Jeep driver','נהג/ת ג׳יפ'],['other','Someone else','איש/אשת מקצוע']];
const JOB_NEEDS=[['licensed','Licensed guide'],['eshkol','Eshkol license (D1)'],['midbari','Midbari 4x4 vehicle'],['gun','Carries a gun'],['shabbat','Shomer Shabbat']];
const JOB_PER=[['day','per day','ליום'],['job','for the whole job','לכל העבודה'],['hour','per hour','לשעה'],['vehicle','per vehicle','לרכב']];
const JOB_VAT={including_vat:['VAT included','כולל מע״מ'],plus_vat:['plus VAT','בתוספת מע״מ'],not_applicable:['no VAT','ללא מע״מ']};
const WEEKDAYS=['Sun','Mon','Tue','Wed','Thu','Fri','Shabbat'];
const DAYS_STALE=21; // days before the app asks "are your days still right?"
const jobsOn=()=>(!LIVE&&!lim())||!!(S.me&&S.me.jobs);
const jobsPost=()=>!LIVE||!!(S.me&&S.me.jobs_post);
const jLab=(list,k)=>{ const x=list.find(y=>y[0]===k); return x?x[1]:''; };
const jKind=j=>jLab(JOB_KINDS,j.kind)||'Job';
const jMoney=j=>(CUR_SIGN[j.currency]||'₪')+Number(j.price||0).toLocaleString('en-US');
const jPerLine=j=>[jLab(JOB_PER,j.per),JOB_VAT[j.vat]?JOB_VAT[j.vat][0]:''].filter(Boolean).join(', ');
const csv=x=>String(x||'').split(',').map(t=>t.trim()).filter(Boolean);
const isoOf=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const isoAdd=(iso,n)=>{ const d=new Date(iso+'T12:00:00'); d.setDate(d.getDate()+n); return isoOf(d); };
const isoToday=()=>isoOf(new Date());
const isoRange=(a,b)=>{ const out=[]; if(!a) return out; let d=a; const end=b&&b>=a?b:a; while(d<=end&&out.length<62){ out.push(d); d=isoAdd(d,1); } return out; };
const daysAgo=iso=>iso?Math.floor((Date.now()-new Date(iso))/86400000):null;
const agoTxt=n=>n==null?'never':n<1?'today':n===1?'yesterday':n+' days ago';
const jobsNew=()=>S.jobs?(S.jobs.open||[]).filter(j=>!j.my_answer&&j.my_day!=='busy').length:0;
function dayPill(st, self, many){
  const d=many?'those days':'that day';
  const m=self?{free:['approved','You are free '+d],busy:['pending','You marked '+(many?'those days':'this day')+' busy']}
    :{free:['approved','Free'],busy:['pending','Busy'],unmarked:['inactive','Days not marked'],hidden:['inactive','Days not shared']};
  return m[st]?`<span class="pill ${m[st][0]}">${m[st][1]}</span>`:''; }
const needsTags=j=>csv(j.needs).map(k=>`<span class="tag">${esc(jLab(JOB_NEEDS,k)||k)}</span>`).join('');
function jobStatusPill(j){
  if(j.status==='filled') return `<span class="pill approved">Given${j.taker?' to '+esc(j.taker.name):''}</span>`;
  if(j.status==='closed') return '<span class="pill inactive">Closed</span>';
  return j.n_yes?`<span class="pill high">Open · ${j.n_yes} available</span>`:'<span class="pill pending">Open · no answers yet</span>'; }
function jobCard(j, mode){
  const many=!!j.date_to;
  const st = mode==='open' ? (j.my_answer==='yes'?'<span class="pill approved">You said you\'re available</span>':j.my_answer==='no'?'<span class="pill inactive">You said not for you</span>':dayPill(j.my_day,true,many))
    : mode==='taken' ? (j.status==='closed'?'<span class="pill rejected">Cancelled by the poster</span>':'<span class="pill approved">This job is yours</span>') : jobStatusPill(j);
  const by = mode==='mine' ? (j.anon?'Posted without your name':'Posted with your name') : j.by ? 'Posted by '+j.by.name+(j.anon&&mode!=='taken'?' (without a name)':'') : 'Posted by a colleague';
  const dim=(mode==='open'&&(j.my_day==='busy'||j.my_answer==='no')&&j.my_answer!=='yes')||j.status==='closed';
  return `<button class="qcard bkcard jobcard${dim?' old':''}" type="button" data-job="${esc(j.id)}" data-mode="${mode}">
    <div class="jtop"><div><span class="cat">${esc(jKind(j))}</span><b>${esc(j.title)}</b></div><div class="jprice"><b>${esc(jMoney(j))}</b><span>${esc(jPerLine(j))}</span></div></div>
    <div class="qsub">${[bkRange(j,false),j.hours,j.region||j.start_place].filter(Boolean).map(esc).join(' · ')}${j.pax||j.langs?'<br>'+[j.pax,j.langs].filter(Boolean).map(esc).join(' · '):''}</div>
    <div class="flags">${needsTags(j)}${st}</div>
    <div class="jfoot">${esc(by)} · ${since(j.created_at)}${j.reply_by&&mode==='open'?' · answer by '+esc(ilDate(j.reply_by)):''}</div></button>`; }
function jobFind(id){ const J=S.jobs||{}; for(const k of ['taken','open','mine','all']){ const j=(J[k]||[]).find(x=>String(x.id)===String(id)); if(j) return [j,k]; } return [null,'']; }
function wireJobCards(root){ root.querySelectorAll('[data-job]').forEach(el=>el.onclick=()=>{ const k=el.dataset.mode, j=((S.jobs||{})[k]||[]).find(x=>String(x.id)===el.dataset.job); if(!j) return; (k==='mine'||k==='all')?openJobMine(j):openJob(j); }); }
const jviewSwitch=()=>`<div class="otabs vtabs" role="tablist" style="margin:12px 0 10px">${[['open','Open jobs'],['mine','My posts'],['days','My days']].filter(x=>x[0]!=='mine'||jobsPost()).map(([k,l])=>`<button class="otab" type="button" role="tab" data-jv="${k}" aria-selected="${S.jview===k}">${l}</button>`).join('')}</div>`;
async function reloadJobs(){ S.jobs=await DB.loadJobs(); if(S.tab==='jobs') render(); }
async function viewJobs(){
  const view=document.getElementById('view');
  if(!S.jobs){ view.innerHTML='<p class="hint" style="padding:24px 0">Loading jobs…</p>';
    try{ S.jobs=await DB.loadJobs(); }catch(e){ if(S.tab==='jobs') view.innerHTML=`<div class="msg err">Couldn't load jobs: ${esc(e.message)}</div>`; return; }
    if(S.tab==='jobs') render(); return; }
  if(S.jview==='mine'&&!jobsPost()) S.jview='open';
  const J=S.jobs, me=J.me||{};
  if(S.jview==='days'){ view.innerHTML=jviewSwitch()+'<div id="daysBody"></div>'; wireJview(); drawDays(); }
  else if(S.jview==='mine'){
    const open=J.mine.filter(j=>j.status==='open'), done=J.mine.filter(j=>j.status!=='open');
    view.innerHTML=jviewSwitch()+`<div class="qt-intro"><h2>My posts</h2><p>Jobs you posted. Tap one to see who is available and to give it to someone.</p></div>
      ${J.mine.length?'':`<div class="empty"><h3>Nothing posted yet</h3><p>Need a guide or a driver for a day? Post the job with the price you pay, and the colleagues it fits can say they're available.</p><button class="btn accent" id="jFirst" type="button">+ Post a job</button></div>`}
      ${open.length?`<p class="favs-h" style="margin:4px 2px 8px">Open</p>${open.map(j=>jobCard(j,'mine')).join('')}`:''}
      ${done.length?`<p class="favs-h" style="margin:14px 2px 8px">Given or closed</p>${done.map(j=>jobCard(j,'mine')).join('')}`:''}
      ${S.admin&&J.all&&J.all.length?`<p class="favs-h" style="margin:18px 2px 8px">Posted by colleagues · only you see who posted</p>${J.all.map(j=>jobCard(j,'all')).join('')}`:''}`;
    wireJview(); wireJobCards(view); const f=view.querySelector('#jFirst'); if(f) f.onclick=()=>openJobForm(null);
  } else {
    const age=daysAgo(me.updated_at), kinds=['All',...JOB_KINDS.map(k=>k[0]).filter(k=>J.open.some(j=>j.kind===k))];
    if(!kinds.includes(S.jkind)) S.jkind='All';
    const list=J.open.filter(j=>S.jkind==='All'||j.kind===S.jkind).sort((a,b)=>((a.my_day==='busy'||a.my_answer==='no')-(b.my_day==='busy'||b.my_answer==='no')));
    const nudge = !me.updated_at ? `<div class="bkban"><span>📅</span><span><b>Mark your busy days.</b> Then a colleague with a job sees at a glance whether you are free.<br><button class="mini" id="nDays" type="button" style="margin-top:6px">Open My days</button></span></div>`
      : age>=DAYS_STALE ? `<div class="bkban"><span>📅</span><span><b>Are your days still right?</b> Last updated ${agoTxt(age)}.<br><span class="btn-row" style="margin-top:6px"><button class="mini" id="nOk" type="button">Yes, still right</button><button class="mini" id="nDays" type="button">Update My days</button></span></span></div>` : '';
    const prof = me.kinds==='' ? `<div class="bkban"><span>👤</span><span><b>Say what jobs you take.</b> Until you do, every job is shown to you.<br><button class="mini" id="nProf" type="button" style="margin-top:6px">Set it in My days</button></span></div>` : '';
    view.innerHTML=jviewSwitch()+`<div class="qt-intro"><h2>Jobs from colleagues</h2><p>A colleague needs a guide or a driver for a date. The price shown is what you are paid, by them. No fee on any job.</p></div>
      ${nudge}${prof}
      ${J.taken.length?`<p class="favs-h" style="margin:4px 2px 8px">Given to you</p>${J.taken.map(j=>jobCard(j,'taken')).join('')}`:''}
      ${kinds.length>2?`<div class="chips" role="group" aria-label="Filter by kind of job">${kinds.map(k=>`<button class="chip" data-jk="${k}" aria-pressed="${S.jkind===k}">${k==='All'?'All':esc(jLab(JOB_KINDS,k))}</button>`).join('')}</div>`:''}
      ${list.length?`<p class="count">${list.length} open job${list.length>1?'s':''}${me.kinds?' that fit you':''}</p>${list.map(j=>jobCard(j,'open')).join('')}`
        :`<div class="empty"><h3>No open jobs right now</h3><p>When a colleague posts a job that fits you, it shows here and the Jobs tab gets a number.</p></div>`}`;
    wireJview(); wireJobCards(view);
    view.querySelectorAll('[data-jk]').forEach(c=>c.onclick=()=>{ S.jkind=c.dataset.jk; viewJobs(); });
    const go=()=>{ S.jview='days'; render(); };
    ['nDays','nProf'].forEach(id=>{ const b=view.querySelector('#'+id); if(b) b.onclick=go; });
    const ok=view.querySelector('#nOk'); if(ok) ok.onclick=async()=>{ try{ J.me=await DB.setDayPrefs({confirm:'true'}); toast('Thanks. Marked as up to date.'); viewJobs(); }catch(e){ toast(e.message); } };
  }
  if(S.openJob){ const id=S.openJob; S.openJob=null; const [j,k]=jobFind(id); if(j){ (k==='mine'||k==='all')?openJobMine(j):openJob(j); } else toast('That job is not open to you any more.'); }
}
function wireJview(){ document.querySelectorAll('[data-jv]').forEach(x=>x.onclick=()=>{ if(S.jview===x.dataset.jv) return; S.jview=x.dataset.jv; render(); }); }

// What both sides read: the job itself.
function jobRows(j){
  const r=(k,v)=>v?`<dt>${k}</dt><dd>${esc(v)}</dd>`:'';
  return `<dl class="dl">${r('Date',bkRange(j,false))}${r('Hours',j.hours)}${r('Starts at',j.start_place)}${r('Region',j.region)}${r('Group',j.pax)}${r('Language',j.langs)}${r('Must have',csv(j.needs).map(k=>jLab(JOB_NEEDS,k)).join(', '))}${r('Payment',j.payment)}${r('Answer by',j.reply_by?ilDate(j.reply_by):'')}</dl>
    ${j.note?`<div class="note"><div class="meta">${j.mine?'Your note':'From the colleague'}</div><p>${esc(j.note)}</p></div>`:''}`; }
const jobHead=j=>`<div style="margin:0 0 12px"><span class="cat">${esc(jKind(j))}</span><div style="font-family:var(--f-display);font-size:22px;line-height:1.2">${esc(j.title)}</div></div>

function phoneRow(name, role, phone){

  return `<div class="jbig"><b>${esc(name)}</b>${role?` <span class="hint">· ${esc(role)}</span>`:''}<br>${d?`<span class="mono">${esc(phone)}</span><div class="btn-row" style="margin-top:8px"><a class="btn soft" style="text-decoration:none" href="tel:${esc(d)}">Call</a><a class="btn soft" style="text-decoration:none" href="https://wa.me/${esc(intlDigits(d))}" target="_blank" rel="noopener">Chat on WhatsApp</a></div>`:'<span class="hint">No phone number on file. Ask Eretz Israel Tours.</span>'}</div>`; }
// "Add to my calendar": Google Calendar by link; Apple, Outlook and the rest by a calendar file.
function jobCalText(j, who){ return [jKind(j)+': '+j.title, j.hours?'Hours: '+j.hours:'', j.start_place?'Starts at: '+j.start_place:'', j.pax?'Group: '+j.pax:'', j.langs?'Language: '+j.langs:'', 'Pay: '+jMoney(j)+' '+jPerLine(j), j.payment?'Payment: '+j.payment:'', who||'', j.note||'', 'From The Inner Circle – Israel Guide'].filter(Boolean).join('\n'); }
function jobGcal(j, who){ const a=j.date_from.replace(/-/g,''), b=isoAdd(j.date_to||j.date_from,1).replace(/-/g,'');
  return 'https://calendar.google.com/calendar/render?action=TEMPLATE&text='+encodeURIComponent(j.title)+'&dates='+a+'/'+b+'&details='+encodeURIComponent(jobCalText(j,who))+(j.start_place?'&location='+encodeURIComponent(j.start_place):''); }
function jobIcs(j, who){
  const e=s=>String(s||'').replace(/\\/g,'\\\\').replace(/\r?\n/g,'\\n').replace(/([,;])/g,'\\$1');
  const fold=l=>{ const out=[]; while(l.length>70){ out.push(l.slice(0,70)); l=' '+l.slice(70); } out.push(l); return out.join('\r\n'); };
  const stamp=new Date().toISOString().replace(/[-:]/g,'').slice(0,15)+'Z';
  return ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Eretz Israel Tours//The Inner Circle//EN','CALSCALE:GREGORIAN','BEGIN:VEVENT','UID:job-'+j.id+'@vendors.eretzisraeltours.com','DTSTAMP:'+stamp,
    'DTSTART;VALUE=DATE:'+j.date_from.replace(/-/g,''),'DTEND;VALUE=DATE:'+isoAdd(j.date_to||j.date_from,1).replace(/-/g,''),'SUMMARY:'+e(j.title),'DESCRIPTION:'+e(jobCalText(j,who)),
    j.start_place?'LOCATION:'+e(j.start_place):'','TRANSP:OPAQUE','END:VEVENT','END:VCALENDAR'].filter(Boolean).map(fold).join('\r\n')+'\r\n'; }
function jobIcsDownload(j, who){ try{ const url=URL.createObjectURL(new Blob([jobIcs(j,who)],{type:'text/calendar;charset=utf-8'})); const a=document.createElement('a'); a.href=url; a.download='job-'+j.date_from+'.ics'; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),5000); }catch(e){ toast('Could not make the calendar file.'); } }
const calButtons=`<div class="jbig"><b>Add to my calendar</b><div class="btn-row" style="margin-top:8px"><a class="btn soft" id="calG" style="text-decoration:none" target="_blank" rel="noopener" href="#">Google Calendar</a><button class="btn soft" id="calI" type="button">Apple, Outlook or other</button></div><span class="hint" style="display:block;margin-top:6px">The second button saves a calendar file. Open it and your calendar offers to add the job.${LIVE?'':' In this preview the file cannot be saved; it works in the live app.'}</span></div>`;
function wireCal(w, j, who){ const g=w.querySelector('#calG'); if(g) g.href=jobGcal(j,who); const i=w.querySelector('#calI'); if(i) i.onclick=()=>jobIcsDownload(j,who); }

// A job as the colleague it was sent to sees it.
function openJob(j){
  const many=!!j.date_to, mine=j.taken_me&&j.status==='filled';
  const by=j.by?`Posted by ${esc(j.by.name)}${j.by.role?' · '+esc(j.by.role):''}`:'Posted by a colleague';
  const state = mine ? `<div class="msg ok" style="margin:0 0 14px">This job is yours. It is marked busy in My days.</div>${phoneRow(j.by?j.by.name:'The colleague who posted', j.by?j.by.role:'', j.by_phone)}${calButtons}`
    : j.taken_me ? `<div class="msg err" style="margin:0 0 14px">The colleague who posted cancelled this job. Its days were taken off My days.</div>`
    : j.my_answer==='yes' ? `<div class="msg ok" style="margin:0 0 14px">You said you're available. The colleague who posted now sees your name and chooses. If the job is given to you, it shows here under "Given to you".</div>`
    : j.my_answer==='no' ? `<div class="jnote">You said this one is not for you. You can still change your mind while it is open.</div>` : '';
  const foot = mine||j.taken_me ? `<button class="btn primary" id="jClose" type="button">Close</button>`
    : j.my_answer==='yes' ? `<button class="btn soft" id="jBack" type="button">Take it back</button><button class="btn primary" id="jClose" type="button">Close</button>`
    : `<button class="btn soft" id="jNo" type="button">Not for me</button><button class="btn soft" id="jBusy" type="button">I'm busy ${many?'then':'that day'}</button><button class="btn primary" id="jYes" type="button">I'm available</button>`;
  const w=sheet(mine?'Your job':'Job offer', `${jobHead(j)}<p class="hint" style="margin:-6px 0 12px">${by} · ${since(j.created_at)}</p>${state}${jobRows(j)}
    ${mine||j.taken_me?'':`<div class="flags" style="margin:0 0 12px">${dayPill(j.my_day,true,many)||'<span class="pill inactive">Your days are not marked yet</span>'}<span class="hint">from My days</span></div>
    <div class="jnote">If you tap "I'm available", the colleague who posted sees your name and role. You see theirs, with a phone number, when they give you the job. Saying you are available does not commit either side.</div>`}`, foot);
  wireCal(w, j, j.by?'Posted by: '+j.by.name+(j.by_phone?', '+j.by_phone:''):'');
  const c=w.querySelector('#jClose'); if(c) c.onclick=closeSheet;
  const act=async(ans,busy,msg)=>{ try{ await DB.answerJob(j.id,ans,busy); closeSheet(); toast(msg); await reloadJobs(); }catch(e){ toast(e.message); } };
  const y=w.querySelector('#jYes'); if(y) y.onclick=()=>act('yes',false,"Sent. They'll see you are available.");
  const n=w.querySelector('#jNo'); if(n) n.onclick=()=>act('no',false,'Marked as not for you.');
  const b=w.querySelector('#jBusy'); if(b) b.onclick=()=>act('no',true,many?'Marked those days busy in My days.':'Marked that day busy in My days.');
  const k=w.querySelector('#jBack'); if(k) k.onclick=()=>act('',false,'Taken back.');
}

// A job as its poster (or Eretz Israel Tours) sees it: who answered, and giving it to someone.
async function openJobMine(j){
  const tap2=(b,txt,fn)=>{ if(b) b.onclick=()=>{ if(b.dataset.c!=='1'){ b.dataset.c='1'; b.dataset.t=b.textContent; b.textContent=txt; setTimeout(()=>{ if(b.isConnected&&b.dataset.c==='1'){ b.dataset.c=''; b.textContent=b.dataset.t; } },4000); return; } fn(); }; };
  const run=async(fn,msg)=>{ try{ const nj=await fn(); toast(msg); S.jobs=await DB.loadJobs(); if(S.tab==='jobs') render(); const [fresh]=jobFind(j.id); if(fresh&&nj!==null) openJobMine(fresh); else closeSheet(); }catch(e){ toast(e.message); } };
  const who=j.by&&!j.mine?`<p class="hint" style="margin:-6px 0 12px">Posted by ${esc(j.by.name)}${j.anon?' · without a name':''} · ${since(j.created_at)}</p>`:`<p class="hint" style="margin:-6px 0 12px">${j.anon?'Posted without your name':'Posted with your name'} · ${since(j.created_at)}</p>`;
  const foot = j.status==='open' ? `<button class="btn danger" id="jCl" type="button">Close the job</button>${j.mine?'<button class="btn soft" id="jEd" type="button">Change it</button><button class="btn soft" id="jSh" type="button">Share</button>':''}`
    : `<button class="btn danger" id="jDel" type="button">Delete</button><button class="btn soft" id="jRe" type="button">Reopen</button><button class="btn primary" id="jClose" type="button">Close</button>`;
  const w=sheet(j.mine?'Your job':'A colleague\'s job', `${jobHead(j)}${who}<div class="flags" style="margin:0 0 12px">${jobStatusPill(j)}</div>
    ${j.status==='filled'&&j.taker?`<p class="favs-h" style="margin:0 2px 8px">Given to</p>${phoneRow(j.taker.name,j.taker.role,j.taker.phone)}${j.mine?calButtons:''}`:''}
    ${j.status==='open'?'<div id="jReplies"><p class="hint">Loading answers…</p></div>':''}${jobRows(j)}`, foot);
  wireCal(w, j, j.taker?'Given to: '+j.taker.name+(j.taker.phone?', '+j.taker.phone:''):'');
  const c=w.querySelector('#jClose'); if(c) c.onclick=closeSheet;
  tap2(w.querySelector('#jCl'),'Tap again to close it',()=>run(()=>DB.setJobStatus(j.id,'closed'),'Closed. Colleagues no longer see it.'));
  tap2(w.querySelector('#jRe'),'Tap again to reopen',()=>run(()=>DB.setJobStatus(j.id,'open'),'Open again.'));
  tap2(w.querySelector('#jDel'),'Tap again to delete',()=>run(async()=>{ await DB.deleteJob(j.id); return null; },'Deleted.'));
  const ed=w.querySelector('#jEd'); if(ed) ed.onclick=()=>openJobForm(j);
  const sh=w.querySelector('#jSh'); if(sh) sh.onclick=()=>openJobPosted(j,true);
  const box=w.querySelector('#jReplies'); if(!box) return;
  let rows=[]; try{ rows=await DB.jobReplies(j.id)||[]; }catch(e){ box.innerHTML=`<div class="msg err">${esc(e.message)}</div>`; return; }
  if(!box.isConnected) return;
  const yes=rows.filter(r=>r.answer==='yes'), rest=rows.filter(r=>r.answer!=='yes');
  const line=r=>`${[r.role,r.langs,csv(r.tags).map(k=>jLab(JOB_NEEDS,k)).join(', ')].filter(Boolean).map(esc).join(' · ')}`;
  box.innerHTML=`<p class="favs-h" style="margin:0 2px 8px">${j.audience==='picked'?`Sent to ${j.n_sent}`:'Open to every colleague it fits'} · ${yes.length} available${j.audience==='picked'?` · ${rest.filter(r=>!r.answer).length} no answer`:''}${j.n_no?` · ${j.n_no} said no`:''}</p>
    ${yes.length?yes.map(r=>`<div class="qcard"><div class="qhead"><b>${esc(r.name)}</b><span class="pill approved">Available</span>${dayPill(r.day,false)}</div><div class="qsub">${line(r)}</div>
      <div class="qsub">Answered ${since(r.answered_at)}</div><div class="btn-row" style="margin-top:10px"><button class="btn primary" type="button" data-give="${esc(r.id)}" data-n="${esc(r.name)}">Give ${esc(r.name.split(' ')[0])} the job</button></div></div>`).join('')
      :`<div class="jnote">Nobody has said they are available yet. ${j.mine?'You can share the job on WhatsApp to nudge people.':''}</div>`}
    ${rest.length?`<div class="list" style="margin:0 0 14px">${rest.map(r=>`<div class="prow"><span class="pn"><b>${esc(r.name)}</b><span>${line(r)}</span></span><span class="pill inactive">${r.answer==='no'?'Not for them':'No answer yet'}</span></div>`).join('')}</div>`:''}
    ${yes.length?`<div class="jnote">When you give someone the job, they get your name and phone and you get theirs. The others are told the job is no longer open. You pay the colleague directly.</div>`:''}`;
  box.querySelectorAll('[data-give]').forEach(b=>tap2(b,'Tap again: give '+b.dataset.n+' the job',()=>run(()=>DB.giveJob(j.id,b.dataset.give),'Done. '+b.dataset.n+' has the job.')));
}

// Post a job, step 2: who gets it.
async function openJobSend(d){
  const w=sheet('Who gets it', `<div class="bkfill"><b>${esc(d.title)}</b><br>${esc(jKind(d))} · ${esc(bkRange(d,false))}${d.region?' · '+esc(d.region):''} · <span class="mono">${esc(jMoney(d))}</span> ${esc(jPerLine(d))}</div>
    <div class="otabs vtabs" role="tablist"><button class="otab" type="button" role="tab" data-aud="all" aria-selected="${d.audience!=='picked'}">Everyone it fits</button><button class="otab" type="button" role="tab" data-aud="picked" aria-selected="${d.audience==='picked'}">Let me pick</button></div>
    <div id="jsBody"><p class="hint">Finding the colleagues this job fits…</p></div><div id="jsMsg"></div>`,
    `<button class="btn soft" id="jsBack" type="button">Back</button><button class="btn primary" id="jsPost" type="button" disabled>Post</button>`);
  w.querySelector('#jsBack').onclick=()=>openJobForm(d.id?Object.assign({},d):null);
  let people=[]; try{ people=await DB.jobCandidates(d)||[]; }catch(e){ w.querySelector('#jsBody').innerHTML=`<div class="msg err">${esc(e.message)}</div>`; return; }
  if(!w.isConnected) return;
  let picked=new Set(people.filter(p=>p.day==='free').map(p=>String(p.id)));
  if(d.id){ try{ const prev=(await DB.jobReplies(d.id)||[]).filter(r=>r.picked).map(r=>String(r.id)); if(prev.length) picked=new Set(prev); }catch(e){} if(!w.isConnected) return; }
  const post=w.querySelector('#jsPost'), body=w.querySelector('#jsBody');
  const free=people.filter(p=>p.day==='free').length;
  const sub=p=>[p.role,p.langs,csv(p.tags).map(k=>jLab(JOB_NEEDS,k)).join(', '),p.profile?'':'has not said what jobs they take',p.day!=='hidden'&&p.days_age!=null&&p.days_age>=DAYS_STALE?'days updated '+agoTxt(p.days_age):''].filter(Boolean).map(esc).join(' · ');
  const draw=()=>{ const pick=d.audience==='picked';
    w.querySelectorAll('[data-aud]').forEach(x=>x.setAttribute('aria-selected',x.dataset.aud===d.audience||(!pick&&x.dataset.aud==='all')));
    body.innerHTML = !people.length ? `<div class="jnote warn">No colleague fits this job yet. ${d.needs?'Try with fewer must-haves, or p':'P'}ost it anyway: it shows to anyone who fits later.</div>`
      : `<p class="count" style="margin-top:6px">${people.length} colleague${people.length>1?'s':''} fit${people.length>1?'':'s'}${d.date_from?` · ${free} free on ${esc(ilDate(d.date_from).slice(0,5))}`:''}</p>
        <div class="list" style="margin:0 0 14px">${people.map(p=>`<label class="prow" for="jp_${esc(p.id)}">${pick?`<input id="jp_${esc(p.id)}" type="checkbox" data-p="${esc(p.id)}" ${picked.has(String(p.id))?'checked':''}>`:''}<span class="pn"><b>${esc(p.name)}</b><span>${sub(p)}</span></span>${dayPill(p.day,false)}</label>`).join('')}</div>
        <div class="jnote">${pick?'Only the people you tick see this job.':'Everyone on this list sees the job, and so does anyone who fits it later.'} They get a number on their Jobs tab. After posting you can also share it on WhatsApp.</div>`;
    body.querySelectorAll('[data-p]').forEach(c=>c.onchange=()=>{ c.checked?picked.add(c.dataset.p):picked.delete(c.dataset.p); label(); });
    label(); };
  const label=()=>{ const n=d.audience==='picked'?picked.size:people.length; post.disabled=d.audience==='picked'&&!n; post.textContent=d.audience==='picked'?(n?`Post to ${n} colleague${n>1?'s':''}`:'Tick at least one'):(d.id?'Save':'Post the job'); };
  w.querySelectorAll('[data-aud]').forEach(x=>x.onclick=()=>{ d.audience=x.dataset.aud; draw(); });
  post.onclick=async()=>{ post.disabled=true; try{ const saved=await DB.saveJob(d, d.audience==='picked'?[...picked]:[]); S.jobDraft=null; S.jview='mine'; S.jobs=await DB.loadJobs(); if(S.tab==='jobs') render(); const [fresh]=jobFind(saved.id); openJobPosted(fresh||saved); }
    catch(e){ w.querySelector('#jsMsg').innerHTML=`<div class="msg err">${esc(e.message)}</div>`; post.disabled=false; } };
  draw();
}
// The WhatsApp message for a job: Hebrew, then English, with a link that opens the job in the app.

// My days: a month to tap. Busy days are stored; everything else is free.
function drawDays(){
  const box=document.getElementById('daysBody'); if(!box||!S.jobs) return; const me=S.jobs.me;
  const now=new Date(), td=isoToday(); if(!S.cal) S.cal={y:now.getFullYear(),m:now.getMonth()};
  const {y,m}=S.cal, first=new Date(y,m,1), n=new Date(y,m+1,0).getDate(), lead=first.getDay();

function openTour(replay){
  closeSheet(); const old=document.getElementById('tourWrap'); if(old) old.remove();
  const steps=tourSteps(replay), last=steps.length-1; let i=0;
  const w=document.createElement('div'); w.id='tourWrap'; w.className='tour'; w.setAttribute('role','dialog'); w.setAttribute('aria-modal','true'); w.setAttribute('aria-label','Welcome tour');
  document.body.appendChild(w);
  const end=()=>{ tourDone(); w.remove(); };
  const draw=()=>{
    w.innerHTML=`<div class="tour-in">${i?`<div class="tour-top"><span class="tour-n">${i} of ${last}</span><div class="tour-bar" aria-hidden="true">${steps.slice(1).map((x,k)=>`<i${k<i?' class="on"':''}></i>`).join('')}</div>${i<last?'<button class="tour-skip" type="button" data-t="skip">Skip</button>':'<span style="width:12px"></span>'}</div>`:''}
      <div class="tour-body">${steps[i].html}</div>
      <div class="tour-foot">${i?'<button class="btn soft" type="button" data-t="back">Back</button>':''}<button class="btn ${i===last?'accent':'primary'} go" type="button" data-t="next">${i===0?'Show me around':i===last?'Start using the list':'Next'}</button></div></div>`;
    wireCopy(w);
    w.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{ const a=b.dataset.t;
      if(a==='terms') return openTerms();
      if(a==='next'){ if(i===last) return end(); i++; } else if(a==='back'){ i--; } else if(a==='skip'){ i=last; }
      draw(); });
  };
  draw();
}
