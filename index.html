<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Israel Suppliers Master List</title>
<meta name="theme-color" content="#1f3a2e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Suppliers List">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600&family=Secular+One&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one-column field app — sticky header, tab bar at the bottom, sheets slide up for forms. */
:root{
  --ink:#16261e; --ink-2:#4a5a50; --ink-3:#7c8a80;
  --ground:#f3f5f1; --card:#ffffff; --line:#dde3db; --wash:#e8ede5;
  --olive:#1f3a2e; --olive-2:#2c5140; --ochre:#b8742a; --ochre-wash:#f6ead9;
  --ok:#2f7a4a; --ok-wash:#e3f1e7; --warn:#a66a12; --warn-wash:#fbefd9; --bad:#a63b2e; --bad-wash:#f8e3df;
  --on-olive:#f3f5f1; --tab-on:#2c5140; --mark:#1f3a2e;
  --f-display:"Secular One","Rubik",system-ui,sans-serif;
  --f-body:"Rubik",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --ink:#e6ebe4; --ink-2:#b0bcb2; --ink-3:#86938a;
  --ground:#121a15; --card:#1a241e; --line:#2c3a31; --wash:#223029;
  --olive:#2c5140; --olive-2:#3b6a54; --ochre:#e0a15a; --ochre-wash:#3a2c1a;
  --ok:#6cc58c; --ok-wash:#1d3325; --warn:#e7b35d; --warn-wash:#3a2e17; --bad:#ef8a7b; --bad-wash:#3b211d;
  --on-olive:#f3f5f1; --tab-on:#e0a15a; --mark:#e6ebe4; color-scheme:dark}}
:root[data-theme="dark"]{
  --ink:#e6ebe4; --ink-2:#b0bcb2; --ink-3:#86938a;
  --ground:#121a15; --card:#1a241e; --line:#2c3a31; --wash:#223029;
  --olive:#2c5140; --olive-2:#3b6a54; --ochre:#e0a15a; --ochre-wash:#3a2c1a;
  --ok:#6cc58c; --ok-wash:#1d3325; --warn:#e7b35d; --warn-wash:#3a2e17; --bad:#ef8a7b; --bad-wash:#3b211d;
  --on-olive:#f3f5f1; --tab-on:#e0a15a; --mark:#e6ebe4; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--ground);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--ochre);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--olive);color:var(--on-olive);padding:12px 16px}
.top-row{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:12px}
.brand{font-family:var(--f-display);font-size:21px;letter-spacing:.2px;line-height:1}
.brand small{display:block;font-family:var(--f-body);font-size:11px;letter-spacing:1.2px;text-transform:uppercase;opacity:.7;margin-top:4px}
.who{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:13px;opacity:.9;min-width:0}
.who span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:40vw}
.ghost-btn{background:transparent;border:1px solid rgba(243,245,241,.35);color:var(--on-olive);border-radius:999px;padding:5px 12px;font-size:13px}
.demo-bar{background:var(--ochre-wash);color:var(--ink);font-size:13px;padding:8px 16px;text-align:center;border-bottom:1px solid var(--line)}

main{max-width:760px;margin:0 auto;padding:16px 16px 110px}
.search{display:flex;gap:8px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:0 12px}
.search input{flex:1;min-width:0;border:0;background:transparent;padding:12px 0;outline:none;font-size:16px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:12px 0 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-size:13px;color:var(--ink-2)}
.chip[aria-pressed="true"]{background:var(--olive);border-color:var(--olive);color:var(--on-olive)}
.count{font-size:12px;letter-spacing:1px;text-transform:uppercase;color:var(--ink-3);margin:14px 2px 8px}

.list{display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.row{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:14px 16px;border:0;border-bottom:1px solid var(--line);background:transparent;text-align:left;width:100%}
.row:last-child{border-bottom:0}
.row:hover{background:var(--wash)}
.row-name{font-weight:600;font-size:16px;min-width:0;overflow-wrap:anywhere}
.row-meta{grid-column:1;font-size:13px;color:var(--ink-2);display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center}
.row-price{grid-column:2;grid-row:1 / span 2;text-align:right;align-self:center}
.row-price b{display:block;font-family:var(--f-mono);font-weight:500;font-size:15px}
.row-price span{font-size:12px;color:var(--ink-3)}
.cat{font-size:11px;letter-spacing:.8px;text-transform:uppercase;color:var(--ochre);font-weight:600}
.pill{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.4px;border-radius:999px;padding:2px 8px}
.pill.approved{background:var(--ok-wash);color:var(--ok)}
.pill.pending{background:var(--warn-wash);color:var(--warn)}
.pill.rejected{background:var(--bad-wash);color:var(--bad)}
.pill.inactive{background:var(--wash);color:var(--ink-3)}
.empty{padding:36px 20px;text-align:center;color:var(--ink-2)}
.empty h3{font-family:var(--f-display);font-weight:400;font-size:20px;margin:0 0 6px;color:var(--ink)}

.fab{position:fixed;right:16px;bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:6;background:var(--ochre);color:#1b1206;border:0;border-radius:999px;padding:14px 20px;font-weight:600;box-shadow:0 6px 18px rgba(0,0,0,.18)}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--card);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;gap:4px}
.tab{flex:1;max-width:180px;border:0;background:transparent;padding:8px 4px;border-radius:8px;font-size:13px;color:var(--ink-3);display:flex;flex-direction:column;align-items:center;gap:3px;position:relative}
.tab svg{width:22px;height:22px}
.tab[aria-current="page"]{color:var(--tab-on);font-weight:600}
.badge{position:absolute;top:2px;left:calc(50% + 6px);background:var(--ochre);color:#1b1206;font-size:10px;font-weight:700;border-radius:999px;padding:1px 6px}

/* buttons */
.btn{border:0;border-radius:8px;padding:11px 16px;font-weight:600;font-size:15px}
.btn.primary{background:var(--olive);color:var(--on-olive)}
.btn.accent{background:var(--ochre);color:#1b1206}
.btn.soft{background:var(--wash);color:var(--ink)}
.btn.danger{background:var(--bad-wash);color:var(--bad)}
.btn:disabled{opacity:.5;cursor:default}
.btn-row{display:flex;gap:8px;flex-wrap:wrap}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(10,18,14,.45);z-index:20}
.sheet{position:fixed;left:0;right:0;bottom:0;top:calc(24px + env(safe-area-inset-top,0px));z-index:21;background:var(--ground);border-radius:16px 16px 0 0;display:flex;flex-direction:column;max-width:760px;margin:0 auto;box-shadow:0 -8px 30px rgba(0,0,0,.2)}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .22s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}}
.sheet-head{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.sheet-head h2{font-family:var(--f-display);font-weight:400;font-size:20px;margin:0;flex:1;min-width:0;overflow-wrap:anywhere}
.x{border:0;background:var(--wash);border-radius:999px;width:34px;height:34px;font-size:18px;line-height:1}
.sheet-body{flex:1;overflow-y:auto;padding:16px 16px 24px}
.sheet-foot{padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--card);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}

fieldset{border:0;margin:0 0 18px;padding:0}
legend{font-size:11px;letter-spacing:1.2px;text-transform:uppercase;color:var(--ink-3);font-weight:600;margin-bottom:8px;padding:0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.f.wide{grid-column:1 / -1}
.f label{font-size:13px;color:var(--ink-2)}
.f label em{color:var(--bad);font-style:normal}
.f input,.f select,.f textarea{width:100%;border:1px solid var(--line);background:var(--card);border-radius:8px;padding:10px 11px;font-size:16px}
.f textarea{resize:vertical;min-height:64px}
.hint{font-size:12px;color:var(--ink-3)}
.dup{background:var(--warn-wash);color:var(--warn);border-radius:8px;padding:10px 12px;font-size:13px;margin-top:8px}
.stars{display:flex;gap:4px}
.stars button{border:1px solid var(--line);background:var(--card);border-radius:8px;width:38px;height:38px;font-family:var(--f-mono)}
.stars button[aria-pressed="true"]{background:var(--ochre);border-color:var(--ochre);color:#1b1206;font-weight:600}

/* detail */
.dl{display:grid;grid-template-columns:minmax(110px,38%) 1fr;gap:8px 14px;margin:0 0 18px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.dl dt{font-size:13px;color:var(--ink-3)}
.dl dd{margin:0;min-width:0;overflow-wrap:anywhere}
.stamp{font-size:12px;color:var(--ink-3);margin-top:-6px}
.idtag{font-family:var(--f-mono);font-size:12px;color:var(--ink-3)}

/* panels */
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px}
.panel h3{font-family:var(--f-display);font-weight:400;font-size:19px;margin:0 0 4px}
.panel p{margin:0 0 12px;color:var(--ink-2);font-size:14px}
.rev{display:flex;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.rev:first-of-type{border-top:0}
.rev .who2{flex:1;min-width:180px}
.rev .who2 b{display:block}
.rev .who2 span{font-size:13px;color:var(--ink-2)}
.person{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.person span{flex:1;min-width:0;overflow-wrap:anywhere}
.addrow{display:flex;gap:8px;flex-wrap:wrap}
.addrow input{flex:1;min-width:180px;border:1px solid var(--line);background:var(--ground);border-radius:8px;padding:10px 11px;font-size:16px}
textarea.out{width:100%;min-height:160px;font-family:var(--f-mono);font-size:12px;border:1px solid var(--line);border-radius:8px;background:var(--ground);padding:10px}

/* sign in */
.gate{min-height:100%;display:flex;align-items:center;justify-content:center;padding:32px 16px}
.gate-card{width:100%;max-width:400px}
.gate .mark{font-family:var(--f-display);font-size:34px;color:var(--mark);line-height:1.05;margin:0 0 6px}
.gate p{color:var(--ink-2);margin:0 0 22px}
.gate .f{margin-bottom:12px}
.gate .btn{width:100%}
.msg{margin-top:14px;font-size:14px;border-radius:8px;padding:10px 12px}
.msg.ok{background:var(--ok-wash);color:var(--ok)}
.msg.err{background:var(--bad-wash);color:var(--bad)}
.files{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px;margin-bottom:12px}
.file{position:relative;display:flex;flex-direction:column;gap:4px;min-width:0}
.file a.thumb{display:flex;align-items:center;justify-content:center;aspect-ratio:1;max-width:100%;border:1px solid var(--line);border-radius:8px;background:var(--wash);overflow:hidden;text-decoration:none;color:var(--ink-2)}
.file a.thumb img{width:100%;height:100%;object-fit:cover}
.file .doc{font-family:var(--f-mono);font-size:13px;font-weight:500;color:var(--bad)}
.file .fname{font-size:12px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.file .fkind{font-size:10px;letter-spacing:.8px;text-transform:uppercase;color:var(--ochre);font-weight:600}
.file .rm{position:absolute;top:4px;right:4px;border:0;border-radius:999px;background:var(--card);color:var(--bad);font-size:12px;padding:3px 8px;box-shadow:0 1px 4px rgba(0,0,0,.15)}
.upl{display:flex;gap:8px;flex-wrap:wrap;align-items:center;background:var(--card);border:1px dashed var(--line);border-radius:var(--r);padding:12px}
.upl select{border:1px solid var(--line);background:var(--ground);border-radius:8px;padding:9px 10px;font-size:15px}
.upl .hint{flex-basis:100%}
.clip{font-size:12px;color:var(--ink-3)}
.actions{display:grid;grid-template-columns:repeat(auto-fit,minmax(72px,1fr));gap:8px;margin:0 0 16px}
.act{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 4px;border-radius:10px;background:var(--card);border:1px solid var(--line);color:var(--ink);text-decoration:none;font-size:12px;font-weight:500}
.act svg{width:22px;height:22px;color:var(--olive-2)}
:root:not([data-theme="light"]) .act svg{color:var(--tab-on)}
.act:active{background:var(--wash)}
.prices{display:flex;flex-direction:column;gap:8px;margin-bottom:10px}
.pl{display:grid;grid-template-columns:1fr auto;gap:2px 12px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.pl .who3{font-weight:600;min-width:0;overflow-wrap:anywhere}
.pl .amt{font-family:var(--f-mono);font-weight:500;text-align:right}
.pl .meta{grid-column:1 / -1;font-size:12px;color:var(--ink-3)}
.pl .ctl{grid-column:1 / -1;display:flex;gap:6px;margin-top:4px}
.mini{border:1px solid var(--line);background:var(--ground);border-radius:8px;padding:5px 10px;font-size:13px}
.tag{display:inline-block;font-size:10px;letter-spacing:.6px;text-transform:uppercase;font-weight:600;border-radius:4px;padding:1px 6px;background:var(--wash);color:var(--ink-2);margin-right:4px}
.tag.agent{background:var(--ok-wash);color:var(--ok)}
.deal{background:var(--ochre-wash);border-radius:10px;padding:10px 12px;margin-bottom:8px}
.deal b{display:block}
.deal .meta{font-size:12px;color:var(--ink-2)}
.deal.expired{opacity:.55}
.code{font-family:var(--f-mono);background:var(--card);border:1px dashed var(--ochre);border-radius:6px;padding:1px 6px}
.note{border-left:3px solid var(--line);padding:4px 0 4px 10px;margin-bottom:10px}
.note .meta{font-size:12px;color:var(--ink-3)}
.note p{margin:2px 0 0;white-space:pre-wrap;overflow-wrap:anywhere}
.addline{display:flex;gap:8px;align-items:flex-start;margin-bottom:12px}
.addline textarea{flex:1;min-width:0;border:1px solid var(--line);background:var(--card);border-radius:8px;padding:10px;font-size:16px;min-height:44px;resize:vertical}
.lock{font-size:11px;color:var(--ink-3);font-weight:500}
.lockbar{background:var(--wash);border-radius:8px;padding:10px 12px;font-size:13px;color:var(--ink-2);margin-bottom:14px}
.diff{width:100%;border-collapse:collapse;font-size:13px;margin:6px 0}
.diff td,.diff th{padding:4px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top;overflow-wrap:anywhere}
.diff th{font-weight:500;color:var(--ink-3);font-size:12px}
.diff .old{color:var(--bad);text-decoration:line-through}
.diff .new{color:var(--ok);font-weight:600}
.sug{position:relative}
.sug-list{position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:8;background:var(--card);border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 20px rgba(0,0,0,.12);overflow:hidden}
.sug-list button{display:flex;gap:8px;width:100%;text-align:left;border:0;background:transparent;padding:10px 14px;font-size:15px;border-bottom:1px solid var(--line)}
.sug-list button:last-child{border-bottom:0}
.sug-list button:hover,.sug-list button.on{background:var(--wash)}
.sug-list .k{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--ochre);margin-left:auto;align-self:center}
.sec-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.sec-head legend{margin:0}
.sec-head .mini{margin-left:auto}
.qcard{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px}
.qcard.old{opacity:.6}
.qhead{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:baseline}
.qhead b{font-size:16px}
.qsub{font-size:13px;color:var(--ink-2);margin-top:2px}
.otabs{display:flex;gap:6px;overflow-x:auto;margin:10px 0 8px;scrollbar-width:none}
.otabs::-webkit-scrollbar{display:none}
.otab{flex:none;border:1px solid var(--line);background:var(--ground);border-radius:8px;padding:6px 10px;font-size:13px;max-width:70vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.otab[aria-selected="true"]{background:var(--olive);border-color:var(--olive);color:var(--on-olive)}
.otab .ot{font-family:var(--f-mono);font-size:12px;opacity:.85;margin-left:6px}
.qlines{width:100%;border-collapse:collapse;font-size:14px}
.qlines td{padding:6px 4px;border-bottom:1px solid var(--line);vertical-align:top}
.qlines td.n{text-align:right;font-family:var(--f-mono);white-space:nowrap}
.qlines tr.tot td{border-bottom:0;font-weight:600;padding-top:8px}
.qlines .how{font-size:12px;color:var(--ink-3)}
.qlines .k{font-size:10px;text-transform:uppercase;letter-spacing:.6px;color:var(--ochre);font-weight:600;margin-right:4px}
.lineed{display:grid;grid-template-columns:1fr;gap:6px;background:var(--ground);border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:8px}
.lineed .r{display:flex;gap:6px;flex-wrap:wrap}
.lineed input,.lineed select{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:8px;font-size:15px;min-width:0}
.lineed .lbl{flex:1 1 100%}
.lineed .sm{flex:1 1 70px;max-width:110px}
.lineed .md{flex:2 1 140px}
.lineed .lt{font-family:var(--f-mono);font-size:13px;color:var(--ink-2);align-self:center;margin-left:auto}
.presets{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 10px}
.switch{display:flex;gap:10px;align-items:center;background:var(--wash);border-radius:10px;padding:10px 12px}
.switch input{width:20px;height:20px}
.terms h4{font-family:var(--f-display);font-weight:400;font-size:17px;margin:16px 0 4px}
.terms p{margin:0 0 8px;line-height:1.5}
.check{display:flex;gap:10px;align-items:flex-start;margin:6px 0 14px;font-size:14px}
.check input{width:20px;height:20px;flex:none;margin-top:1px}
.linkbtn{border:0;background:none;padding:0;color:var(--olive-2);text-decoration:underline;font:inherit;cursor:pointer}
.resbar{border:1px solid var(--ochre);background:var(--ochre-wash);border-radius:12px;padding:12px 14px;margin:0 0 16px}
.resbar b{display:block;margin-bottom:2px}
.resbar .meta{font-size:13px;color:var(--ink-2)}
.resbar .btn-row{margin-top:10px}
.sitelist{display:flex;flex-direction:column;gap:6px;margin-bottom:10px}
.sitelist button{display:flex;justify-content:space-between;gap:8px;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:10px 12px;font-size:15px}
.sitelist .hint{white-space:nowrap}
.parentlink{border:0;background:var(--wash);border-radius:999px;padding:4px 10px;font-size:13px;color:var(--ink-2)}
.modal{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(10,18,14,.5)}
.modal-card{background:var(--card);border-radius:16px;max-width:420px;width:100%;padding:20px;box-shadow:0 10px 40px rgba(0,0,0,.3)}
.modal-card h3{font-family:var(--f-display);font-weight:400;font-size:21px;margin:0 0 8px}
.modal-card p{margin:0 0 14px;color:var(--ink-2)}
.modal-card .btn{width:100%;margin-bottom:8px}

      const row=Object.assign({id:newId(),review_status:'approved',created_by:S.user.email,updated_by:S.user.email,created_at:now,updated_at:now,_files:0},payload); S.vendors.push(row); return row;
    }
    const res = await rpc('vendor_save',{p_data:Object.assign(v.id?{id:v.id}:{},payload),p_reason:reason||''});
    const data = res.vendor; const i=S.vendors.findIndex(x=>x.id===data.id); if(i>=0) S.vendors[i]=data; else S.vendors.push(data);
    data._request = !!res.request; return data;
  },
  async setStatus(id, status){
    if(!LIVE){ S.vendors.find(x=>x.id===id).review_status=status; return; }
    const data = await rpc('vendor_set_status',{p_id:id,p_status:status});
    const i=S.vendors.findIndex(x=>x.id===id); S.vendors[i]=data;
  },
  async remove(id){ if(LIVE) await rpc('vendor_delete',{p_id:id}); S.vendors = S.vendors.filter(x=>x.id!==id); },
  async listFiles(vid, qid){
    if(!LIVE) return (S.files[qid||vid]||[]).slice();
    return (await filesApi('list',{vendor_id:vid,quote_id:qid||undefined})).files;
  },
  async upload(vid, file, kind, qid){
    if(!LIVE){ const path=vid+'/'+Date.now(); (S.files[qid||vid]=S.files[qid||vid]||[]).unshift({id:path,path,vendor_id:vid,file_name:file.name,mime_type:file.type||'',size_bytes:file.size,kind,uploaded_by:S.user.email,created_at:new Date().toISOString(),url:URL.createObjectURL(file)}); }
    else {
      const sig = await filesApi('sign_upload',{vendor_id:vid,file_name:file.name,quote_id:qid||undefined});
      const up = await sb.storage.from('vendor-files').uploadToSignedUrl(sig.path, sig.upload_token, file, {contentType:file.type||undefined});
      if(up.error) throw new Error(up.error.message);
      await filesApi('confirm',{vendor_id:vid,path:sig.path,file_name:file.name,mime_type:file.type||'',size_bytes:file.size,kind,quote_id:qid||undefined});
    }
    const v=S.vendors.find(x=>x.id===vid); if(v && !qid) v._files=(v._files||0)+1;
  },
  async removeFile(f){
    if(LIVE) await filesApi('delete',{file_id:f.id});
    else { const key=f.quote_id||f.vendor_id; S.files[key]=(S.files[key]||[]).filter(x=>x.id!==f.id); }
    const v=S.vendors.find(x=>x.id===f.vendor_id); if(v) v._files=Math.max(0,(v._files||1)-1);
  },
  async requestAccess(name,email,role,license,phone,note,terms){
    const { data, error } = await sb.rpc('request_access',{p_name:name,p_email:email,p_role:role,p_license:license,p_phone:phone,p_note:note,p_terms:terms});
    if(error) throw new Error(error.message);
    S.token=data.token; try{ localStorage.setItem(TOKEN_KEY,S.token); }catch(e){}
    await DB.loadMe();
  },
  async uploadProof(file){
    const sig = await filesApi('proof_upload_url',{file_name:file.name});
    const up = await sb.storage.from('member-proofs').uploadToSignedUrl(sig.path, sig.upload_token, file, {contentType:file.type||undefined});
    if(up.error) throw new Error(up.error.message);
    await filesApi('proof_confirm',{path:sig.path,mime_type:file.type||''});
    if(S.me) S.me.has_proof=true;
  },
  async proofUrl(id){ if(!LIVE) return null; return (await filesApi('proof_view',{member_id:id})).url; },
  async acceptTerms(){ if(!LIVE) return; const { error } = await sb.rpc('accept_terms',{p_token:S.token,p_version:TERMS_VERSION}); if(error) throw new Error(error.message); S.me.terms_version=TERMS_VERSION; },
  async setPricesPrivate(vid,on){ if(!LIVE){ (await DB.detail(vid)).prices_private=on; const v=S.vendors.find(x=>x.id===vid); if(v) v.prices_private=on; return; } await rpc('vendor_set_prices_private',{p_id:vid,p_private:on}); await DB.loadVendors(); },
  async decide(id,status){
    if(!LIVE){ S.members.find(m=>m.id===id).status=status; return; }
    await rpc('member_decide',{p_id:id,p_status:status}); await DB.loadTeam();
  },
  async newLink(id){
    if(!LIVE){ const m=S.members.find(x=>x.id===id); if(m.status==='revoked') m.status='approved'; return 'sample'+Math.random().toString(16).slice(2); }
    const t = await rpc('member_new_link',{p_id:id}); await DB.loadTeam(); return t;
  }
};

async function sendProof(file, out){
  if(!file){ return false; }
  if(!/^image\/|^application\/pdf$/.test(file.type)){ out.innerHTML='<div class="msg err">Upload a photo or a PDF of your license.</div>'; return false; }
  const f = await shrink(file);
  if(f.size>10485760){ out.innerHTML='<div class="msg err">That file is over 10 MB. Take a photo instead.</div>'; return false; }
  await DB.uploadProof(f); return true;
}

function suggestTerms(){
  const seen=new Map();
  const add=(t,kind)=>{ t=String(t||'').trim(); if(t.length<2) return; const k=t.toLowerCase(); if(!seen.has(k)) seen.set(k,{t,kind}); };
  S.vendors.forEach(v=>{ add(v.name,'Supplier'); add(v.region,'Region'); add(v.location,'Area'); add(v.contactPerson,'Contact'); add(v.category,'Category'); String(v.tags||'').split(',').forEach(t=>add(t,'Type')); });
  return [...seen.values()];
}
function viewVendors(){
  const view=document.getElementById('view');
  const cats=['All',...CATEGORIES.filter(c=>S.vendors.some(v=>v.category===c))];
  view.innerHTML = `
    <div class="sug"><label class="search" for="q">${icons.search}<input id="q" type="search" placeholder="Search name, region, type, contact" value="${esc(S.q)}" autocomplete="off" role="combobox" aria-autocomplete="list" aria-controls="sugList" aria-expanded="false"></label>
    <div class="sug-list" id="sugList" role="listbox" hidden></div></div>
    <div class="chips" role="group" aria-label="Filter by category">${cats.map(c=>`<button class="chip" data-cat="${esc(c)}" aria-pressed="${S.cat===c}">${esc(c)}</button>`).join('')}</div>
    <div class="chips" role="group" aria-label="Filter by region" style="padding-top:2px">${['All',...[...new Set(REGIONS.filter(r=>S.vendors.some(v=>v.region===r)).concat(S.vendors.map(v=>v.region).filter(r=>r&&!REGIONS.includes(r))))]].map(r=>`<button class="chip" data-reg="${esc(r)}" aria-pressed="${S.reg===r}">${r==='All'?'📍 All regions':esc(r)}</button>`).join('')}</div>
    <div id="results"></div>`;
  const q=document.getElementById('q'), list=document.getElementById('sugList'); let hits=[], on=-1;
  const close=()=>{ list.hidden=true; q.setAttribute('aria-expanded','false'); on=-1; };
  const pick=h=>{ if(h.kind==='Region'&&REGIONS.concat(S.vendors.map(v=>v.region)).includes(h.t)){ S.reg=h.t; S.q=''; viewVendors(); return; } if(h.kind==='Category'&&CATEGORIES.includes(h.t)){ S.cat=h.t; S.q=''; viewVendors(); return; }
    q.value=h.t; S.q=h.t; close(); drawList(); if(h.kind==='Supplier'){ const v=S.vendors.find(x=>x.name===h.t); if(v) openDetail(v.id); } };
  const show=()=>{
    const n=normN(q.value); if(!n){ close(); return; }
    const terms=suggestTerms();
    hits = terms.filter(h=>{ const t=normN(h.t); return t!==n && (t.startsWith(n) || t.split(' ').some(w=>w.startsWith(n)) || (n.length>2 && t.includes(n))); })
      .sort((a,b)=>(normN(a.t).startsWith(n)?0:1)-(normN(b.t).startsWith(n)?0:1) || a.t.length-b.t.length).slice(0,6);
    if(!hits.length){ close(); return; }
    list.innerHTML=hits.map((h,i)=>`<button type="button" role="option" data-i="${i}">${esc(h.t)}<span class="k">${esc(h.kind)}</span></button>`).join('');
    list.hidden=false; q.setAttribute('aria-expanded','true'); on=-1;
    list.querySelectorAll('button').forEach(b=>b.onmousedown=e=>{ e.preventDefault(); pick(hits[+b.dataset.i]); });
  };
  q.addEventListener('input',()=>{ S.q=q.value; drawList(); show(); });
  q.addEventListener('keydown',e=>{
    if(list.hidden) return;
    const bs=[...list.querySelectorAll('button')];
    if(e.key==='ArrowDown'||e.key==='ArrowUp'){ e.preventDefault(); on=(on+(e.key==='ArrowDown'?1:-1)+bs.length)%bs.length; bs.forEach((b,i)=>b.classList.toggle('on',i===on)); }
    else if(e.key==='Enter' && on>=0){ e.preventDefault(); pick(hits[on]); }
    else if(e.key==='Tab' && hits[0]){ e.preventDefault(); pick(hits[on>=0?on:0]); }
    else if(e.key==='Escape') close();
  });
  q.addEventListener('blur',()=>setTimeout(close,120));
  view.querySelectorAll('[data-cat]').forEach(c=>c.onclick=()=>{S.cat=c.dataset.cat; viewVendors();});
  view.querySelectorAll('[data-reg]').forEach(c=>c.onclick=()=>{S.reg=c.dataset.reg; viewVendors();});
  drawList();
}

function exportR5(list){

  const file = { _exportFormatVersion:3, _tripVendors:vendors, days:[] };
  const json = JSON.stringify(file,null,2);
  const name = `Israel_suppliers_${new Date().toISOString().slice(0,10)}.json`;

    <div class="btn-row" style="margin-bottom:8px">${LIVE?'<button class="btn primary" id="dl">Download '+esc(name)+'</button>':''}<button class="btn soft" id="cp">Copy file contents</button></div>

  const dl=document.getElementById('dl'); if(dl) dl.onclick=()=>{ const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([json],{type:'application/json'})); a.download=name; document.body.appendChild(a); a.click(); a.remove(); };
  document.getElementById('cp').onclick=()=>{ const t=document.getElementById('expText'); navigator.clipboard.writeText(json).then(()=>toast('Copied')).catch(()=>{t.focus();t.select();toast('Selected. Copy it from here.');}); };
}

function intlDigits(ph){ let d=String(ph||'').replace(/[^\d+]/g,''); if(d.startsWith('+')) return d.slice(1); if(d.startsWith('00')) return d.slice(2); if(d.startsWith('0')) return '972'+d.slice(1); return d; }
// fields sometimes hold several numbers or emails ("02-123; fax 02-456"); use the first real one
function firstPhone(x){ const parts=String(x||'').split(/[;,/]|\bor\b/i).map(p=>p.trim()).filter(p=>p && !/fax/i.test(p));
  for(const p of parts){ const d=p.replace(/[^\d+*]/g,''); if(d.replace(/\D/g,'').length>=4) return d; } return ''; }
function firstEmail(x){ const m=String(x||'').match(/[^\s;,<>]+@[^\s;,<>]+\.[^\s;,<>]+/); return m?m[0]:''; }
function contactBar(v){
  const a=[]; const ph=firstPhone(v.phone), em=firstEmail(v.email);
  if(ph) a.push(`<a class="act" href="tel:${esc(ph)}">${ic.call}Call</a>`);
  const mobile=String(v.phone||'').split(/[;,/]/).map(firstPhone).find(p=>/^0?5\d{8}$/.test(p.replace(/^\+?972/,'0')))||'';
  const wa=firstPhone(v.whatsapp)||mobile;
  if(wa) a.push(`<a class="act" href="https://wa.me/${esc(intlDigits(wa))}" target="_blank" rel="noopener">${ic.wa}WhatsApp</a>`);
  if(em) a.push(`<a class="act" href="mailto:${esc(em)}">${ic.mail}Email</a>`);
  if(v.website) a.push(`<a class="act" href="${esc(/^https?:/.test(v.website)?v.website:'https://'+v.website)}" target="_blank" rel="noopener">${ic.web}Website</a>`);
  if(v.location||v.name) a.push(`<a class="act" href="https://waze.com/ul?q=${encodeURIComponent((v.name+' '+(v.location||'')).trim())}&navigate=yes" target="_blank" rel="noopener">${ic.nav}Waze</a>`);
  return a.length?`<div class="actions">${a.join('')}</div>`:'';
}

const Q_UNITS=['per room per night','per person','per person per night','per vehicle per day','per day','per hour','per group','flat','% of subtotal'];
const Q_KINDS=['Base','Supplement','Meal','Extra','Discount'];
const Q_STATUS=['Requested','Received','Booked','Expired','Declined'];
function nightsOf(q){ if(!q.date_from||!q.date_to) return 0; const n=Math.round((new Date(q.date_to)-new Date(q.date_from))/86400000); return n>0?n:0; }
function defTimes(unit,q){ const n=nightsOf(q); if(/per night/.test(unit)) return n||1; if(/per day/.test(unit)) return (n?n+1:1); return 1; }
function lineCalc(lines){
  const num=x=>parseFloat(x)||0; let sub=0; const rows=lines.map(l=>{ if(l.unit==='% of subtotal') return {l,amt:null}; let a=num(l.price)*num(l.qty||1)*num(l.times||1); if(l.kind==='Discount') a=-a; sub+=a; return {l,amt:a}; });
  let total=sub; rows.forEach(r=>{ if(r.amt===null){ let a=sub*num(r.l.price)/100; if(r.l.kind==='Discount') a=-a; r.amt=a; total+=a; } });
  return {rows,total};
}
function fmtMoney(cur,a){ const sign=CUR_SIGN[cur]||''; const neg=a<0; const v=Math.abs(Math.round(a*100)/100).toLocaleString('en-US',{maximumFractionDigits:2}); return (neg?'−':'')+sign+v; }
function fmtRange(q){
  const o={day:'numeric',month:'short'}; const y={year:'numeric'};
  if(!q.date_from) return 'Dates not set';
  const a=new Date(q.date_from), b=q.date_to?new Date(q.date_to):null;
  const s1=a.toLocaleDateString('en-GB',o), s2=b?b.toLocaleDateString('en-GB',o):'';
  const n=nightsOf(q);
  return `${s1}${b?'–'+s2:''} ${(b||a).toLocaleDateString('en-GB',y)}${n?` · ${n} night${n>1?'s':''}`:''}`;
}
function lineHow(l,cur){
  if(l.price==='') return 'Price to confirm';
  if(l.unit==='% of subtotal') return `${l.price}% of subtotal`;
  const parts=[fmtMoney(cur,parseFloat(l.price)||0)+' '+l.unit]; if(parseFloat(l.qty)!==1) parts.push('× '+l.qty); if(parseFloat(l.times)!==1) parts.push('× '+l.times+(/night/.test(l.unit)?' nights':/day/.test(l.unit)?' days':''));
  return parts.join(' ');
}

      <div class="f"><label for="q_vat">VAT</label><select id="q_vat">${opt(VAT,q.vat)}</select></div>
      <div class="f"><label for="q_rec">Received on</label><input id="q_rec" type="date" value="${esc(q.received_on)}"></div>
      <div class="f"><label for="q_valid">Valid until</label><input id="q_valid" type="date" value="${esc(q.valid_until)}"></div>
      <div class="f"><label for="q_status">Status</label><select id="q_status">${opt(Q_STATUS,q.status)}</select></div>
      <div class="f"><label for="q_ref">Supplier's reference</label><input id="q_ref" value="${esc(q.ref)}" placeholder="GRP-5521"></div>
      <div class="f wide"><label for="q_title">For which trip or client? (private)</label><input id="q_title" value="${esc(q.title)}" placeholder="Jacobs family, Oct 2026"></div>
    </div>
    <fieldset style="margin-top:16px"><div class="sec-head"><legend>Options</legend><button class="mini" id="addOpt" type="button">+ Add option</button></div>
      <div class="otabs" id="optTabs" role="tablist"></div><div id="optEd"></div></fieldset>
    <div class="grid">
      <div class="f wide"><label for="q_cond">Conditions</label><textarea id="q_cond" rows="3" placeholder="Deposit, cancellation, overtime, what's included…">${esc(q.conditions)}</textarea></div>
      <div class="f wide"><label for="q_note">Private note</label><textarea id="q_note" rows="2" placeholder="Only you${S.admin?'':' and Eretz Israel Tours'} can see this">${esc(q.private_note)}</textarea></div>
    </div>
    <label class="switch" for="q_shared" style="margin-top:12px"><input id="q_shared" type="checkbox" ${q.shared?'checked':''}><span><b>Share with colleagues</b><br><span class="hint">They see the dates, options, prices and conditions. Never the client, reference or private note.</span></span></label>
    <div id="qErr"></div></form>`;
  const w=sheet(q0?'Edit quote':'New quote', body, `<button class="btn soft" id="qc" type="button">Cancel</button><button class="btn primary" id="qs" type="button">Save quote</button>`);
  const g=id=>w.querySelector('#'+id);
  const syncDates=()=>{ q.date_from=g('q_from').value; q.date_to=g('q_to').value; };
  const drawTabs=()=>{ g('optTabs').innerHTML=q.options.map((o,i)=>`<button class="otab" type="button" data-i="${i}" aria-selected="${i===cur}">${esc(o.name||'Option '+(i+1))}<span class="ot">${esc(fmtMoney(g('q_cur').value,lineCalc(o.lines).total))}</span></button>`).join('');
    g('optTabs').querySelectorAll('.otab').forEach(t=>t.onclick=()=>{ readOpt(); cur=+t.dataset.i; drawTabs(); drawOpt(); }); };
  const readOpt=()=>{ const o=q.options[cur]; if(!o) return; const ed=g('optEd'); o.name=ed.querySelector('#o_name').value; o.note=ed.querySelector('#o_note').value;
    o.lines=[...ed.querySelectorAll('.lineed')].map(r=>({label:r.querySelector('[data-f=label]').value.trim(),kind:r.querySelector('[data-f=kind]').value,price:r.querySelector('[data-f=price]').value.replace(/[,₪$€\s]/g,''),unit:r.querySelector('[data-f=unit]').value,qty:r.querySelector('[data-f=qty]').value||'1',times:r.querySelector('[data-f=times]').value||'1',note:r.querySelector('[data-f=note]').value.trim()})); };
  const lineRow=(l)=>`<div class="lineed">
      <input class="lbl" data-f="label" value="${esc(l.label)}" placeholder="What (e.g. ${isH?'Deluxe sea view room':isT?'35-seat midibus with driver':'Entrance ticket'})">
      <div class="r"><select class="md" data-f="kind">${opt(Q_KINDS,l.kind)}</select><input class="sm" data-f="price" inputmode="decimal" value="${esc(l.price)}" placeholder="${l.unit==='% of subtotal'?'%':'price'}"><select class="md" data-f="unit">${opt(Q_UNITS,l.unit)}</select></div>
      <div class="r"><label class="hint" style="align-self:center">qty</label><input class="sm" data-f="qty" inputmode="decimal" value="${esc(l.qty)}"><label class="hint" style="align-self:center">×</label><input class="sm" data-f="times" inputmode="decimal" value="${esc(l.times)}" title="nights / days / times"><span class="lt"></span><button class="mini" type="button" data-rm>✕</button></div>
      <input data-f="note" value="${esc(l.note||'')}" placeholder="Note (optional)"></div>`;
  const recalc=()=>{ readOpt(); const o=q.options[cur]; const c=lineCalc(o.lines); g('optEd').querySelectorAll('.lineed').forEach((r,i)=>{ r.querySelector('.lt').textContent=fmtMoney(g('q_cur').value,c.rows[i].amt); }); g('optTotal').textContent=fmtMoney(g('q_cur').value,c.total); drawTabs(); };
  const drawOpt=()=>{ const o=q.options[cur]; const ed=g('optEd');
    ed.innerHTML=`<div class="grid"><div class="f"><label for="o_name">Option name</label><input id="o_name" value="${esc(o.name)}" placeholder="${isT?'35-seat midibus':'Sea view rooms'}"></div><div class="f"><label for="o_note">Option note</label><input id="o_note" value="${esc(o.note)}" placeholder="More luggage room"></div></div>
      <div class="presets">${presets.map((p,i)=>`<button class="mini" type="button" data-p="${i}">+ ${esc(p[0])}</button>`).join('')}<button class="mini" type="button" data-p="-1">+ Blank line</button></div>
      <div id="lines">${o.lines.map(lineRow).join('')}</div>
      <p style="display:flex;justify-content:space-between;font-weight:600;margin:6px 2px 0"><span>Option total</span><span class="mono" id="optTotal"></span></p>
      ${q.options.length>1?'<button class="mini" type="button" id="rmOpt" style="margin-top:8px">Remove this option</button>':''}`;
    const wire=()=>{ ed.querySelectorAll('.lineed').forEach(r=>{ r.querySelectorAll('input,select').forEach(i=>i.oninput=recalc);
        r.querySelector('[data-f=unit]').onchange=e=>{ syncDates(); r.querySelector('[data-f=times]').value=defTimes(e.target.value,q); recalc(); };
        r.querySelector('[data-rm]').onclick=()=>{ r.remove(); recalc(); }; }); };
    ed.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{ syncDates(); const p=presets[+b.dataset.p]||['','Base','per person']; const l={label:p[0],kind:p[1],price:'',unit:p[2],qty:p[2]==='per room per night'?(parseInt(g('q_units').value)||1):(p[2]==='per person'||p[2]==='per person per night'?(g('q_pax').value||1):1),times:defTimes(p[2],q),note:''};
      ed.querySelector('#lines').insertAdjacentHTML('beforeend',lineRow(l)); wire(); recalc(); const last=[...ed.querySelectorAll('.lineed')].pop(); (p[0]?last.querySelector('[data-f=price]'):last.querySelector('[data-f=label]')).focus(); });
    ed.querySelector('#o_name').oninput=()=>{ q.options[cur].name=ed.querySelector('#o_name').value; drawTabs(); };
    const rm=ed.querySelector('#rmOpt'); if(rm) rm.onclick=()=>{ if(rm.dataset.c!=='1'){ rm.dataset.c='1'; rm.textContent='Tap again to remove'; return; } q.options.splice(cur,1); cur=0; drawTabs(); drawOpt(); };
    wire(); recalc(); };
  g('addOpt').onclick=()=>{ readOpt(); const copy=q.options[cur]?JSON.parse(JSON.stringify(q.options[cur])):{lines:[]}; copy.name='Option '+String.fromCharCode(65+q.options.length); copy.note=''; q.options.push(copy); cur=q.options.length-1; drawTabs(); drawOpt(); toast('Copied the current option. Change what differs.'); };
  g('q_cur').onchange=recalc;
  drawTabs(); drawOpt();
  g('qc').onclick=()=>openDetail(v.id);
  g('qs').onclick=async()=>{ readOpt(); const err=g('qErr');
    const out={id:q0?q0.id:undefined,title:g('q_title').value.trim(),date_from:g('q_from').value,date_to:g('q_to').value,pax:g('q_pax').value.trim(),units:g('q_units').value.trim(),received_on:g('q_rec').value,valid_until:g('q_valid').value,ref:g('q_ref').value.trim(),status:g('q_status').value,currency:g('q_cur').value,vat:g('q_vat').value,conditions:g('q_cond').value.trim(),private_note:g('q_note').value.trim(),shared:g('q_shared').checked,
      options:q.options.map(o=>({name:o.name,note:o.note,lines:o.lines.filter(l=>l.label||l.price)}))};
    const bad=out.options.flatMap(o=>o.lines).find(l=>(l.price&&!/^\d+(\.\d+)?$/.test(l.price))||!/^\d+(\.\d+)?$/.test(l.qty)||!/^\d+(\.\d+)?$/.test(l.times));
    if(bad){ err.innerHTML=`<div class="msg err">Check the numbers on "${esc(bad.label||'a line')}": price (if known), qty and × must be numbers.</div>`; return; }
    if(out.date_from&&out.date_to&&out.date_to<out.date_from){ err.innerHTML='<div class="msg err">The end date is before the start date.</div>'; return; }
    const b=g('qs'); b.disabled=true; b.textContent='Saving…';
    try{ await DB.saveQuote(v.id,out); toast(q0?'Quote saved':'Quote added. You can attach the PDF or email now.'); openDetail(v.id); }
    catch(e){ b.disabled=false; b.textContent='Save quote'; err.innerHTML=`<div class="msg err">${esc(e.message)}</div>`; }
  };
}

const RES_LABEL={required:'Reservation officially required',recommended:'Reservation recommended',not_needed:'No reservation needed'};
function resSummary(reps){
  const real=reps.filter(r=>r.checked!=='unsure'); if(!real.length) return 'No one has reported yet.';
  const yes=real.filter(r=>r.checked==='yes').length, no=real.length-yes, last=real[0];
  return `Colleagues reported: ${yes} checked, ${no} not checked. Last: ${last.visit_date||fmtDate(last.created_at)}, ${esc(last.member_name||'a colleague')}: ${last.checked==='yes'?'they checked':'not checked'}.`;
}
function drawSiteBits(v,det){
  const pb=document.getElementById('parentBox');
  if(pb) pb.innerHTML = det.parent ? `<p style="margin:-4px 0 12px"><button class="parentlink" type="button" id="goParent">Part of ${esc(det.parent.name)} ›</button></p>` : '';
  const gp=document.getElementById('goParent'); if(gp) gp.onclick=()=>openDetail(det.parent.id);
  const rb=document.getElementById('resBox');
  if(rb){
    if(v.reservation){
      rb.innerHTML=`<div class="resbar"><b>📅 ${esc(RES_LABEL[v.reservation])}</b>
        ${v.reservation!=='not_needed'?`<span class="meta">${resSummary(det.res_reports||[])}</span>
        <div class="btn-row"><span class="meta" style="align-self:center">Your last visit:</span><button class="mini" type="button" data-res="yes">They checked</button><button class="mini" type="button" data-res="no">Not checked</button></div>`:''}
        ${v.npResLink?`<p class="meta" style="margin:8px 0 0"><a href="${esc(v.npResLink)}" target="_blank" rel="noopener">Book a visit</a></p>`:''}</div>`;
      rb.querySelectorAll('[data-res]').forEach(b=>b.onclick=async()=>{ try{ await DB.reportReservation(v.id,b.dataset.res,today()); toast('Thanks, noted'); drawExtras(v); }catch(e){ toast(e.message); } });
    } else rb.innerHTML='';
  }
  const sw=document.getElementById('sitesWrap'); if(!sw) return;
  const sites=det.sites||[];
  if(sites.length || (S.admin && v.category==='National Parks' && !v.parent_id)){
    sw.innerHTML=`<fieldset><div class="sec-head"><legend>Sites</legend>${S.admin?'<button class="mini" id="addSite" type="button">+ Add site</button>':''}</div>
      ${sites.length?`<div class="sitelist">${sites.map(x=>`<button type="button" data-site="${esc(x.id)}"><span>${esc(x.name)}${x.location?`<br><span class="hint">${esc(x.location)}</span>`:''}</span><span class="hint">${x.reservation==='required'?'📅 Reserve':''} ›</span></button>`).join('')}</div>`:'<p class="hint" style="margin:0 0 10px">No sites yet.</p>'}</fieldset>`;
    sw.querySelectorAll('[data-site]').forEach(b=>b.onclick=()=>openDetail(b.dataset.site));
    const as=sw.querySelector('#addSite'); if(as) as.onclick=()=>openForm(null,{category:v.category,parent_id:v.id,reservation:v.reservation,location:'',website:v.website});
  } else sw.innerHTML='';
  // site settings for admin
  const ss=document.getElementById('siteSettings');
  if(ss && S.admin){
    const parents=S.vendors.filter(x=>x.id!==v.id && !x.parent_id && (x.category===v.category||x.id===v.parent_id));
    ss.innerHTML=`<fieldset><legend>Site settings · only you</legend><div class="grid">
      <div class="f"><label for="ss_parent">Part of</label><select id="ss_parent"><option value="">Nothing (stand-alone)</option>${parents.map(x=>`<option value="${esc(x.id)}"${x.id===v.parent_id?' selected':''}>${esc(x.name)}</option>`).join('')}</select></div>
      <div class="f"><label for="ss_res">Reservation</label><select id="ss_res">${[['','Not set'],['required','Officially required'],['recommended','Recommended'],['not_needed','Not needed']].map(([k,t])=>`<option value="${k}"${k===(v.reservation||'')?' selected':''}>${t}</option>`).join('')}</select></div>
      </div><div class="btn-row" style="margin-top:8px"><button class="mini" id="ss_save" type="button">Save site settings</button></div></fieldset>`;
    ss.querySelector('#ss_save').onclick=async()=>{ try{ await DB.setSite(v.id, ss.querySelector('#ss_parent').value, ss.querySelector('#ss_res').value); toast('Saved'); openDetail(v.id); }catch(e){ toast(e.message); } };
  }
  // one-time pop-up
  if(v.reservation==='required' && !det.res_answered){
    let skip=false; try{ skip=localStorage.getItem('eitv_res_'+v.id)==='later'; }catch(e){}
    if(!skip) setTimeout(()=>resPopup(v),350);
  }
}
function resPopup(v){
  if(document.getElementById('resModal')) return;
  const m=document.createElement('div'); m.className='modal'; m.id='resModal';
  m.innerHTML=`<div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="rmT"><h3 id="rmT">📅 Reservation needed?</h3>
    <p>${esc(v.name)} officially requires booking a visit in advance. Last time you went, did they actually check your reservation?</p>
    <button class="btn primary" data-a="yes" type="button">Yes, they checked</button>
    <button class="btn soft" data-a="no" type="button">No, we walked in</button>
    <button class="btn soft" data-a="later" type="button">I haven't been there yet</button></div>`;
  document.body.appendChild(m);
  m.querySelectorAll('[data-a]').forEach(b=>b.onclick=async()=>{ const a=b.dataset.a; m.remove();
    if(a==='later'){ try{ localStorage.setItem('eitv_res_'+v.id,'later'); }catch(e){} toast('OK. Book ahead to be safe.'); return; }
    try{ await DB.reportReservation(v.id,a,''); toast('Thanks, that helps everyone'); drawExtras(v); }catch(e){ toast(e.message); } });
}

function openReasonSheet(title, prompt, onSend){
  const w=sheet(title, `<div class="f wide"><label for="rsn">${esc(prompt)}</label><textarea id="rsn" rows="3" placeholder="e.g. new price list from the supplier, see the receipt I attached"></textarea></div><div id="rsnErr"></div>`,
    `<button class="btn soft" id="rc" type="button">Cancel</button><button class="btn primary" id="rs" type="button">Send for approval</button>`);
  w.querySelector('#rc').onclick=closeSheet;
  w.querySelector('#rs').onclick=async()=>{ const r=w.querySelector('#rsn').value.trim(); if(r.length<3){ w.querySelector('#rsnErr').innerHTML='<div class="msg err">Add a short reason.</div>'; return; }
    try{ await onSend(r); }catch(e){ w.querySelector('#rsnErr').innerHTML=`<div class="msg err">${esc(e.message)}</div>`; } };
}

    </div><p class="hint">Please don't post personal member codes or card details. Describe the benefit instead.</p><div id="dlErr"></div></form>`;
  const w=sheet('Share a deal', body, `<button class="btn soft" id="dc" type="button">Cancel</button><button class="btn primary" id="ds" type="button">Share</button>`);
  w.querySelector('#dc').onclick=()=>openDetail(v.id);
  w.querySelector('#ds').onclick=async()=>{ const g=id=>w.querySelector('#'+id).value.trim();
    if(!g('dl_title')){ w.querySelector('#dlErr').innerHTML='<div class="msg err">Describe the deal in a few words.</div>'; return; }
    try{ await DB.addDeal(v.id,{kind:g('dl_kind'),provider:g('dl_prov'),title:g('dl_title'),details:g('dl_det'),code:g('dl_code'),valid_to:g('dl_to'),link:g('dl_link')}); toast('Deal shared'); openDetail(v.id); }
    catch(e){ w.querySelector('#dlErr').innerHTML=`<div class="msg err">${esc(e.message)}</div>`; } };
}

const KINDS=['Photo','Receipt','Price list','Contract','Quote','Other'];
async function shrink(file){
  // Phone photos are large; resize to max 2000px JPEG. Keep PDFs and anything the browser can't decode as-is.
  if(!/^image\/(jpeg|png|webp)$/.test(file.type) || file.size < 1500000) return file;
  try{
    const bmp = await createImageBitmap(file); const k = Math.min(1, 2000/Math.max(bmp.width,bmp.height));
    const c=document.createElement('canvas'); c.width=Math.round(bmp.width*k); c.height=Math.round(bmp.height*k);
    c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);
    const blob = await new Promise(r=>c.toBlob(r,'image/jpeg',0.85));
    return blob && blob.size < file.size ? new File([blob], file.name.replace(/\.\w+$/,'')+'.jpg', {type:'image/jpeg'}) : file;
  }catch(e){ return file; }
}
async function drawFiles(v, qid, boxId, canAdd){
  const sid=boxId||'filesBox'; const box=document.getElementById(sid); if(!box) return; if(canAdd===undefined) canAdd=true;
  const redraw=()=>drawFiles(v, qid, boxId, canAdd);
  let files=[]; try{ files=await DB.listFiles(v.id, qid); }catch(e){ box.innerHTML=`<div class="msg err">Couldn't load files: ${esc(e.message)}</div>`; return; }
  const me=(S.user.email||'').toLowerCase();
  box.innerHTML = (files.length?`<div class="files" style="margin-top:8px">${files.map((f,i)=>{
      const img=/^image\//.test(f.mime_type) && !/hei[cf]/.test(f.mime_type);
      const inner = img && f.url ? `<img src="${esc(f.url)}" alt="${esc(f.file_name)}" loading="lazy">` : `<span class="doc">${/pdf/.test(f.mime_type)?'PDF':'FILE'}</span>`;
      const canRm = S.admin || f.uploaded_by===me;
      return `<div class="file"><a class="thumb" href="${esc(f.url||'#')}" target="_blank" rel="noopener">${inner}</a>
        <span class="fkind">${esc(f.kind)}</span><span class="fname" title="${esc(f.file_name)}">${esc(f.file_name)}</span>
        ${canRm?`<button class="rm" data-i="${i}" type="button">Remove</button>`:''}</div>`; }).join('')}</div>`
    : `<p class="hint" style="margin:8px 0 10px">${qid?'No attachments yet. Add the quote email screenshot or PDF.':'No files yet. Add a photo of the place, a receipt, a price list or a contract.'}</p>`)
  + (canAdd?`<div class="upl"><select id="${sid}_kind" aria-label="What is it?">${KINDS.map(k=>`<option${qid&&k==='Quote'?' selected':''}>${k}</option>`).join('')}</select>
      <label class="btn accent" for="${sid}_file" style="display:inline-block">Add photo or file</label>
      <input id="${sid}_file" type="file" accept="image/*,application/pdf" multiple hidden>
      <span class="hint" id="${sid}_msg">Photos and PDFs, up to 10 MB each.</span></div>`:'');
  box.querySelectorAll('.rm').forEach(b=>b.onclick=async()=>{ if(b.dataset.c!=='1'){ b.dataset.c='1'; b.textContent='Tap again'; return; }
    try{ await DB.removeFile(files[+b.dataset.i]); toast('File removed'); redraw(); }catch(e){ toast(e.message); } });
  const input=box.querySelector('#'+sid+'_file'), msg=box.querySelector('#'+sid+'_msg'); if(!input) return;
  input.onchange=async()=>{
    const picked=[...input.files]; if(!picked.length) return; const kind=box.querySelector('#'+sid+'_kind').value; let ok=0;
    for(const [n,f0] of picked.entries()){
      msg.textContent=`Uploading ${n+1} of ${picked.length}…`;
      if(!/^image\/|^application\/pdf$/.test(f0.type) && !/\.(pdf|heic|heif)$/i.test(f0.name)){ toast(`${f0.name}: only photos and PDFs`); continue; }
      const f=await shrink(f0);
      if(f.size>10485760){ toast(`${f0.name} is over 10 MB`); continue; }
      try{ await DB.upload(v.id,f,kind,qid); ok++; }catch(e){ toast(`${f0.name}: ${e.message}`); }
    }
    if(ok) toast(ok===1?'File added':`${ok} files added`);
    redraw();
  };
}

function openForm(v, preset){
  const x = Object.assign(blank(), {active:'Active',priceBasis:'Per person',currency:'ILS',category:''}, v||preset||{});
  const guarded = !!v && !S.admin; const lk=k=>guarded && LOCKED.includes(k) ? ' <span class="lock">🔒</span>' : '';
  const inp=(k,label,type='text',ph='',wide=false,req=false)=>`<div class="f${wide?' wide':''}"><label for="f_${k}">${label}${req?' <em>*</em>':''}${lk(k)}</label><input id="f_${k}" name="${k}" type="${type}" value="${esc(x[k])}" placeholder="${esc(ph)}"${type==='number'?' inputmode="decimal" min="0" step="any"':''}${type==='tel'?' inputmode="tel"':''}></div>`;
  const sel=(k,label,opts,wide=false,req=false)=>`<div class="f${wide?' wide':''}"><label for="f_${k}">${label}${req?' <em>*</em>':''}${lk(k)}</label><select id="f_${k}" name="${k}">${opts.map(o=>{const [val,t]=Array.isArray(o)?o:[o,o];return `<option value="${esc(val)}"${String(x[k])===val?' selected':''}>${esc(t)}</option>`}).join('')}</select></div>`;
  const area=(k,label,ph)=>`<div class="f wide"><label for="f_${k}">${label}</label><textarea id="f_${k}" name="${k}" rows="2" placeholder="${esc(ph)}">${esc(x[k])}</textarea></div>`;
  const stars=(k,label)=>`<div class="f"><label>${label}</label><div class="stars" data-k="${k}">${[1,2,3,4,5].map(n=>`<button type="button" data-n="${n}" aria-pressed="${x[k]===String(n)}" aria-label="${label} ${n}">${n}</button>`).join('')}</div><input type="hidden" id="f_${k}" name="${k}" value="${esc(x[k])}"></div>`;
  const body=`<form id="vf" novalidate>
    ${guarded?'<div class="lockbar">🔒 Name, contact details, the main price and cancellation terms are checked by Eretz Israel Tours. Change them here and say why, and the change shows once approved. Everything else saves straight away.</div>':''}
    <fieldset><legend>Supplier</legend><div class="grid">
      ${inp('name','Vendor or company name','text','Golan Jeeps Ltd.',true,true)}
      <div id="dupBox" class="f wide" hidden></div>
      ${sel('category','Category',[['','Choose…'],...CATEGORIES],false,true)}
      <div class="f wide"><label for="f_tags">Type (separate with commas)</label><input id="f_tags" value="${esc(x.tags)}" placeholder="Jeep, ATV / RZR"><div class="presets" id="tagSug" style="margin:6px 0 0"></div></div>
      ${sel('active','Status',['Active','Inactive'])}
      <div class="f wide" id="npWrap" ${x.category==='National Parks'?'':'hidden'}><label for="f_npResLink">National park booking link</label><input id="f_npResLink" name="npResLink" type="url" value="${esc(x.npResLink)}" placeholder="https://booking.parks.org.il/…"></div>
    </div></fieldset>
    <fieldset><legend>Contact</legend><div class="grid">
      ${inp('contactPerson','Contact person','text','Moshe Cohen')}${inp('phone','Phone','tel','+972 52 000 0000')}${inp('whatsapp','WhatsApp','tel','+972 52 000 0000')}
      ${inp('email','Email','email')}${inp('website','Website','text','example.co.il')}
      <div class="f"><label for="f_regionSel">Region</label><select id="f_regionSel"><option value="">Choose…</option>${REGIONS.map(r=>`<option${x.region===r?' selected':''}>${esc(r)}</option>`).join('')}<option value="__other"${x.region&&!REGIONS.includes(x.region)?' selected':''}>Other…</option></select>
        <input id="f_regionOther" placeholder="Type the region" value="${esc(x.region&&!REGIONS.includes(x.region)?x.region:'')}" ${x.region&&!REGIONS.includes(x.region)?'':'hidden'} style="margin-top:6px"><input type="hidden" id="f_region" value="${esc(x.region)}"></div>
      ${inp('location','Town or address','text','Kfar Adumim junction')}
      ${inp('languages','Languages','text','English, Hebrew')}${inp('kosher','Kosher status','text','Mehadrin / Rabbanut / N/A')}${inp('maxCap','Max capacity (people)','number')}
    </div></fieldset>
    <fieldset><legend>Pricing</legend><div class="grid">
      ${inp('agentPrice','Agent price (ours)','number','0')}${sel('agentPriceVatTreatment','Agent price VAT',VAT)}
      ${inp('listedPrice','Listed price (public)','number','0')}${sel('listedPriceVatTreatment','Listed price VAT',VAT)}
      ${sel('currency','Currency',['ILS','USD','EUR'])}${sel('priceBasis','Price basis',BASIS)}
      ${inp('maxPax','Max people for this price','number','15')}${inp('payTerms','Payment terms','text','50% deposit, balance on arrival',true)}
    </div><p class="hint" style="margin:8px 0 0">Leave VAT as Unknown if you're not sure.</p></fieldset>
    <fieldset><legend>Cancellation</legend><div class="grid">
      ${inp('cancelPolicy','Policy as written','text','Free cancellation until 48h before',true)}
      ${inp('cancelNoticeAmount','Notice','number','7')}${sel('cancelNoticeUnit','Unit',[['','—'],'Hours','Days'])}${sel('cancelDayType','Counted in',[['','Not specified'],'Calendar days','Business days'])}
      ${inp('cancelPenalty','Penalty','text','50% fee inside notice period')}${inp('cancelPolicyVerifiedDate','Policy checked on','date')}
    </div></fieldset>
    <fieldset><legend>Your experience</legend><div class="grid">
      ${stars('rateReliability','Reliability')}${stars('rateService','Service')}${stars('rateValue','Value')}
      ${area('strengths','Strengths','Very punctual, great English…')}${area('weaknesses','Weaknesses','Sometimes overbooks…')}${area('notes','Notes','Ask for a group discount above 10 people…')}
    </div></fieldset>
    ${guarded?`<fieldset id="reasonWrap"><legend>Why the change?</legend><div class="f wide"><label for="f_reason">Needed only if you changed a 🔒 field</label><textarea id="f_reason" rows="2" placeholder="New price list from the supplier, see the receipt I attached"></textarea></div></fieldset>`:''}
    <div id="formErr"></div>
  </form>`;
  const foot=`<button class="btn soft" id="cancel" type="button">Cancel</button><button class="btn primary" id="saveBtn" type="button">${v?'Save changes':'Add supplier'}</button>`;
  const w=sheet(v?(guarded?'Edit or suggest a change':'Edit supplier'):'New supplier', body, foot);
  const f=w.querySelector('#vf');
  w.querySelector('#cancel').onclick=closeSheet;
  const tagsIn=f.querySelector('#f_tags'), tagSug=f.querySelector('#tagSug');
  const drawTagSug=()=>{ const have=tagsIn.value.split(',').map(t=>t.trim().toLowerCase()).filter(Boolean); const opts=(TAG_SUGGEST[f.querySelector('#f_category').value]||[]).filter(t=>!have.includes(t.toLowerCase()));
    tagSug.innerHTML=opts.map(t=>`<button class="mini" type="button" data-t="${esc(t)}">+ ${esc(t)}</button>`).join('');
    tagSug.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{ const cur=tagsIn.value.split(',').map(t=>t.trim()).filter(Boolean); cur.push(b.dataset.t); tagsIn.value=cur.join(', '); drawTagSug(); }); };
  tagsIn.addEventListener('input',drawTagSug); drawTagSug();
  const rSel=f.querySelector('#f_regionSel'), rOther=f.querySelector('#f_regionOther'), rHid=f.querySelector('#f_region');
  const syncReg=()=>{ rOther.hidden = rSel.value!=='__other'; rHid.value = rSel.value==='__other' ? rOther.value.trim() : rSel.value; };
  rSel.addEventListener('change',()=>{ syncReg(); if(!rOther.hidden) rOther.focus(); }); rOther.addEventListener('input',syncReg);
  f.querySelector('#f_category').addEventListener('change',e=>{ f.querySelector('#npWrap').hidden = e.target.value!=='National Parks'; drawTagSug(); });
  f.querySelectorAll('.stars').forEach(g=>g.addEventListener('click',e=>{ const b=e.target.closest('button'); if(!b) return; const hid=f.querySelector('#f_'+g.dataset.k);
    const val = hid.value===b.dataset.n?'':b.dataset.n; hid.value=val; g.querySelectorAll('button').forEach(o=>o.setAttribute('aria-pressed', o.dataset.n===val)); }));
  const dupCheck=()=>{ const n=normN(f.querySelector('#f_name').value); const box=f.querySelector('#dupBox');
    const hit = n && S.vendors.find(o=>o.id!==(v&&v.id) && normN(o.name)===n);
    box.hidden=!hit; box.innerHTML = hit?`<div class="dup"><b>${esc(hit.name)}</b> is already on the list (${esc(hit.category)}). <button type="button" class="btn soft" style="padding:4px 10px;margin-left:4px" id="goDup">Open it</button></div>`:'';
    const g=box.querySelector('#goDup'); if(g) g.onclick=()=>openDetail(hit.id); return hit; };
  f.querySelector('#f_name').addEventListener('input',dupCheck); dupCheck();
  w.querySelector('#saveBtn').onclick=async()=>{
    syncReg(); const data = v?{id:v.id}:{}; R5_FIELDS.concat(EXTRA_FIELDS).forEach(k=>{ const el=f.querySelector('#f_'+k); data[k]= el?el.value:(x[k]||''); });
    if(data.category!=='National Parks') data.npResLink = x.npResLink||data.npResLink||'';
    const err=f.querySelector('#formErr');
    const probs=[]; if(!data.name.trim()) probs.push('Add the supplier name.'); if(!data.category) probs.push('Choose a category.');
    if(!v && dupCheck()) probs.push('This supplier is already on the list. Open it and edit it instead.');
    let reason=''; if(guarded){ const changed=LOCKED.filter(k=>String(data[k]||'').trim()!==String(v[k]||'').trim()); reason=f.querySelector('#f_reason').value.trim();
      if(changed.length && reason.length<3) probs.push('You changed '+changed.map(k=>FIELD_LABEL[k]||k).join(', ')+'. Say briefly why, at the bottom.'); }
    if(probs.length){ err.innerHTML=`<div class="msg err">${probs.join(' ')}</div>`; err.scrollIntoView({block:'center'}); return; }
    const btn=w.querySelector('#saveBtn'); btn.disabled=true; btn.textContent='Saving…';
    try{ const saved=await DB.save(data, reason); if(!v && preset && preset.parent_id && S.admin){ try{ await DB.setSite(saved.id, preset.parent_id, preset.reservation||''); }catch(e){} } closeSheet(); S.tab='vendors'; render();
      if(!v){ openDetail(saved.id); toast(S.admin?'Supplier added. You can add prices, deals and photos now.':'Added. It will be reviewed. You can add prices and photos now.'); }
      else { openDetail(saved.id); toast(saved._request?'Saved. Your 🔒 changes were sent for approval.':'Saved'); } }
    catch(e){ btn.disabled=false; btn.textContent=v?'Save changes':'Add supplier'; err.innerHTML=`<div class="msg err">Couldn't save: ${esc(e.message)}</div>`; }
  };
}
