<style>
/* Layout: one-column field app — sticky header, tab bar at the bottom, sheets slide up for forms. */
:root{
  --ink:#16261e; --ink-2:#4a5a50; --ink-3:#7c8a80;
  --ground:#f3f5f1; --card:#ffffff; --line:#dde3db; --wash:#e8ede5;
  --olive:#1f3a2e; --olive-2:#2c5140; --ochre:#b8742a; --ochre-wash:#f6ead9;
  --ok:#2f7a4a; --ok-wash:#e3f1e7; --warn:#a66a12; --warn-wash:#fbefd9; --bad:#a63b2e; --bad-wash:#f8e3df;
  --on-olive:#f3f5f1; --tab-on:#2c5140; --mark:#1f3a2e;
  --f-display:"Secular One","Rubik",system-ui,sans-serif;
  --f-body:"Rubik",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --ink:#e6ebe4; --ink-2:#b0bcb2; --ink-3:#86938a;
  --ground:#121a15; --card:#1a241e; --line:#2c3a31; --wash:#223029;
  --olive:#2c5140; --olive-2:#3b6a54; --ochre:#e0a15a; --ochre-wash:#3a2c1a;
  --ok:#6cc58c; --ok-wash:#1d3325; --warn:#e7b35d; --warn-wash:#3a2e17; --bad:#ef8a7b; --bad-wash:#3b211d;
  --on-olive:#f3f5f1; --tab-on:#e0a15a; --mark:#e6ebe4; color-scheme:dark}}
:root[data-theme="dark"]{
  --ink:#e6ebe4; --ink-2:#b0bcb2; --ink-3:#86938a;
  --ground:#121a15; --card:#1a241e; --line:#2c3a31; --wash:#223029;
  --olive:#2c5140; --olive-2:#3b6a54; --ochre:#e0a15a; --ochre-wash:#3a2c1a;
  --ok:#6cc58c; --ok-wash:#1d3325; --warn:#e7b35d; --warn-wash:#3a2e17; --bad:#ef8a7b; --bad-wash:#3b211d;
  --on-olive:#f3f5f1; --tab-on:#e0a15a; --mark:#e6ebe4; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--ground);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--ochre);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--olive);color:var(--on-olive);padding:12px 16px}
.top-row{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:12px}
.brand{font-family:var(--f-display);font-size:21px;letter-spacing:.2px;line-height:1}
.brand small{display:block;font-family:var(--f-body);font-size:11px;letter-spacing:1.2px;text-transform:uppercase;opacity:.7;margin-top:4px}
.who{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:13px;opacity:.9;min-width:0}
.who span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:40vw}
.ghost-btn{background:transparent;border:1px solid rgba(243,245,241,.35);color:var(--on-olive);border-radius:999px;padding:5px 12px;font-size:13px}
.demo-bar{background:var(--ochre-wash);color:var(--ink);font-size:13px;padding:8px 16px;text-align:center;border-bottom:1px solid var(--line)}

main{max-width:760px;margin:0 auto;padding:16px 16px 110px}
.search{display:flex;gap:8px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:0 12px}
.search input{flex:1;min-width:0;border:0;background:transparent;padding:12px 0;outline:none;font-size:16px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:12px 0 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-size:13px;color:var(--ink-2)}
.chip[aria-pressed="true"]{background:var(--olive);border-color:var(--olive);color:var(--on-olive)}
.count{font-size:12px;letter-spacing:1px;text-transform:uppercase;color:var(--ink-3);margin:14px 2px 8px}

.list{display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.row{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:14px 16px;border:0;border-bottom:1px solid var(--line);background:transparent;text-align:left;width:100%}
.row:last-child{border-bottom:0}
.row:hover{background:var(--wash)}
.row-name{font-weight:600;font-size:16px;min-width:0;overflow-wrap:anywhere}
.row-meta{grid-column:1;font-size:13px;color:var(--ink-2);display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center}
.row-price{grid-column:2;grid-row:1 / span 2;text-align:right;align-self:center}
.row-price b{display:block;font-family:var(--f-mono);font-weight:500;font-size:15px}
.row-price span{font-size:12px;color:var(--ink-3)}
.cat{font-size:11px;letter-spacing:.8px;text-transform:uppercase;color:var(--ochre);font-weight:600}
.pill{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.4px;border-radius:999px;padding:2px 8px}
.pill.approved{background:var(--ok-wash);color:var(--ok)}
.pill.pending{background:var(--warn-wash);color:var(--warn)}
.pill.rejected{background:var(--bad-wash);color:var(--bad)}
.pill.inactive{background:var(--wash);color:var(--ink-3)}
.empty{padding:36px 20px;text-align:center;color:var(--ink-2)}
.empty h3{font-family:var(--f-display);font-weight:400;font-size:20px;margin:0 0 6px;color:var(--ink)}

.fab{position:fixed;right:16px;bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:6;background:var(--ochre);color:#1b1206;border:0;border-radius:999px;padding:14px 20px;font-weight:600;box-shadow:0 6px 18px rgba(0,0,0,.18)}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--card);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;gap:4px}
.tab{flex:1;max-width:180px;border:0;background:transparent;padding:8px 4px;border-radius:8px;font-size:13px;color:var(--ink-3);display:flex;flex-direction:column;align-items:center;gap:3px;position:relative}
.tab svg{width:22px;height:22px}
.tab[aria-current="page"]{color:var(--tab-on);font-weight:600}
.badge{position:absolute;top:2px;left:calc(50% + 6px);background:var(--ochre);color:#1b1206;font-size:10px;font-weight:700;border-radius:999px;padding:1px 6px}

/* buttons */
.btn{border:0;border-radius:8px;padding:11px 16px;font-weight:600;font-size:15px}
.btn.primary{background:var(--olive);color:var(--on-olive)}
.btn.accent{background:var(--ochre);color:#1b1206}
.btn.soft{background:var(--wash);color:var(--ink)}
.btn.danger{background:var(--bad-wash);color:var(--bad)}
.btn:disabled{opacity:.5;cursor:default}
.btn-row{display:flex;gap:8px;flex-wrap:wrap}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(10,18,14,.45);z-index:20}
.sheet{position:fixed;left:0;right:0;bottom:0;top:calc(24px + env(safe-area-inset-top,0px));z-index:21;background:var(--ground);border-radius:16px 16px 0 0;display:flex;flex-direction:column;max-width:760px;margin:0 auto;box-shadow:0 -8px 30px rgba(0,0,0,.2)}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .22s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}}
.sheet-head{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.sheet-head h2{font-family:var(--f-display);font-weight:400;font-size:20px;margin:0;flex:1;min-width:0;overflow-wrap:anywhere}
.x{border:0;background:var(--wash);border-radius:999px;width:34px;height:34px;font-size:18px;line-height:1}
.sheet-body{flex:1;overflow-y:auto;padding:16px 16px 24px}
.sheet-foot{padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--card);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}

fieldset{border:0;margin:0 0 18px;padding:0}
legend{font-size:11px;letter-spacing:1.2px;text-transform:uppercase;color:var(--ink-3);font-weight:600;margin-bottom:8px;padding:0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.f.wide{grid-column:1 / -1}
.f label{font-size:13px;color:var(--ink-2)}
.f label em{color:var(--bad);font-style:normal}
.f input,.f select,.f textarea{width:100%;border:1px solid var(--line);background:var(--card);border-radius:8px;padding:10px 11px;font-size:16px}
.f textarea{resize:vertical;min-height:64px}
.hint{font-size:12px;color:var(--ink-3)}
.dup{background:var(--warn-wash);color:var(--warn);border-radius:8px;padding:10px 12px;font-size:13px;margin-top:8px}
.stars{display:flex;gap:4px}
.stars button{border:1px solid var(--line);background:var(--card);border-radius:8px;width:38px;height:38px;font-family:var(--f-mono)}
.stars button[aria-pressed="true"]{background:var(--ochre);border-color:var(--ochre);color:#1b1206;font-weight:600}

/* detail */
.dl{display:grid;grid-template-columns:minmax(110px,38%) 1fr;gap:8px 14px;margin:0 0 18px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.dl dt{font-size:13px;color:var(--ink-3)}
.dl dd{margin:0;min-width:0;overflow-wrap:anywhere}
.stamp{font-size:12px;color:var(--ink-3);margin-top:-6px}
.idtag{font-family:var(--f-mono);font-size:12px;color:var(--ink-3)}

/* panels */
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px}
.panel h3{font-family:var(--f-display);font-weight:400;font-size:19px;margin:0 0 4px}
.panel p{margin:0 0 12px;color:var(--ink-2);font-size:14px}
.rev{display:flex;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.rev:first-of-type{border-top:0}
.rev .who2{flex:1;min-width:180px}
.rev .who2 b{display:block}
.rev .who2 span{font-size:13px;color:var(--ink-2)}
.person{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.person span{flex:1;min-width:0;overflow-wrap:anywhere}
.addrow{display:flex;gap:8px;flex-wrap:wrap}
.addrow input{flex:1;min-width:180px;border:1px solid var(--line);background:var(--ground);border-radius:8px;padding:10px 11px;font-size:16px}
textarea.out{width:100%;min-height:160px;font-family:var(--f-mono);font-size:12px;border:1px solid var(--line);border-radius:8px;background:var(--ground);padding:10px}

/* sign in */
.gate{min-height:100%;display:flex;align-items:center;justify-content:center;padding:32px 16px}
.gate-card{width:100%;max-width:400px}
.gate .mark{font-family:var(--f-display);font-size:34px;color:var(--mark);line-height:1.05;margin:0 0 6px}
.gate p{color:var(--ink-2);margin:0 0 22px}
.gate .f{margin-bottom:12px}
.gate .btn{width:100%}
.msg{margin-top:14px;font-size:14px;border-radius:8px;padding:10px 12px}
.msg.ok{background:var(--ok-wash);color:var(--ok)}
.msg.err{background:var(--bad-wash);color:var(--bad)}
.files{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px;margin-bottom:12px}
.file{position:relative;display:flex;flex-direction:column;gap:4px;min-width:0}
.file a.thumb{display:flex;align-items:center;justify-content:center;aspect-ratio:1;max-width:100%;border:1px solid var(--line);border-radius:8px;background:var(--wash);overflow:hidden;text-decoration:none;color:var(--ink-2)}
.file a.thumb img{width:100%;height:100%;object-fit:cover}
.file .doc{font-family:var(--f-mono);font-size:13px;font-weight:500;color:var(--bad)}
.file .fname{font-size:12px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.file .fkind{font-size:10px;letter-spacing:.8px;text-transform:uppercase;color:var(--ochre);font-weight:600}
.file .rm{position:absolute;top:4px;right:4px;border:0;border-radius:999px;background:var(--card);color:var(--bad);font-size:12px;padding:3px 8px;box-shadow:0 1px 4px rgba(0,0,0,.15)}
.upl{display:flex;gap:8px;flex-wrap:wrap;align-items:center;background:var(--card);border:1px dashed var(--line);border-radius:var(--r);padding:12px}
.upl select{border:1px solid var(--line);background:var(--ground);border-radius:8px;padding:9px 10px;font-size:15px}
.upl .hint{flex-basis:100%}
.clip{font-size:12px;color:var(--ink-3)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(140px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--ground);padding:10px 16px;border-radius:999px;font-size:14px;z-index:40;max-width:calc(100% - 32px)}
</style>

<div id="app"></div>
<div id="toast" class="toast" hidden></div>

const blank = () => Object.fromEntries(R5_FIELDS.map(k=>[k,'']));

    v({id:'vendor_7tt2w4n',name:'Ein Gedi Nature Reserve',category:'National Park',location:'Dead Sea',npResLink:'https://www.parks.org.il',listedPrice:'33',listedPriceVatTreatment:'including_vat',agentPrice:'29',agentPriceVatTreatment:'including_vat',priceBasis:'Per person',review_status:'pending',created_by:'yossi.guide@gmail.com',updated_by:'yossi.guide@gmail.com',updated_at:d(1)}),

  ];

// ---------- state ----------
const S = { files:{}, token:null, members:[], user:null, admin:false, contributor:false, vendors:[], team:[], tab:'vendors', q:'', cat:'All', busy:false };
let sb = null;

function toast(t){ const el=document.getElementById('toast'); el.textContent=t; el.hidden=false; clearTimeout(toast._t); toast._t=setTimeout(()=>el.hidden=true,2600); }

// ---------- data layer ----------
// Everyone signs in with a personal link (?k=…). The key is kept on the device; the server only stores its hash.
function readToken(){
  let t=null; try{ const u=new URL(location.href); t=u.searchParams.get('k'); if(t){ localStorage.setItem(TOKEN_KEY,t); u.searchParams.delete('k'); history.replaceState(null,'',u.pathname+u.search+u.hash); } }catch(e){}
  if(!t){ try{ t=localStorage.getItem(TOKEN_KEY); }catch(e){} }
  return t;
}
function forgetToken(){ try{ localStorage.removeItem(TOKEN_KEY); }catch(e){} S.token=null; S.me=null; }
const personalLink = t => APP_URL + '?k=' + t;
async function rpc(fn, args){
  const { data, error } = await sb.rpc(fn, Object.assign({p_token:S.token}, args||{}));
  if(error) throw new Error(error.message);
  return data;
}
async function filesApi(action, body){
  const { data, error } = await sb.functions.invoke('files', { body:Object.assign({token:S.token, action}, body) });
  if(error){ let m=error.message; try{ const j=await error.context.json(); m=j.error||m; }catch(e){} throw new Error(m); }
  return data;
}
const DB = {
  async init(){
    if(!LIVE){ S.user={email:OWNER}; S.me={name:'Daniel',email:OWNER,status:'approved',is_admin:true}; S.admin=true; S.contributor=true; S.vendors=sample();

      S.members=[{id:'m1',name:'Daniel',email:OWNER,status:'approved',is_admin:true,created_at:d(30),last_seen_at:d(0)},
        {id:'m2',name:'Yossi Ben-David',email:'yossi.guide@gmail.com',phone:'+972 52 111 2233',note:'Licensed guide, North',status:'pending',is_admin:false,created_at:d(0)},

    sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {auth:{persistSession:false,autoRefreshToken:false}});
    S.token = readToken();
    if(S.token) await DB.loadMe();
  },
  async loadMe(){
    const { data, error } = await sb.rpc('whoami',{p_token:S.token});
    if(error) throw new Error(error.message);
    S.me = data; S.user = data?{email:data.email}:null;

  async loadVendors(){ if(!LIVE) return; try{ S.vendors = await rpc('vendors_list'); }catch(e){ toast('Could not load vendors: '+e.message); } },
  async loadTeam(){ if(!LIVE) return; S.members = await rpc('members_list'); },
  async save(v){
    const payload = {}; R5_FIELDS.forEach(k=>payload[k]=String(v[k]==null?'':v[k]).trim());
    if(!LIVE){
      const now=new Date().toISOString();
      if(v.id){ const i=S.vendors.findIndex(x=>x.id===v.id); S.vendors[i]=Object.assign(S.vendors[i],payload,{updated_at:now,updated_by:S.user.email}); return S.vendors[i]; }
      const row=Object.assign({id:newId(),review_status:'approved',created_by:S.user.email,updated_by:S.user.email,created_at:now,updated_at:now,_files:0},payload); S.vendors.push(row); return row;
    }
    const data = await rpc('vendor_save',{p_data:Object.assign(v.id?{id:v.id}:{},payload)});
    const i=S.vendors.findIndex(x=>x.id===data.id); if(i>=0) S.vendors[i]=data; else S.vendors.push(data);
    return data;
  },
  async setStatus(id, status){
    if(!LIVE){ S.vendors.find(x=>x.id===id).review_status=status; return; }
    const data = await rpc('vendor_set_status',{p_id:id,p_status:status});
    const i=S.vendors.findIndex(x=>x.id===id); S.vendors[i]=data;
  },
  async remove(id){ if(LIVE) await rpc('vendor_delete',{p_id:id}); S.vendors = S.vendors.filter(x=>x.id!==id); },
  async listFiles(vid){
    if(!LIVE) return (S.files[vid]||[]).slice();
    return (await filesApi('list',{vendor_id:vid})).files;
  },
  async upload(vid, file, kind){
    if(!LIVE){ const path=vid+'/'+Date.now(); (S.files[vid]=S.files[vid]||[]).unshift({id:path,path,vendor_id:vid,file_name:file.name,mime_type:file.type||'',size_bytes:file.size,kind,uploaded_by:S.user.email,created_at:new Date().toISOString(),url:URL.createObjectURL(file)}); }
    else {
      const sig = await filesApi('sign_upload',{vendor_id:vid,file_name:file.name});
      const up = await sb.storage.from('vendor-files').uploadToSignedUrl(sig.path, sig.upload_token, file, {contentType:file.type||undefined});
      if(up.error) throw new Error(up.error.message);
      await filesApi('confirm',{vendor_id:vid,path:sig.path,file_name:file.name,mime_type:file.type||'',size_bytes:file.size,kind});
    }
    const v=S.vendors.find(x=>x.id===vid); if(v) v._files=(v._files||0)+1;
  },
  async removeFile(f){
    if(LIVE) await filesApi('delete',{file_id:f.id});
    else S.files[f.vendor_id]=(S.files[f.vendor_id]||[]).filter(x=>x.id!==f.id);
    const v=S.vendors.find(x=>x.id===f.vendor_id); if(v) v._files=Math.max(0,(v._files||1)-1);
  },
  async requestAccess(name,email,phone,note){
    const { data, error } = await sb.rpc('request_access',{p_name:name,p_email:email,p_phone:phone,p_note:note});
    if(error) throw new Error(error.message);
    S.token=data.token; try{ localStorage.setItem(TOKEN_KEY,S.token); }catch(e){}
    await DB.loadMe();
  },
  async decide(id,status){
    if(!LIVE){ S.members.find(m=>m.id===id).status=status; return; }
    await rpc('member_decide',{p_id:id,p_status:status}); await DB.loadTeam();
  },
  async newLink(id){
    if(!LIVE){ const m=S.members.find(x=>x.id===id); if(m.status==='revoked') m.status='approved'; return 'sample'+Math.random().toString(16).slice(2); }
    const t = await rpc('member_new_link',{p_id:id}); await DB.loadTeam(); return t;
  }
};

function priceLine(v){

function vatLabel(x){ const f=VAT.find(p=>p[0]===x); return f&&x?f[1]:''; }
function openDetail(id){
  const v=S.vendors.find(x=>x.id===id); if(!v) return;
  const sign=CUR_SIGN[v.currency]||'';
  const rows=(pairs)=>pairs.filter(p=>p[1]).map(([k,val])=>`<dt>${k}</dt><dd>${val}</dd>`).join('');
  const price=(p,vat)=>p?`<span class="mono">${esc(sign)}${esc(p)}</span>${vatLabel(vat)?` <span class="hint">${esc(vatLabel(vat))}</span>`:''}`:'';
  const notice=v.cancelNoticeAmount?`${esc(v.cancelNoticeAmount)} ${esc((v.cancelNoticeUnit||'').toLowerCase())}${v.cancelDayType?' ('+esc(v.cancelDayType.toLowerCase())+')':''}`:'';
  const rating=['rateReliability','rateService','rateValue'].map((k,i)=>v[k]?`${['Reliability','Service','Value'][i]} <b class="mono">${esc(v[k])}/5</b>`:'').filter(Boolean).join(' · ');
  const sections=[
    ['Contact',rows([['Contact',esc(v.contactPerson)],['Phone',v.phone?`<span class="mono">${esc(v.phone)}</span>`:''],['WhatsApp',v.whatsapp?`<span class="mono">${esc(v.whatsapp)}</span>`:''],['Email',esc(v.email)],['Website',v.website?`<a href="${esc(/^https?:/.test(v.website)?v.website:'https://'+v.website)}" target="_blank" rel="noopener">${esc(v.website)}</a>`:''],['Area',esc(v.location)],['Languages',esc(v.languages)],['Kosher',esc(v.kosher)],['Max capacity',v.maxCap?esc(v.maxCap)+' pax':''],['Park booking',v.npResLink?`<a href="${esc(v.npResLink)}" target="_blank" rel="noopener">Reservation page</a>`:'']])],
    ['Pricing',rows([['Agent price',price(v.agentPrice,v.agentPriceVatTreatment)],['Listed price',price(v.listedPrice,v.listedPriceVatTreatment)],['Basis',esc(v.priceBasis)],['Max pax',esc(v.maxPax)],['Payment terms',esc(v.payTerms)]])],
    ['Cancellation',rows([['Policy',esc(v.cancelPolicy)],['Notice',notice],['Penalty',esc(v.cancelPenalty)],['Verified',esc(v.cancelPolicyVerifiedDate)]])],
    ['Experience',rows([['Ratings',rating],['Strengths',esc(v.strengths)],['Weaknesses',esc(v.weaknesses)],['Notes',esc(v.notes)]])]
  ].filter(s=>s[1]);
  const body=`<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px"><span class="cat">${esc(v.category)}</span>${statusPill(v)}<span class="idtag">${esc(v.id)}</span></div>
    ${sections.map(([h,dl])=>`<fieldset><legend>${h}</legend><dl class="dl">${dl}</dl></fieldset>`).join('') || '<p class="hint">Only the name is filled in so far.</p>'}
    <fieldset><legend>Photos, receipts and PDFs</legend><div id="filesBox"><p class="hint">Loading files…</p></div></fieldset>
    <p class="stamp">Added by ${esc(v.created_by)} on ${fmtDate(v.created_at)}. Last changed by ${esc(v.updated_by)} on ${fmtDate(v.updated_at)}.</p>`;
  let foot=`<button class="btn primary" id="edit">Edit</button>`;
  if(S.admin){
    foot = `<button class="btn danger" id="del">Delete</button><span style="flex:1"></span>`
      + (v.review_status!=='approved'?'<button class="btn soft" id="rej">Reject</button><button class="btn accent" id="appr">Approve</button>':'') + foot;
  }
  const w=sheet(v.name, body, foot);
  w.querySelector('#edit').onclick=()=>openForm(v);
  drawFiles(v);
  const a=w.querySelector('#appr'); if(a) a.onclick=async()=>{ try{await DB.setStatus(v.id,'approved'); closeSheet(); toast('Approved'); render();}catch(e){toast(e.message);} };
  const r=w.querySelector('#rej'); if(r) r.onclick=async()=>{ try{await DB.setStatus(v.id,'rejected'); closeSheet(); toast('Marked rejected'); render();}catch(e){toast(e.message);} };
  const d=w.querySelector('#del'); if(d) d.onclick=async()=>{ if(d.dataset.c!=='1'){ d.dataset.c='1'; d.textContent='Tap again to delete'; return; } try{await DB.remove(v.id); closeSheet(); toast('Deleted'); render();}catch(e){toast(e.message);} };
}

const KINDS=['Photo','Receipt','Price list','Contract','Other'];
async function shrink(file){
  // Phone photos are large; resize to max 2000px JPEG. Keep PDFs and anything the browser can't decode as-is.
  if(!/^image\/(jpeg|png|webp)$/.test(file.type) || file.size < 1500000) return file;
  try{
    const bmp = await createImageBitmap(file); const k = Math.min(1, 2000/Math.max(bmp.width,bmp.height));
    const c=document.createElement('canvas'); c.width=Math.round(bmp.width*k); c.height=Math.round(bmp.height*k);
    c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);
    const blob = await new Promise(r=>c.toBlob(r,'image/jpeg',0.85));
    return blob && blob.size < file.size ? new File([blob], file.name.replace(/\.\w+$/,'')+'.jpg', {type:'image/jpeg'}) : file;
  }catch(e){ return file; }
}
async function drawFiles(v){
  const box=document.getElementById('filesBox'); if(!box) return;
  let files=[]; try{ files=await DB.listFiles(v.id); }catch(e){ box.innerHTML=`<div class="msg err">Couldn't load files: ${esc(e.message)}</div>`; return; }
  const me=(S.user.email||'').toLowerCase();
  box.innerHTML = (files.length?`<div class="files">${files.map((f,i)=>{
      const img=/^image\//.test(f.mime_type) && !/hei[cf]/.test(f.mime_type);
      const inner = img && f.url ? `<img src="${esc(f.url)}" alt="${esc(f.file_name)}" loading="lazy">` : `<span class="doc">${/pdf/.test(f.mime_type)?'PDF':'FILE'}</span>`;
      const canRm = S.admin || f.uploaded_by===me;
      return `<div class="file"><a class="thumb" href="${esc(f.url||'#')}" target="_blank" rel="noopener">${inner}</a>
        <span class="fkind">${esc(f.kind)}</span><span class="fname" title="${esc(f.file_name)}">${esc(f.file_name)}</span>
        ${canRm?`<button class="rm" data-i="${i}" type="button">Remove</button>`:''}</div>`; }).join('')}</div>`
    : `<p class="hint" style="margin:0 0 10px">No files yet. Add a photo of the place, a receipt, a price list or a contract.</p>`)
  + `<div class="upl"><select id="upKind" aria-label="What is it?">${KINDS.map(k=>`<option>${k}</option>`).join('')}</select>
      <label class="btn accent" for="upFile" style="display:inline-block">Add photo or file</label>
      <input id="upFile" type="file" accept="image/*,application/pdf" multiple hidden>
      <span class="hint" id="upMsg">Photos and PDFs, up to 10 MB each.</span></div>`;
  box.querySelectorAll('.rm').forEach(b=>b.onclick=async()=>{ if(b.dataset.c!=='1'){ b.dataset.c='1'; b.textContent='Tap again'; return; }
    try{ await DB.removeFile(files[+b.dataset.i]); toast('File removed'); drawFiles(v); }catch(e){ toast(e.message); } });
  const input=box.querySelector('#upFile'), msg=box.querySelector('#upMsg');
  input.onchange=async()=>{
    const picked=[...input.files]; if(!picked.length) return; const kind=box.querySelector('#upKind').value; let ok=0;
    for(const [n,f0] of picked.entries()){
      msg.textContent=`Uploading ${n+1} of ${picked.length}…`;
      if(!/^image\/|^application\/pdf$/.test(f0.type) && !/\.(pdf|heic|heif)$/i.test(f0.name)){ toast(`${f0.name}: only photos and PDFs`); continue; }
      const f=await shrink(f0);
      if(f.size>10485760){ toast(`${f0.name} is over 10 MB`); continue; }
      try{ await DB.upload(v.id,f,kind); ok++; }catch(e){ toast(`${f0.name}: ${e.message}`); }
    }
    if(ok) toast(ok===1?'File added':`${ok} files added`);
    drawFiles(v);
  };
}

function openForm(v){
  const x = Object.assign(blank(), {active:'Active',priceBasis:'Per person',currency:'ILS',category:''}, v||{});
  const inp=(k,label,type='text',ph='',wide=false,req=false)=>`<div class="f${wide?' wide':''}"><label for="f_${k}">${label}${req?' <em>*</em>':''}</label><input id="f_${k}" name="${k}" type="${type}" value="${esc(x[k])}" placeholder="${esc(ph)}"${type==='number'?' inputmode="decimal" min="0" step="any"':''}${type==='tel'?' inputmode="tel"':''}></div>`;
  const sel=(k,label,opts,wide=false,req=false)=>`<div class="f${wide?' wide':''}"><label for="f_${k}">${label}${req?' <em>*</em>':''}</label><select id="f_${k}" name="${k}">${opts.map(o=>{const [val,t]=Array.isArray(o)?o:[o,o];return `<option value="${esc(val)}"${String(x[k])===val?' selected':''}>${esc(t)}</option>`}).join('')}</select></div>`;
  const area=(k,label,ph)=>`<div class="f wide"><label for="f_${k}">${label}</label><textarea id="f_${k}" name="${k}" rows="2" placeholder="${esc(ph)}">${esc(x[k])}</textarea></div>`;
  const stars=(k,label)=>`<div class="f"><label>${label}</label><div class="stars" data-k="${k}">${[1,2,3,4,5].map(n=>`<button type="button" data-n="${n}" aria-pressed="${x[k]===String(n)}" aria-label="${label} ${n}">${n}</button>`).join('')}</div><input type="hidden" id="f_${k}" name="${k}" value="${esc(x[k])}"></div>`;
  const body=`<form id="vf" novalidate>
    <fieldset><legend>Vendor</legend><div class="grid">
      ${inp('name','Vendor or company name','text','Golan Jeeps Ltd.',true,true)}
      <div id="dupBox" class="f wide" hidden></div>
      ${sel('category','Category',[['','Choose…'],...CATEGORIES],false,true)}
      ${sel('active','Status',['Active','Inactive'])}
      <div class="f wide" id="npWrap" ${x.category==='National Park'?'':'hidden'}><label for="f_npResLink">National park booking link</label><input id="f_npResLink" name="npResLink" type="url" value="${esc(x.npResLink)}" placeholder="https://booking.parks.org.il/…"></div>
    </div></fieldset>
    <fieldset><legend>Contact</legend><div class="grid">
      ${inp('contactPerson','Contact person','text','Moshe Cohen')}${inp('phone','Phone','tel','+972 52 000 0000')}${inp('whatsapp','WhatsApp','tel','+972 52 000 0000')}
      ${inp('email','Email','email')}${inp('website','Website','text','example.co.il')}${inp('location','Area','text','Golan Heights')}
      ${inp('languages','Languages','text','English, Hebrew')}${inp('kosher','Kosher status','text','Mehadrin / Rabbanut / N/A')}${inp('maxCap','Max capacity (people)','number')}
    </div></fieldset>
    <fieldset><legend>Pricing</legend><div class="grid">
      ${inp('agentPrice','Agent price (ours)','number','0')}${sel('agentPriceVatTreatment','Agent price VAT',VAT)}
      ${inp('listedPrice','Listed price (public)','number','0')}${sel('listedPriceVatTreatment','Listed price VAT',VAT)}
      ${sel('currency','Currency',['ILS','USD','EUR'])}${sel('priceBasis','Price basis',BASIS)}
      ${inp('maxPax','Max people for this price','number','15')}${inp('payTerms','Payment terms','text','50% deposit, balance on arrival',true)}
    </div><p class="hint" style="margin:8px 0 0">Leave VAT as Unknown if you're not sure.</p></fieldset>
    <fieldset><legend>Cancellation</legend><div class="grid">
      ${inp('cancelPolicy','Policy as written','text','Free cancellation until 48h before',true)}
      ${inp('cancelNoticeAmount','Notice','number','7')}${sel('cancelNoticeUnit','Unit',[['','—'],'Hours','Days'])}${sel('cancelDayType','Counted in',[['','Not specified'],'Calendar days','Business days'])}
      ${inp('cancelPenalty','Penalty','text','50% fee inside notice period')}${inp('cancelPolicyVerifiedDate','Policy checked on','date')}
    </div></fieldset>
    <fieldset><legend>Your experience</legend><div class="grid">
      ${stars('rateReliability','Reliability')}${stars('rateService','Service')}${stars('rateValue','Value')}
      ${area('strengths','Strengths','Very punctual, great English…')}${area('weaknesses','Weaknesses','Sometimes overbooks…')}${area('notes','Notes','Ask for a group discount above 10 people…')}
    </div></fieldset>
    <div id="formErr"></div>
  </form>`;
  const foot=`<button class="btn soft" id="cancel" type="button">Cancel</button><button class="btn primary" id="saveBtn" type="button">${v?'Save changes':'Add vendor'}</button>`;
  const w=sheet(v?'Edit vendor':'New vendor', body, foot);
  const f=w.querySelector('#vf');
  w.querySelector('#cancel').onclick=closeSheet;
  f.querySelector('#f_category').addEventListener('change',e=>{ f.querySelector('#npWrap').hidden = e.target.value!=='National Park'; });
  f.querySelectorAll('.stars').forEach(g=>g.addEventListener('click',e=>{ const b=e.target.closest('button'); if(!b) return; const hid=f.querySelector('#f_'+g.dataset.k);
    const val = hid.value===b.dataset.n?'':b.dataset.n; hid.value=val; g.querySelectorAll('button').forEach(o=>o.setAttribute('aria-pressed', o.dataset.n===val)); }));
  const dupCheck=()=>{ const n=normN(f.querySelector('#f_name').value); const box=f.querySelector('#dupBox');
    const hit = n && S.vendors.find(o=>o.id!==(v&&v.id) && normN(o.name)===n);
    box.hidden=!hit; box.innerHTML = hit?`<div class="dup"><b>${esc(hit.name)}</b> is already on the list (${esc(hit.category)}). <button type="button" class="btn soft" style="padding:4px 10px;margin-left:4px" id="goDup">Open it</button></div>`:'';
    const g=box.querySelector('#goDup'); if(g) g.onclick=()=>openDetail(hit.id); return hit; };
  f.querySelector('#f_name').addEventListener('input',dupCheck); dupCheck();
  w.querySelector('#saveBtn').onclick=async()=>{
    const data = v?{id:v.id}:{}; R5_FIELDS.forEach(k=>{ const el=f.querySelector('#f_'+k); data[k]= el?el.value:(x[k]||''); });
    if(data.category!=='National Park') data.npResLink = x.npResLink||data.npResLink||'';
    const err=f.querySelector('#formErr');
    const probs=[]; if(!data.name.trim()) probs.push('Add the vendor name.'); if(!data.category) probs.push('Choose a category.');
    if(!v && dupCheck()) probs.push('This vendor is already on the list. Open it and edit it instead.');
    if(probs.length){ err.innerHTML=`<div class="msg err">${probs.join(' ')}</div>`; err.scrollIntoView({block:'center'}); return; }
    const btn=w.querySelector('#saveBtn'); btn.disabled=true; btn.textContent='Saving…';
    try{ const saved=await DB.save(data); closeSheet(); S.tab='vendors'; render(); if(!v){ openDetail(saved.id); toast('Vendor added. You can add photos and receipts now.'); } else toast(!S.admin && LIVE ? 'Saved. Daniel will review it.' : 'Saved'); }
    catch(e){ btn.disabled=false; btn.textContent=v?'Save changes':'Add vendor'; err.innerHTML=`<div class="msg err">Couldn't save: ${esc(e.message)}</div>`; }
  };
}

})();
