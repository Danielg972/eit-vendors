<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Inner Circle – Israel Guide</title>
<meta name="theme-color" content="#1f3a2e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Inner Circle">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600&family=Secular+One&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one-column field app — sticky header, tab bar at the bottom, sheets slide up for forms. */
:root{
  --ink:#16261e; --ink-2:#4a5a50; --ink-3:#7c8a80;
  --ground:#f3f5f1; --card:#ffffff; --line:#dde3db; --wash:#e8ede5;
  --olive:#1f3a2e; --olive-2:#2c5140; --ochre:#b8742a; --ochre-wash:#f6ead9;
  --ok:#2f7a4a; --ok-wash:#e3f1e7; --warn:#a66a12; --warn-wash:#fbefd9; --bad:#a63b2e; --bad-wash:#f8e3df;
  --on-olive:#f3f5f1; --tab-on:#2c5140; --mark:#1f3a2e;
  --f-display:"Secular One","Rubik",system-ui,sans-serif;
  --f-body:"Rubik",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --ink:#e6ebe4; --ink-2:#b0bcb2; --ink-3:#86938a;
  --ground:#121a15; --card:#1a241e; --line:#2c3a31; --wash:#223029;
  --olive:#2c5140; --olive-2:#3b6a54; --ochre:#e0a15a; --ochre-wash:#3a2c1a;
  --ok:#6cc58c; --ok-wash:#1d3325; --warn:#e7b35d; --warn-wash:#3a2e17; --bad:#ef8a7b; --bad-wash:#3b211d;
  --on-olive:#f3f5f1; --tab-on:#e0a15a; --mark:#e6ebe4; color-scheme:dark}}
:root[data-theme="dark"]{
  --ink:#e6ebe4; --ink-2:#b0bcb2; --ink-3:#86938a;
  --ground:#121a15; --card:#1a241e; --line:#2c3a31; --wash:#223029;
  --olive:#2c5140; --olive-2:#3b6a54; --ochre:#e0a15a; --ochre-wash:#3a2c1a;
  --ok:#6cc58c; --ok-wash:#1d3325; --warn:#e7b35d; --warn-wash:#3a2e17; --bad:#ef8a7b; --bad-wash:#3b211d;
  --on-olive:#f3f5f1; --tab-on:#e0a15a; --mark:#e6ebe4; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--ground);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--ochre);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--olive);color:var(--on-olive);padding:12px 16px}
.top-row{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:12px}
.brand{font-family:var(--f-display);font-size:21px;letter-spacing:.2px;line-height:1}
.brand small{display:block;font-family:var(--f-body);font-size:11px;letter-spacing:1.2px;text-transform:uppercase;opacity:.7;margin-top:4px}
.who{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:13px;opacity:.9;min-width:0}
.who span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:40vw}
.ghost-btn{background:transparent;border:1px solid rgba(243,245,241,.35);color:var(--on-olive);border-radius:999px;padding:5px 12px;font-size:13px}
.demo-bar{background:var(--ochre-wash);color:var(--ink);font-size:13px;padding:8px 16px;text-align:center;border-bottom:1px solid var(--line)}

main{max-width:760px;margin:0 auto;padding:16px 16px 110px}
.search{display:flex;gap:8px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:0 12px}
.search input{flex:1;min-width:0;border:0;background:transparent;padding:12px 0;outline:none;font-size:16px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:12px 0 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:10px 16px;font-size:15px;font-weight:500;color:var(--ink-2);min-height:42px}
.chip[aria-pressed="true"]{background:var(--olive);border-color:var(--olive);color:var(--on-olive)}
.count{font-size:12px;letter-spacing:1px;text-transform:uppercase;color:var(--ink-3);margin:14px 2px 8px}

.list{display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.row{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:14px 16px;border:0;border-bottom:1px solid var(--line);background:transparent;text-align:left;width:100%}
.row:last-child{border-bottom:0}
.row:hover{background:var(--wash)}
.row-name{font-weight:600;font-size:16px;min-width:0;overflow-wrap:anywhere}
.row-meta{grid-column:1;font-size:13px;color:var(--ink-2);display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center}
.row-price{grid-column:2;grid-row:1 / span 2;text-align:right;align-self:center}
.row-price b{display:block;font-family:var(--f-mono);font-weight:500;font-size:15px}
.row-price span{font-size:12px;color:var(--ink-3)}
.cat{font-size:11px;letter-spacing:.8px;text-transform:uppercase;color:var(--ochre);font-weight:600}
.pill{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.4px;border-radius:999px;padding:2px 8px}
.pill.approved{background:var(--ok-wash);color:var(--ok)}
.pill.pending{background:var(--warn-wash);color:var(--warn)}
.pill.rejected{background:var(--bad-wash);color:var(--bad)}
.pill.inactive{background:var(--wash);color:var(--ink-3)}
.empty{padding:36px 20px;text-align:center;color:var(--ink-2)}
.empty h3{font-family:var(--f-display);font-weight:400;font-size:20px;margin:0 0 6px;color:var(--ink)}

.fab{position:fixed;right:16px;bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:6;background:var(--ochre);color:#1b1206;border:0;border-radius:999px;padding:14px 20px;font-weight:600;box-shadow:0 6px 18px rgba(0,0,0,.18)}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--card);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;gap:4px}
.tab{flex:1;max-width:180px;border:0;background:transparent;padding:8px 4px;border-radius:8px;font-size:13px;color:var(--ink-3);display:flex;flex-direction:column;align-items:center;gap:3px;position:relative}
.tab svg{width:22px;height:22px}
.tab[aria-current="page"]{color:var(--tab-on);font-weight:600}
.badge{position:absolute;top:2px;left:calc(50% + 6px);background:var(--ochre);color:#1b1206;font-size:10px;font-weight:700;border-radius:999px;padding:1px 6px}

/* buttons */
.btn{border:0;border-radius:8px;padding:11px 16px;font-weight:600;font-size:15px}
.btn.primary{background:var(--olive);color:var(--on-olive)}
.btn.accent{background:var(--ochre);color:#1b1206}
.btn.soft{background:var(--wash);color:var(--ink)}
.btn.danger{background:var(--bad-wash);color:var(--bad)}
.btn.red{background:#c0392b;color:#fff}
.btn.upd{width:100%;margin:10px 0 4px;justify-content:center;gap:8px;flex-wrap:wrap}.btn.upd span{font-weight:400;font-size:12.5px;opacity:.9}
.presets .mini.on{background:var(--ink,#1f3a2e);color:#fff}
.food{border:1px solid var(--line,#ddd);border-radius:12px;padding:10px 12px;margin:0 0 16px}.food summary{cursor:pointer;font-weight:600}.food[open] summary{margin-bottom:8px}
.food a.mini{text-decoration:none}.foodadd{display:grid;gap:6px;margin-top:10px}.foodadd input,.foodadd select{width:100%}
.quickfill{border:1px dashed var(--line,#ccc);border-radius:12px;padding:10px 12px;margin:0 0 14px}
.kcrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:8px}
.agentbox a.btn{text-decoration:none}.agentbox{border:1px solid var(--line, #ddd);border-radius:12px;padding:10px 12px;margin:10px 0}.agentbox .ah{margin-bottom:4px}.agentbox p{margin:4px 0 8px;font-size:14px;white-space:pre-wrap}
.disclaim{font-size:12.5px;line-height:1.45;color:var(--ink-2);background:var(--warn-wash);border-radius:10px;padding:10px 12px;margin:18px 0 12px}
.btn:disabled{opacity:.5;cursor:default}
.btn-row{display:flex;gap:8px;flex-wrap:wrap}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(10,18,14,.45);z-index:20}
.sheet{position:fixed;left:0;right:0;bottom:0;top:calc(24px + env(safe-area-inset-top,0px));z-index:21;background:var(--ground);border-radius:16px 16px 0 0;display:flex;flex-direction:column;max-width:760px;margin:0 auto;box-shadow:0 -8px 30px rgba(0,0,0,.2)}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .22s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}}
.sheet-head{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.sheet-head h2{font-family:var(--f-display);font-weight:400;font-size:20px;margin:0;flex:1;min-width:0;overflow-wrap:anywhere}
.x{border:0;background:var(--wash);border-radius:999px;width:34px;height:34px;font-size:18px;line-height:1}
.sheet-body{flex:1;overflow-y:auto;padding:16px 16px 24px}
.sheet-foot{padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--card);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}

fieldset{border:0;margin:0 0 18px;padding:0}
legend{font-size:11px;letter-spacing:1.2px;text-transform:uppercase;color:var(--ink-3);font-weight:600;margin-bottom:8px;padding:0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.f.wide{grid-column:1 / -1}
.f label{font-size:13px;color:var(--ink-2)}
.f label em{color:var(--bad);font-style:normal}
.f input,.f select,.f textarea{width:100%;border:1px solid var(--line);background:var(--card);border-radius:8px;padding:10px 11px;font-size:16px}
.f textarea{resize:vertical;min-height:64px}
.hint{font-size:12px;color:var(--ink-3)}
.dup{background:var(--warn-wash);color:var(--warn);border-radius:8px;padding:10px 12px;font-size:13px;margin-top:8px}
.stars{display:flex;gap:4px}
.stars button{border:1px solid var(--line);background:var(--card);border-radius:8px;width:38px;height:38px;font-family:var(--f-mono)}
.stars button[aria-pressed="true"]{background:var(--ochre);border-color:var(--ochre);color:#1b1206;font-weight:600}

/* detail */
.dl{display:grid;grid-template-columns:minmax(110px,38%) 1fr;gap:8px 14px;margin:0 0 18px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.dl dt{font-size:13px;color:var(--ink-3)}
.dl dd{margin:0;min-width:0;overflow-wrap:anywhere}
.stamp{font-size:12px;color:var(--ink-3);margin-top:-6px}
.idtag{font-family:var(--f-mono);font-size:12px;color:var(--ink-3)}

/* panels */
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px}
.panel h3{font-family:var(--f-display);font-weight:400;font-size:19px;margin:0 0 4px}
.panel p{margin:0 0 12px;color:var(--ink-2);font-size:14px}
.rev{display:flex;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.rev:first-of-type{border-top:0}
.rev .who2{flex:1;min-width:180px}
.rev .who2 b{display:block}
.rev .who2 span{font-size:13px;color:var(--ink-2)}
.person{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.person span{flex:1;min-width:0;overflow-wrap:anywhere}
.addrow{display:flex;gap:8px;flex-wrap:wrap}
.addrow input{flex:1;min-width:180px;border:1px solid var(--line);background:var(--ground);border-radius:8px;padding:10px 11px;font-size:16px}
textarea.out{width:100%;min-height:160px;font-family:var(--f-mono);font-size:12px;border:1px solid var(--line);border-radius:8px;background:var(--ground);padding:10px}

/* sign in */
.gate{min-height:100%;display:flex;align-items:center;justify-content:center;padding:32px 16px}
.gate-card{width:100%;max-width:400px}
.gate .mark{font-family:var(--f-display);font-size:34px;color:var(--mark);line-height:1.05;margin:0 0 6px}
.gate p{color:var(--ink-2);margin:0 0 22px}
.gate .f{margin-bottom:12px}
.gate .btn{width:100%}
.msg{margin-top:14px;font-size:14px;border-radius:8px;padding:10px 12px}
.msg.ok{background:var(--ok-wash);color:var(--ok)}
.msg.err{background:var(--bad-wash);color:var(--bad)}
.files{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px;margin-bottom:12px}
.file{position:relative;display:flex;flex-direction:column;gap:4px;min-width:0}
.file a.thumb{display:flex;align-items:center;justify-content:center;aspect-ratio:1;max-width:100%;border:1px solid var(--line);border-radius:8px;background:var(--wash);overflow:hidden;text-decoration:none;color:var(--ink-2)}
.file a.thumb img{width:100%;height:100%;object-fit:cover}
.file .doc{font-family:var(--f-mono);font-size:13px;font-weight:500;color:var(--bad)}
.file .fname{font-size:12px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.file .fkind{font-size:10px;letter-spacing:.8px;text-transform:uppercase;color:var(--ochre);font-weight:600}
.file .rm{position:absolute;top:4px;right:4px;border:0;border-radius:999px;background:var(--card);color:var(--bad);font-size:12px;padding:3px 8px;box-shadow:0 1px 4px rgba(0,0,0,.15)}
.upl{display:flex;gap:8px;flex-wrap:wrap;align-items:center;background:var(--card);border:1px dashed var(--line);border-radius:var(--r);padding:12px}
.upl select{border:1px solid var(--line);background:var(--ground);border-radius:8px;padding:9px 10px;font-size:15px}
.upl .hint{flex-basis:100%}
.clip{font-size:12px;color:var(--ink-3)}
.actions{display:grid;grid-template-columns:repeat(auto-fit,minmax(72px,1fr));gap:8px;margin:0 0 16px}
.act{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 4px;border-radius:10px;background:var(--card);border:1px solid var(--line);color:var(--ink);text-decoration:none;font-size:12px;font-weight:500;text-align:center;line-height:1.2}
.act svg{width:22px;height:22px;color:var(--olive-2)}
.act img.bmark{width:22px;height:22px;object-fit:contain;display:block}
:root:not([data-theme="light"]) .act svg{color:var(--tab-on)}
.act:active{background:var(--wash)}
.prices{display:flex;flex-direction:column;gap:8px;margin-bottom:10px}
.pl{display:grid;grid-template-columns:1fr auto;gap:2px 12px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.pl .who3{font-weight:600;min-width:0;overflow-wrap:anywhere}
.pl .amt{font-family:var(--f-mono);font-weight:500;text-align:right}
.pl .meta{grid-column:1 / -1;font-size:12px;color:var(--ink-3)}
.pl .ctl{grid-column:1 / -1;display:flex;gap:6px;margin-top:4px}
.mini{border:1px solid var(--line);background:var(--ground);border-radius:8px;padding:5px 10px;font-size:13px}
.tag{display:inline-block;font-size:10px;letter-spacing:.6px;text-transform:uppercase;font-weight:600;border-radius:4px;padding:1px 6px;background:var(--wash);color:var(--ink-2);margin-right:4px}
.tag.agent{background:var(--ok-wash);color:var(--ok)}
.deal{background:var(--ochre-wash);border-radius:10px;padding:10px 12px;margin-bottom:8px}
.deal b{display:block}
.deal .meta{font-size:12px;color:var(--ink-2)}
.deal.expired{opacity:.55}
.code{font-family:var(--f-mono);background:var(--card);border:1px dashed var(--ochre);border-radius:6px;padding:1px 6px}
.note{border-left:3px solid var(--line);padding:4px 0 4px 10px;margin-bottom:10px}
.note .meta{font-size:12px;color:var(--ink-3)}
.note p{margin:2px 0 0;white-space:pre-wrap;overflow-wrap:anywhere}
.addline{display:flex;gap:8px;align-items:flex-start;margin-bottom:12px}
.addline textarea{flex:1;min-width:0;border:1px solid var(--line);background:var(--card);border-radius:8px;padding:10px;font-size:16px;min-height:44px;resize:vertical}
.lock{font-size:11px;color:var(--ink-3);font-weight:500}
.lockbar{background:var(--wash);border-radius:8px;padding:10px 12px;font-size:13px;color:var(--ink-2);margin-bottom:14px}
.diff{width:100%;border-collapse:collapse;font-size:13px;margin:6px 0}
.diff td,.diff th{padding:4px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top;overflow-wrap:anywhere}
.diff th{font-weight:500;color:var(--ink-3);font-size:12px}
.diff .old{color:var(--bad);text-decoration:line-through}
.diff .new{color:var(--ok);font-weight:600}
.sug{position:relative}
.sug-list{position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:8;background:var(--card);border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 20px rgba(0,0,0,.12);overflow:hidden}
.sug-list button{display:flex;gap:8px;width:100%;text-align:left;border:0;background:transparent;padding:10px 14px;font-size:15px;border-bottom:1px solid var(--line)}
.sug-list button:last-child{border-bottom:0}
.sug-list button:hover,.sug-list button.on{background:var(--wash)}
.sug-list .k{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--ochre);margin-left:auto;align-self:center}
.sec-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.sec-head legend{margin:0}
.sec-head .mini{margin-left:auto}
.qcard{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px}
.qcard.old{opacity:.6}
/* quote tracker */
.qt-intro h2{font-family:var(--f-display);font-weight:400;font-size:22px;margin:0 0 4px}
.qt-intro p{margin:0 0 12px;font-size:13.5px;color:var(--ink-2)}
.qstats{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:10px;margin:10px 0 6px}
.qstat{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--olive-2);border-radius:12px;padding:11px 14px}
.qstat .t{font-size:13px;font-weight:600;color:var(--ink-2)}
.qstat .n{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:25px;font-weight:500;line-height:1.2;margin:3px 0 2px}
.qstat .n small{font-family:var(--f-body);font-size:12px;font-weight:400;color:var(--ink-3);margin-left:7px}
.qstat .r{font-size:13px;color:var(--ink-2);margin-top:2px}
.qt-bar{display:flex;align-items:center;gap:8px;margin:14px 0 8px;font-size:13px;color:var(--ink-2)}
.qt-bar select{margin-left:auto;border:1px solid var(--line);background:var(--card);border-radius:8px;padding:6px 8px;font-size:14px}
.vlink{border:0;background:transparent;padding:0;font-size:16px;font-weight:600;color:var(--ink);text-align:left;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.qrate{display:flex;flex-wrap:wrap;align-items:baseline;gap:3px 8px;margin-top:6px}
.qrate .p{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:21px;font-weight:500}
.qrate .u{font-size:13px;color:var(--ink-2)}
.vs{font-size:12px;font-weight:600;border-radius:999px;padding:2px 9px;white-space:nowrap}
.vs.up{background:var(--bad-wash);color:var(--bad)}
.vs.down{background:var(--ok-wash);color:var(--ok)}
.vs.eq{background:var(--wash);color:var(--ink-2)}
.pill.high{background:var(--ochre-wash);color:var(--ink);box-shadow:inset 0 0 0 1px var(--ochre)}
.hrs{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;margin:-6px 0 14px;font-size:14px}
.hrs b{font-weight:500;flex-basis:100%}
.hrs .brk{flex-basis:100%;margin-top:4px}
.hrs .hv{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center}
.pill.shab{background:var(--ok-wash);color:var(--ok);box-shadow:inset 0 0 0 1px var(--ok)}

function statusPill(v){
  if(v.active==='Inactive') return '<span class="pill inactive">Inactive</span>';
  const s=v.review_status||'pending';
  if(v.hidden && s!=='approved') return '<span class="pill pending">Only you can see this · approve to share</span>';
  return `<span class="pill ${s}">${s==='approved'?'Approved':s==='rejected'?'Rejected':'Pending review'}</span>`;
}
function priceLine(v){
  const p = v.agentPrice || v.listedPrice; if(!p) return lim()&&v.category==='Guide'?'<span class="pill inactive">Ask for rate</span>':'';
  if(Number(p)===0) return `<b>Free</b><span>${esc((v.priceBasis||'').toLowerCase())}</span>`;
  const sign = CUR_SIGN[v.currency]||'';
  return `<b>${esc(sign)}${esc(Number(p).toLocaleString('en-US'))}</b><span>${esc((v.priceBasis||'').toLowerCase())}${v.agentPrice?'':' · listed'}</span>`;
}

function boot(){
  if(LIVE && (!S.token || !S.me)) return renderGate();
  if(LIVE && S.me.status!=='approved') return renderWaiting();
  if(LIVE && !S.me.is_admin && S.me.terms_version!==TERMS_VERSION) return renderTermsGate();
  render();
  if(!tourSeen()) openTour();
}

function copyText(text, el){
  return navigator.clipboard.writeText(text).then(()=>toast('Copied')).catch(()=>{ if(el){ el.focus(); el.select(); } toast('Selected. Copy it from here.'); });
}

}

<h4>1. Who runs this</h4><p>The Inner Circle – Israel Guide (until October 2026 called the Israel Suppliers Master List) is run by Eretz Israel Tours, which approves members and manages the list.</p>
<h4>2. Who can join</h4><p>Licensed tour guides, travel agents, tour operators and other travel professionals approved by Eretz Israel Tours. You confirm the details and license you submit are yours and true. Eretz Israel Tours can decline, pause or remove access at any time.</p>
<h4>2c. Organisations (limited members)</h4><p>People who book busses, guides or hotels for a school, a yeshiva or another organisation that is not in tourism can be approved as <b>limited members</b>, on what they write about their role instead of a license. Eretz Israel Tours chooses which sections each limited member sees. <b>A limited member never sees agent prices.</b> They see guides' and agents' reviews only where Eretz Israel Tours allows it: by default for transportation (drivers, bus companies, van drivers), and nowhere else. They see bus and van quotes without names, like everyone.</p><p><b>What a limited member adds is shown to every member</b>, limited members too: a rate they got (an "organisation rate") and a quote, without their name, and a review, with their name. Everything else in these terms applies to limited members as well.</p>
<h4>2a. Use it and add to it</h4><p>This list is meant to help everyone, and it works only if everyone takes part. <b>Every member has to both use the list and add to it</b>: a supplier, a price, a quote, a note, a deal, a driver review or a correction. A member who has not done both for 3 months gets a reminder, and is removed if that does not change.</p>
<h4>2b. Cost</h4><p><b>As of now, nobody pays to join, and you will not be asked to pay in the future.</b> If Eretz Israel Tours ever decides the costs are not worth bearing and a fee is introduced, founding members stay free. A founding member is anyone approved while the list is still free.</p>
<h4>3. What you share</h4><p>Share supplier information you believe is accurate and that you're allowed to share. Don't post personal member codes, card or bank details, or personal details of your clients. Be fair in ratings and notes: describe your own experience. When you add a driver, add only the phone number he uses for work; it is there so colleagues can tell drivers apart.</p>
<h4>3a. Fair, objective feedback</h4><p>Feedback, ratings, notes, supplier updates and reviews of drivers must be objective and factual. A driver review says what happened on your trip (timing, driving, service), with your name next to it. When something is your personal or subjective opinion, say so clearly (for example "In my opinion…").</p><p><b>Slandering or running down a colleague, competitor, supplier or anyone else, in any form, is grounds for being removed from the service. A malicious post is removed, and the member who posted it is banned.</b> Reports sent anonymously are not shown with your name, but are kept on record so this rule can be enforced.</p>
<h4>3b. Kosher restaurants only</h4><p><b>The list does not accept non-kosher restaurants.</b> Do not add one, as a supplier or as a food tip. Any that are found are removed. A restaurant that is kosher without a certificate is not accepted either, except as an exception that Eretz Israel Tours reviews and approves.</p>
<h4>3c. Licensed guides only; Eshkol needs a D1 license</h4><p><b>Only licensed tour guides may be listed as guides, or take guiding jobs, here.</b> The exception is a specialty that is not guiding in the licensed sense, such as a shuk tour or a graffiti tour; Eretz Israel Tours approves each of those. <b>Only a driver who holds a D1 driving license may be listed as an Eshkol driver or guide.</b> An entry that breaks either rule is removed.</p>
<h4>4. How you use it</h4><p>Use the list for your own professional work. Keep your personal link to yourself, and don't copy, resell or publish the list.</p><p><b>Never show the list to suppliers.</b> Don't show suppliers the app, screenshots, prices, notes or ratings from it. Anyone who does will lose access immediately.</p>
<h4>5. Crowdsourced: no responsibility for mistakes</h4><p>This is a crowdsourced list built by colleagues. Eretz Israel Tours takes no responsibility for mistakes, missing or out-of-date information. Please take great care when you add or change anything, and if you see a mistake, let us know with the <b>Update this supplier</b> button or the Feedback box. Prices, terms and contacts come from colleagues and can change. Always confirm with the supplier before booking. Eretz Israel Tours isn't responsible for information shared by members or for suppliers' services.</p>
<h4>6. Your data and privacy</h4><p>We store your name, email, phone, role, license number and license photo (for an organisation: its name and what you wrote about your role), what you add, when you last used the app, and which supplier contact buttons you tap (call, WhatsApp, email, website, maps and booking links), with the time. Colleagues see your name next to what you add, except quotes (see 6b). Your license photo is visible only to Eretz Israel Tours.</p><p><b>Eretz Israel Tours can see everything in the app, including items marked "private".</b> "Private" means hidden from other colleagues, not from Eretz Israel Tours.</p><p>Data is stored with Supabase (servers in Frankfurt, EU) and the app is hosted on GitHub Pages. You can ask Eretz Israel Tours at any time to see, correct or delete your data and account.</p>
<h4>6a. Email copies</h4><p><b>When you email a supplier with the app's Email button, Eretz Israel Tours is added as a BCC to help keep prices, bookings and supplier details up to date for everyone. You can see and remove it in each email, and you can opt out at any time under My settings.</b> WhatsApp messages and calls are not copied; the app only records that you tapped the button.</p>
<h4>6b. Quotes are shared without your name</h4><p><b>A quote you add is shared with colleagues by default, without your name.</b> They see the supplier, the dates, the prices, what was included, what cost extra and the conditions. They never see who got the quote, the client or trip, the supplier's reference, your private note or your attachments. You can switch sharing off on any quote; then only you and Eretz Israel Tours see it. Eretz Israel Tours sees who added every quote. The averages in the Quotes tab are worked out from these quotes. Don't write client names or personal details in the conditions box.</p>
<h4>6c. Booking sheets</h4><p><b>When you send a booking sheet, the bus or van company sees your name, your phone and the job</b>: date, passengers, vehicle, pick-up, outline of the day, drop-off and your notes to them. It never sees the client, your private note or anything else in this app. Once you confirm a sheet, its price and terms are shared with colleagues in the Quotes tab without your name, like any quote (6b). You can switch that off on each sheet. Eretz Israel Tours sees every booking sheet. A booking sheet records what you and the company agreed; it is not legal advice, and Eretz Israel Tours is not a party to your booking.</p>
<h4>6d. Jobs between colleagues, and My days</h4><p><b>A job you post is shown to the colleagues it fits, or to the ones you pick.</b> Posted without your name, they see "Posted by a colleague"; your name and phone go only to the colleague you give the job to, and you get theirs. A message you send yourself on WhatsApp comes from your own number. <b>If you tap "I'm available", the colleague who posted sees your name and role.</b> Eretz Israel Tours sees every job and who posted it.</p><p><b>As of now, nothing is charged on a job.</b> The price shown is what the colleague is paid, directly by the one who posted. Eretz Israel Tours is not a party to the job, does not check the people or the work, and is not responsible for payment between you.</p><p>My days: you mark the days you are busy. A colleague posting a job sees only "Free", "Busy" or "Not marked" for the dates of that job, never what you are doing, and you can switch that off. The jobs you say you take, your languages and what you hold (license, vehicle) are shown to a colleague posting a job, with your name and role. Never your phone or email.</p>
<h4>6e. A guide's page for clients</h4><p><b>A guide's page can hold a bio, up to four pictures and a retail price that are written for clients.</b> These are the one part of the list meant to leave it: a colleague may copy them and send them to a client. Everything else on the page stays between colleagues, including agent prices, quotes, notes, reviews and phone numbers.</p><p>Until the guide claims the page, any member can add or change them. Once the guide has claimed it, only the guide and Eretz Israel Tours can. Add only pictures you have the right to share, and that the people in them are happy to have shown.</p>
<h4>6f. Your own page, and reviews</h4><p>If you, or your business, are on the list, you can claim that page. Eretz Israel Tours approves the claim. <b>What colleagues wrote about your own page is hidden from you:</b> its ratings, strengths, weaknesses and notes, the notes thread, and reviews of you or of your company's drivers. Other colleagues still see them. The same holds, without a claim, for a page that carries your own phone number or email. You cannot rate or review your own page. You can dispute anything on it: the dispute goes to Eretz Israel Tours, who checks it and decides.</p><p><b>A guide's review of another guide is read by Eretz Israel Tours before colleagues see it:</b> a note on a guide's page, or a change to its ratings and remarks. Any note or driver review can be kept private; then only you and Eretz Israel Tours see it.</p>
<h4>7. Sponsored content</h4><p>If supplier offers or promotions are ever paid for, they will be clearly labelled as sponsored. Ratings and notes are never for sale.</p>
<h4>8. Changes</h4><p>If these terms change, you'll be asked to accept the new version.</p>`;

function proofNeeded(){ return !S.me || !S.me.has_proof; }
async function sendProof(file, out){
  if(!file){ return false; }
  if(!/^image\/|^application\/pdf$/.test(file.type)){ out.innerHTML='<div class="msg err">Upload a photo or a PDF of your license.</div>'; return false; }
  const f = await shrink(file);
  if(f.size>10485760){ out.innerHTML='<div class="msg err">That file is over 10 MB. Take a photo instead.</div>'; return false; }
  await DB.uploadProof(f); return true;
}

function filtered(){
  const q=normN(S.q);
  return S.vendors.filter(v=>(S.cat==='All'||catsOf(v).includes(S.cat)) && (S.reg==='All'||(v.region||'')===S.reg) && (S.cat!=='Transport'||!S.tat||(S.tat==='van')===isIndep(v)) && (S.cat!=='Transport'||!S.tveh||fleetOf(v).has(S.tveh)) && (S.cat!=='Guide'||!(S.gat||[]).length||S.gat.every(a=>String(v.tags||'').toLowerCase().split(',').map(t=>t.trim()).includes(a.toLowerCase()))) && (!q || normN([v.name,v.location,v.region,v.tags,v.contactPerson,v.category,v.notes].join(' ')).includes(q)))
    .sort(S.sort==='az' ? (a,b)=>a.name.localeCompare(b.name) : (a,b)=>mixKey(a)-mixKey(b));
}
// Mixed order: a shuffle that is different for each person and changes every day, so no supplier sits at the top
// just because of its name. Stable within the day so the list doesn't jump around while you use it.
// Categories and regions in the order this person uses them most (stable sort keeps the default order for ties).
function byUse(kind, list){ const u=(S.usage&&S.usage[kind])||{}; return [...list].sort((a,b)=>(u[b]||0)-(u[a]||0)); }
function useBump(kind, val){ if(!val||val==='All') return; /* order updates next time the app opens, so chips don't jump under your finger */ if(LIVE) sb.rpc('log_filter',{p_token:S.token,p_kind:kind,p_value:val}).then(()=>{},()=>{}); }
function mixKey(v){ const seed=(S.user&&S.user.email||'')+new Date().toISOString().slice(0,10)+v.id; let h=2166136261; for(let i=0;i<seed.length;i++){ h^=seed.charCodeAt(i); h=Math.imul(h,16777619); } return h>>>0; }

function suggestTerms(){
  const seen=new Map();
  const add=(t,kind)=>{ t=String(t||'').trim(); if(t.length<2) return; const k=t.toLowerCase(); if(!seen.has(k)) seen.set(k,{t,kind}); };
  S.vendors.forEach(v=>{ add(v.name,'Supplier'); add(v.region,'Region'); add(v.location,'Area'); add(v.contactPerson,'Contact'); add(v.category,'Category'); String(v.tags||'').split(',').forEach(t=>add(t,'Type')); });

  const favs=(S.myTop||[]).map(id=>S.vendors.find(v=>v.id===id)).filter(Boolean).slice(0,8);

    fb.querySelectorAll('[data-fav]').forEach(b=>b.onclick=()=>openDetail(b.dataset.fav)); }
  const q=document.getElementById('q'), list=document.getElementById('sugList'); let hits=[], on=-1;
  const close=()=>{ list.hidden=true; q.setAttribute('aria-expanded','false'); on=-1; };
  const pick=h=>{ if(h.kind==='Region'&&REGIONS.concat(S.vendors.map(v=>v.region)).includes(h.t)){ S.reg=h.t; S.q=''; viewVendors(); return; } if(h.kind==='Category'&&CATEGORIES.includes(h.t)){ S.cat=h.t; S.q=''; viewVendors(); return; }
    q.value=h.t; S.q=h.t; close(); drawList(); if(h.kind==='Supplier'){ const v=S.vendors.find(x=>x.name===h.t); if(v) openDetail(v.id); } };
  const show=()=>{
    const n=normN(q.value); if(!n){ close(); return; }
    const terms=suggestTerms();
    hits = terms.filter(h=>{ const t=normN(h.t); return t!==n && (t.startsWith(n) || t.split(' ').some(w=>w.startsWith(n)) || (n.length>2 && t.includes(n))); })
      .sort((a,b)=>(normN(a.t).startsWith(n)?0:1)-(normN(b.t).startsWith(n)?0:1) || a.t.length-b.t.length).slice(0,6);
    if(!hits.length){ close(); return; }
    list.innerHTML=hits.map((h,i)=>`<button type="button" role="option" data-i="${i}">${esc(h.t)}<span class="k">${esc(h.kind)}</span></button>`).join('');
    list.hidden=false; q.setAttribute('aria-expanded','true'); on=-1;

  };
  q.addEventListener('input',()=>{ S.q=q.value; drawList(); show(); });
  q.addEventListener('keydown',e=>{
    if(list.hidden) return;
    const bs=[...list.querySelectorAll('button')];
    if(e.key==='ArrowDown'||e.key==='ArrowUp'){ e.preventDefault(); on=(on+(e.key==='ArrowDown'?1:-1)+bs.length)%bs.length; bs.forEach((b,i)=>b.classList.toggle('on',i===on)); }
    else if(e.key==='Enter' && on>=0){ e.preventDefault(); pick(hits[on]); }
    else if(e.key==='Tab' && hits[0]){ e.preventDefault(); pick(hits[on>=0?on:0]); }
    else if(e.key==='Escape') close();
  });
  q.addEventListener('blur',()=>setTimeout(close,120));
  view.querySelectorAll('[data-cat]').forEach(c=>c.onclick=()=>{S.cat=c.dataset.cat; if(S.cat!=='All') useBump('category',S.cat); viewVendors();});
  view.querySelectorAll('[data-reg]').forEach(c=>c.onclick=()=>{S.reg=c.dataset.reg; if(S.reg!=='All') useBump('region',S.reg); viewVendors();});
  view.querySelectorAll('[data-tat]').forEach(c=>c.onclick=()=>{ S.tat=c.dataset.tat; viewVendors(); });
  view.querySelectorAll('[data-tveh]').forEach(c=>c.onclick=()=>{ S.tveh=c.dataset.tveh; viewVendors(); });
  const dst=view.querySelector('#drvStart'); if(dst) dst.onclick=()=>openDriverStart();
  view.querySelectorAll('[data-gat]').forEach(c=>c.onclick=()=>{ const a=c.dataset.gat; S.gat=(S.gat||[]).includes(a)?S.gat.filter(x=>x!==a):[...(S.gat||[]),a]; viewVendors(); });
  drawList();
}

function exportR5(list){
  const vendors = list.map(v=>{ const o={id:v.id}; R5_FIELDS.forEach(k=>o[k]=String(v[k]==null?'':v[k])); if(o.category==='National Parks') o.category='National Park'; if(o.category==='Winery') o.category='Restaurant'; if(o.category==='Adventure') o.category='Activity'; if(o.category==='Travel Agent'||o.category==='Itinerary Planner') o.category='Other'; return o; });
  const file = { _exportFormatVersion:3, _tripVendors:vendors, days:[] };
  const json = JSON.stringify(file,null,2);
  const name = `Israel_suppliers_${new Date().toISOString().slice(0,10)}.json`;
  const out=document.getElementById('expOut');
  out.innerHTML = `<p style="margin:12px 0 8px">${vendors.length} vendors ready.</p>
    <div class="btn-row" style="margin-bottom:8px">${LIVE?'<button class="btn primary" id="dl">Download '+esc(name)+'</button>':''}<button class="btn soft" id="cp">Copy file contents</button></div>
    <textarea class="out" id="expText" readonly>${esc(json)}</textarea>`;
  const dl=document.getElementById('dl'); if(dl) dl.onclick=()=>{ const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([json],{type:'application/json'})); a.download=name; document.body.appendChild(a); a.click(); a.remove(); };
  document.getElementById('cp').onclick=()=>{ const t=document.getElementById('expText'); navigator.clipboard.writeText(json).then(()=>toast('Copied')).catch(()=>{t.focus();t.select();toast('Selected. Copy it from here.');}); };
}

function accessBits(m){

  if(secs.includes('transport')){ bits.push(m.see_quotes?'bus and van quotes shown':'bus and van quotes hidden'); bits.push(m.see_transport_reviews?'transportation reviews shown':'transportation reviews hidden'); }

  bits.push(m.see_reviews?'all other reviews shown':'elsewhere, reviews from organisations only');
  return `<b>Sees:</b> ${esc(secs.map(secName).join(', '))}<br>${esc(bits.join(' · '))}<br>Can add suppliers, quotes, reviews and the rates they get, shown to everyone.`; }
function accessSummary(m){ return m.member_type==='limited' ? `<span class="jnote" style="display:block;flex-basis:100%;margin:0">${accessBits(m)}</span>` : ''; }

  if(!m) return;

  const w=sheet((approving?'Approve ':'Access: ')+m.name, body, `<button class="btn soft" id="acC" type="button">Cancel</button><button class="btn primary" id="acS" type="button">Save</button>`);

// ---------- dates: day / month / year ----------
// A browser shows <input type="date"> in the device's own order (month first on a US-set phone). So every date field
// becomes a dd/mm/yyyy box. The real date input stays behind it, hidden, and the rest of the code keeps reading and
// writing yyyy-mm-dd through it. The calendar button opens the device's own picker.
const ilDate=iso=>{ const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(String(iso||'')); return m?m[3]+'/'+m[2]+'/'+m[1]:String(iso||''); };
function parseIlDate(txt){
  let t=String(txt||'').trim(); if(/^\d{8}$/.test(t)) t=t.slice(0,2)+'/'+t.slice(2,4)+'/'+t.slice(4); else if(/^\d{6}$/.test(t)) t=t.slice(0,2)+'/'+t.slice(2,4)+'/'+t.slice(4);
  const m=/^(\d{1,2})[\/.\-\s](\d{1,2})(?:[\/.\-\s](\d{2}|\d{4}))?$/.exec(t); if(!m) return '';
  let d=+m[1], mo=+m[2], y=m[3]?+m[3]:new Date().getFullYear(); if(y<100) y+=2000;
  const dt=new Date(y,mo-1,d); if(dt.getFullYear()!==y||dt.getMonth()!==mo-1||dt.getDate()!==d) return '';
  return y+'-'+String(mo).padStart(2,'0')+'-'+String(d).padStart(2,'0'); }
const _valDesc=Object.getOwnPropertyDescriptor(HTMLInputElement.prototype,'value');
function ilDateField(inp){
  if(inp.dataset.il) return; inp.dataset.il='1';
  const raw=()=>_valDesc.get.call(inp), wrap=document.createElement('div'), txt=document.createElement('input'), btn=document.createElement('button');
  wrap.className='ildate'; txt.type='text'; txt.inputMode='numeric'; txt.placeholder='dd/mm/yyyy'; txt.autocomplete='off'; txt.maxLength=10; txt.value=ilDate(raw());
  btn.type='button'; btn.className='ilpick'; btn.setAttribute('aria-label','Choose from a calendar');
  btn.innerHTML='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>';
  inp.parentNode.insertBefore(wrap,inp); wrap.appendChild(txt); wrap.appendChild(btn); wrap.appendChild(inp);
  if(inp.id){ txt.id=inp.id+'_il'; const lab=wrap.parentNode.querySelector('label[for="'+inp.id+'"]'); if(lab) lab.htmlFor=txt.id; }
  inp.classList.add('ilnative'); inp.tabIndex=-1; inp.setAttribute('aria-hidden','true');
  let syncing=false;
  Object.defineProperty(inp,'value',{configurable:true,get(){ return raw(); },set(val){ _valDesc.set.call(inp,val); txt.value=ilDate(raw()); txt.classList.remove('bad'); }});
  txt.addEventListener('input',e=>{ let t=txt.value;
    if(e.inputType&&e.inputType.indexOf('insert')===0&&/^(\d{2}|\d{2}\/\d{2})$/.test(t)) txt.value=t=t+'/';
    const iso=parseIlDate(t); if(iso||!t.trim()){ _valDesc.set.call(inp,iso); txt.classList.remove('bad'); } else _valDesc.set.call(inp,''); });
  txt.addEventListener('blur',()=>{ const t=txt.value.trim(), iso=parseIlDate(t);
    if(iso) txt.value=ilDate(iso); txt.classList.toggle('bad',!!t&&!iso); _valDesc.set.call(inp,iso);
    syncing=true; inp.dispatchEvent(new Event('change',{bubbles:true})); syncing=false; });
  inp.addEventListener('change',()=>{ if(syncing) return; txt.value=ilDate(raw()); txt.classList.remove('bad'); });
  btn.onclick=()=>{ try{ inp.showPicker(); }catch(e){ try{ inp.focus(); inp.click(); }catch(e2){} } };
}
new MutationObserver(ms=>ms.forEach(m=>m.addedNodes.forEach(n=>{ if(n.nodeType!==1) return; if(n.matches&&n.matches('input[type="date"]')) ilDateField(n); else if(n.querySelectorAll) n.querySelectorAll('input[type="date"]').forEach(ilDateField); }))).observe(document.body,{childList:true,subtree:true});

  const nab=w.querySelector('#noteAdd'); if(nab) nab.onclick=async()=>{ const t=w.querySelector('#noteText'), pv=w.querySelector('#notePriv'); const body=t.value.trim(); if(!body){ t.focus(); return; }

      toast(r.private?'Saved. Only you and Eretz Israel Tours see it.':r.status==='pending'?'Sent to Eretz Israel Tours. Colleagues see it once it is approved.':lim()?'Review added. Thank you.':'Note added'); drawExtras(v); }catch(e){ toast(e.message); } };

async function drawExtras(v){
  let det; try{ det=await DB.detail(v.id); }catch(e){ const pb=document.getElementById('pricesBox'); if(pb) pb.innerHTML=`<div class="msg err">Couldn't load: ${esc(e.message)}</div>`; return; }
  const me=(S.user.email||'').toLowerCase();
  const pb=document.getElementById('pricesBox'); if(!pb) return;
  const privNote = (!S.admin && det.prices_private) ? '<p class="hint" style="margin:0 0 10px">Eretz Israel Tours keeps its prices for this supplier private. You can still add your own prices: only you (and Eretz Israel Tours) see them.</p>' : '';
  pb.innerHTML = privNote + (det.prices.length ? `<div class="prices">${det.prices.map((p,pi)=>`${p.org&&!(det.prices[pi-1]&&det.prices[pi-1].org)?'<div class="favs-h" style="margin:8px 2px 0">Organisation rates · what schools, yeshivas and other organisations were charged</div>':''}<div class="pl${p.by&&!p.by.admin?' colleague':''}">${fromBadge(p.by,p.by_date,p.org?(p.mine?'Your rate ·':'From'):(p.owner?(p.mine?'Your own price ·':'Own price from'):'From'))}
      <span class="who3">${esc(p.label||p.audience)}</span><span class="amt">${p.price?esc(money(p.currency,p.price)):'<span class="hint">Price to confirm</span>'}</span>
      <span class="meta">${p.org&&!p.private?'<span class="tag" style="background:var(--ochre-wash);color:var(--ink)">Organisation rate</span>':(p.owner||p.org?'<span class="tag" style="background:var(--ochre-wash);color:var(--ochre)">Only '+(p.mine?'you':'them')+' and Eretz Israel Tours see this</span>':(p.private?'<span class="tag" style="background:var(--bad-wash);color:var(--bad)">Private</span>':''))}${p.org?'':(p.is_agent?'<span class="tag agent">Agent rate</span>':'<span class="tag">Public price</span>')}${esc(priceWho(p))} · ${esc((p.basis||'').toLowerCase())}${vatLabel(p.vat)?' · '+esc(vatLabel(p.vat).toLowerCase()):''}${p.season?' · '+esc(p.season):''}</span>
      ${p.note||p.source||p.checked_on?`<span class="meta">${p.note?esc(p.note)+'<br>':''}${p.source?'Source: '+esc(p.source):''}${p.checked_on?' · checked '+esc(ilDate(p.checked_on)):''}</span>`:''}
      <span class="ctl">${p.org&&!p.mine&&!S.admin?'':`${(S.admin&&!(p.owner&&!p.mine))||p.mine?`<button class="mini" data-pedit="${esc(p.id)}" type="button">Edit</button>`:(S.admin?'':`<button class="mini" data-pedit="${esc(p.id)}" type="button">Suggest change</button>`)}<button class="mini" data-pdel="${esc(p.id)}" type="button">${S.admin||p.mine?'Remove':'Suggest removing'}</button>`}</span></div>`).join('')}</div>`
    : (privNote?'':`<p class="hint" style="margin:0 0 10px">${lim()?'No prices yet. Add the rate you got: everyone on the list sees it, without your name.':'No price lines yet. Add adult, child, Israeli senior or group rates as separate lines.'}</p>`));
  pb.querySelectorAll('[data-pedit]').forEach(b=>b.onclick=()=>openPriceForm(v, det.prices.find(p=>p.id===b.dataset.pedit), null, det.prices_private));
  pb.querySelectorAll('[data-pdel]').forEach(b=>b.onclick=async()=>{
    if(S.admin || (det.prices.find(p=>p.id===b.dataset.pdel)||{}).mine){ if(b.dataset.c!=='1'){ b.dataset.c='1'; b.textContent='Tap again'; return; } try{ await DB.deletePrice(v.id,b.dataset.pdel); toast('Price removed'); drawExtras(v); }catch(e){ toast(e.message); } return; }
    openReasonSheet('Suggest removing this price','Why should it be removed?', async reason=>{ await DB.deletePrice(v.id,b.dataset.pdel,reason); toast('Sent for approval'); openDetail(v.id); });
  });
  drawExtrasRest(v,det);
}
function drawExtrasRest(v,det){
  const me=(S.user.email||'').toLowerCase();
  const exp=d=>d.valid_to && d.valid_to<today();
  const db=document.getElementById('dealsBox'); if(!db) return;
  db.innerHTML = det.deals.length ? det.deals.map(d=>`<div class="deal${exp(d)?' expired':''}">
      <b>${esc(d.title)}</b>
      <span class="meta">${esc(d.kind)}${d.provider?' · '+esc(d.provider):''}${d.valid_to?(exp(d)?' · expired '+esc(ilDate(d.valid_to)):' · until '+esc(ilDate(d.valid_to))):''}</span>
      ${d.details?`<p style="margin:4px 0 0">${esc(d.details)}</p>`:''}
      ${d.code?`<p style="margin:4px 0 0">Code: <span class="code">${esc(d.code)}</span></p>`:''}
      ${d.link?`<p style="margin:4px 0 0"><a data-track="deal" data-v="${esc(v.id)}" href="${esc(d.link)}" target="_blank" rel="noopener">Open deal</a></p>`:''}
      ${(det.deal_by||{})[d.id]&&!(det.deal_by[d.id].admin)?fromBadge(det.deal_by[d.id],d.created_at,'Shared by'):`<span class="meta">Shared by ${esc(who(d.reported_by))}</span>`}
      ${S.admin||d.reported_by===me?` <button class="mini" data-ddel="${esc(d.id)}" type="button">Remove</button>`:''}</div>`).join('')
    : `<p class="hint" style="margin:0 0 10px">No deals yet. Share credit card club benefits (Cal, Max, Isracard, Hever), Cuponofesh-type vouchers, codes or group tricks.</p>`;
  db.querySelectorAll('[data-ddel]').forEach(b=>b.onclick=async()=>{ if(b.dataset.c!=='1'){ b.dataset.c='1'; b.textContent='Tap again'; return; } try{ await DB.deleteDeal(v.id,b.dataset.ddel); toast('Deal removed'); drawExtras(v); }catch(e){ toast(e.message); } });
  const nb=document.getElementById('notesBox');
  if(nb){
    nb.innerHTML = det.notes.length ? det.notes.map(n=>{ const nby=(det.note_by||{})[n.id];
        return `<div class="note"><span class="meta">${n.rating?`<span class="st" role="img" aria-label="${esc(n.rating)} out of 5">${starsTxt(+n.rating)}</span> · `:''}<b>${esc(n.author_name||n.author)}</b>${n.org?` · ${esc(nby&&nby.role||'Organisation')} <span class="tag">Organisation</span>`:''} · ${fmtDate(n.created_at)}${S.admin||n.mine||n.author===me?` · <button class="mini" style="padding:1px 8px" data-ndel="${esc(n.id)}" type="button">Delete</button>`:''}</span>
        ${noteTags(n)?`<div>${noteTags(n)}</div>`:''}<p>${esc(n.body)}</p>
        ${S.admin&&n.status==='pending'?`<div class="btn-row" style="margin:0 0 6px"><button class="mini" data-nno="${esc(n.id)}" type="button">Turn down</button><button class="mini" data-nyes="${esc(n.id)}" type="button">Approve</button></div>`:''}</div>`; }).join('')
      : `<p class="hint" style="margin:0">${lim()?'No reviews yet. Yours would be the first.':'No notes yet.'}</p>`;
    nb.querySelectorAll('[data-ndel]').forEach(b=>b.onclick=async()=>{ if(b.dataset.c!=='1'){ b.dataset.c='1'; b.textContent='Tap again'; return; } try{ await DB.deleteNote(v.id,b.dataset.ndel); drawExtras(v); }catch(e){ toast(e.message); } });
    const nd=async(b,yes)=>{ b.disabled=true; try{ await DB.decideNote(yes?b.dataset.nyes:b.dataset.nno, yes, v.id); try{ await DB.loadPendingNotes(); }catch(e){} toast(yes?'Approved. Colleagues see it now.':'Turned down'); drawExtras(v); }catch(e){ b.disabled=false; toast(e.message); } };
    nb.querySelectorAll('[data-nyes]').forEach(b=>b.onclick=()=>nd(b,true)); nb.querySelectorAll('[data-nno]').forEach(b=>b.onclick=()=>nd(b,false));
  }
  drawClaim(v,det);
  drawSiteBits(v,det);
  drawActivity(v);
  const an=document.getElementById('adminNote');
  if(an){ an.value=det.admin_note||''; const b=document.getElementById('adminNoteSave'); b.onclick=async()=>{ try{ await DB.saveAdminNote(v.id, an.value); toast('Private note saved'); }catch(e){ toast(e.message); } }; }
  const rb=document.getElementById('reqBox');
  if(rb && det.requests && det.requests.length){ rb.innerHTML=`<div class="lockbar">${det.requests.length} suggested change${det.requests.length>1?'s':''} waiting for ${S.admin?'your ':''}approval.${S.admin?' See the Review tab.':''}</div>`; }
}

const FB_KINDS=[['Suggestion','💡 Idea'],['Bug','🐞 Something broke'],['Question','❓ Question'],['Other','Other']];
const FB_STATUS=['New','Planned','Done',"Won't do"];
function fbPill(st){ const c={New:'pending',Planned:'pending',Done:'approved',"Won't do":'inactive'}[st]||'pending'; return `<span class="pill ${c}">${esc(st)}</span>`; }
function openFeedback(){
  const where = S.openVendor ? 'Supplier: '+S.openVendor : ({vendors:'Suppliers list',quotes:'Quotes',review:'Review',team:'Team'}[S.tab]||S.tab);
  const mine=(S.feedback||[]).filter(f=>f.author===(S.user.email||'').toLowerCase());
  const body=`<form id="fbf" novalidate>
    <p style="margin:0 0 12px;color:var(--ink-2)">Ideas, problems, questions: everything goes straight to Eretz Israel Tours.</p>
    <div class="chips" role="radiogroup" aria-label="Type" style="padding-top:0">${FB_KINDS.map(([k,l],i)=>`<button type="button" class="chip" data-k="${k}" aria-pressed="${i===0}">${l}</button>`).join('')}</div>
    <div class="f wide" style="margin-top:8px"><label for="fbMsg">Your message</label><textarea id="fbMsg" rows="5" placeholder="What would make this better, or what went wrong?"></textarea></div>
    <div class="f wide" style="margin-top:10px"><label for="fbFile">Screenshot (optional)</label><input id="fbFile" type="file" accept="image/*,application/pdf"></div>
    <p class="hint" style="margin:8px 0 0">Sent with: ${esc(where)} and your phone or browser type, to help fix bugs. <button type="button" class="linkbtn" id="fbTerms">Terms and privacy</button></p>
    <div id="fbErr"></div></form>
    ${mine.length?`<fieldset style="margin-top:22px"><legend>What you sent before</legend>${mine.map(f=>`<div class="note"><span class="meta">${esc(f.kind)} · ${fmtDate(f.created_at)} ${fbPill(f.status)}</span><p>${esc(f.message)}</p>${f.reply?`<p style="margin-top:6px;color:var(--ok)"><b>Eretz Israel Tours:</b> ${esc(f.reply)}</p>`:''}</div>`).join('')}</fieldset>`:''}`;
  const w=sheet('Feedback', body, `<button class="btn soft" id="fbC" type="button">Cancel</button><button class="btn primary" id="fbS" type="button">Send</button>`);
  let kind='Suggestion';
  w.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{ kind=b.dataset.k; w.querySelectorAll('[data-k]').forEach(o=>o.setAttribute('aria-pressed', o===b)); });
  w.querySelector('#fbC').onclick=closeSheet; w.querySelector('#fbTerms').onclick=openTerms;
  w.querySelector('#fbS').onclick=async()=>{
    const msg=w.querySelector('#fbMsg').value.trim(), err=w.querySelector('#fbErr'), btn=w.querySelector('#fbS');
    if(msg.length<3){ err.innerHTML='<div class="msg err">Write a few words first.</div>'; return; }
    let file=w.querySelector('#fbFile').files[0]; if(file){ file=await shrink(file); if(file.size>10485760){ err.innerHTML='<div class="msg err">That file is over 10 MB.</div>'; return; } }
    btn.disabled=true; btn.textContent='Sending…';
    try{ await DB.sendFeedback(kind,msg,where,file); closeSheet(); toast('Thanks! We\'ll take a look.'); render(); }
    catch(e){ btn.disabled=false; btn.textContent='Send'; err.innerHTML=`<div class="msg err">${esc(e.message)}</div>`; }
  };
}
function feedbackPanel(){
  const list=S.feedback||[];
  return `<section class="panel"><h3>Feedback from colleagues</h3>
    <p>Ideas, bugs and questions sent from the Feedback button. Your reply is shown to the person who sent it.</p>
    ${list.length? list.map(f=>`<div class="rev" style="display:block"><div class="who2"><b>${esc(f.kind)} from ${esc(f.author_name||f.author)}</b><span>${fmtDate(f.created_at)}${f.context?' · '+esc(f.context):''}</span></div>
      <p style="margin:6px 0;white-space:pre-wrap">${esc(f.message)}</p>
      ${f.device?`<p class="hint" style="margin:0 0 6px">${esc(f.device)}</p>`:''}
      ${f.has_file?`<p style="margin:0 0 8px"><button class="mini" data-fbfile="${esc(f.id)}" type="button">Open screenshot</button> <span id="fbl_${esc(f.id)}"></span></p>`:''}
      <div class="addrow"><select class="mini" id="fbs_${esc(f.id)}">${FB_STATUS.map(x=>`<option${x===f.status?' selected':''}>${esc(x)}</option>`).join('')}</select>
        <input id="fbr_${esc(f.id)}" value="${esc(f.reply)}" placeholder="Reply (optional)"><button class="btn primary" data-fbsave="${esc(f.id)}" type="button">Save</button></div></div>`).join('')
      : '<div class="empty" style="padding:16px">No feedback yet.</div>'}

const Q_UNITS=['per room per night','per person','per person per night','per vehicle per day','per day','per hour','per group','flat','% of subtotal'];
const Q_KINDS=['Base','Supplement','Meal','Extra','Discount'];
const Q_STATUS=['Requested','Received','Booked','Expired','Declined'];
function nightsOf(q){ if(!q.date_from||!q.date_to) return 0; const n=Math.round((new Date(q.date_to)-new Date(q.date_from))/86400000); return n>0?n:0; }
function defTimes(unit,q){ const n=nightsOf(q); if(/per night/.test(unit)) return n||1; if(/per day/.test(unit)) return (n?n+1:1); return 1; }
function lineCalc(lines){
  const num=x=>parseFloat(x)||0; let sub=0; const rows=lines.map(l=>{ if(l.unit==='% of subtotal') return {l,amt:null}; let a=num(l.price)*num(l.qty||1)*num(l.times||1); if(l.kind==='Discount') a=-a; sub+=a; return {l,amt:a}; });
  let total=sub; rows.forEach(r=>{ if(r.amt===null){ let a=sub*num(r.l.price)/100; if(r.l.kind==='Discount') a=-a; r.amt=a; total+=a; } });
  return {rows,total};
}
function fmtMoney(cur,a){ const sign=CUR_SIGN[cur]||''; const neg=a<0; const v=Math.abs(Math.round(a*100)/100).toLocaleString('en-US',{maximumFractionDigits:2}); return (neg?'−':'')+sign+v; }
function fmtRange(q){
  const o={day:'numeric',month:'short'}; const y={year:'numeric'};
  if(!q.date_from) return 'Dates not set';
  const a=new Date(q.date_from), b=q.date_to&&q.date_to!==q.date_from?new Date(q.date_to):null;
  const s1=a.toLocaleDateString('en-GB',o), s2=b?b.toLocaleDateString('en-GB',o):'';
  const n=nightsOf(q);
  return `${s1}${b?'–'+s2:''} ${(b||a).toLocaleDateString('en-GB',y)}${n?` · ${n} night${n>1?'s':''}`:''}`;
}
function lineHow(l,cur){
  if(l.price==='') return 'Price to confirm';
  if(l.unit==='% of subtotal') return `${l.price}% of subtotal`;
  const parts=[fmtMoney(cur,parseFloat(l.price)||0)+' '+l.unit]; if(parseFloat(l.qty)!==1) parts.push('× '+l.qty); if(parseFloat(l.times)!==1) parts.push('× '+l.times+(/night/.test(l.unit)?' nights':/day/.test(l.unit)?' days':''));
  return parts.join(' ');
}

function starsTxt(n){ n=Math.max(0,Math.min(5,Math.round(n))); return '★★★★★'.slice(0,n)+'☆☆☆☆☆'.slice(0,5-n); }
function fmtMonth(ym){ try{ return new Date(ym+'-15T12:00:00').toLocaleDateString('en-GB',{month:'short',year:'numeric'}); }catch(e){ return ym; } }

// High season: August, December, and the weeks of Pesach and Sukkot (Chol HaMoed). Worked out from the quote's dates.
const HOLIDAY_START={Pesach:{2024:'04-23',2025:'04-13',2026:'04-02',2027:'04-22',2028:'04-11',2029:'03-31',2030:'04-18',2031:'04-08',2032:'03-27',2033:'04-14',2034:'04-04',2035:'04-24'},

function drawTracker(){
  const box=document.getElementById('qtBody'); if(!box) return; const t=S.qt, all=trackerRows(S.quotes||[]);
  if(!all.length){ box.innerHTML=`<div class="empty"><h3>No quotes here yet</h3><p>Add the first one: pick the supplier, enter the daily or hourly rate, and mark what was included and what cost extra. Once three quotes of the same kind are in, the average shows.</p><button class="btn accent" id="qtFirst" type="button">+ Add quote</button></div>`; box.querySelector('#qtFirst').onclick=()=>openQuotePicker(); return; }
  const n=normN(t.q);
  const typed=all.filter(r=>(t.grp==='All'||svcGroup(r.svc)===t.grp)&&(t.svc==='All'||r.svc===t.svc));
  const rows=typed.filter(r=>(t.season==='All'||(r.season&&(t.season==='High')===r.season.high))&&(!n||normN([r.v.name,r.o.name,svcLabel(r.svc),({van20:'minibus sprinter',van16:'minibus sprinter',van10:'minivan',van8:'minivan vito v-class vip',car:'sedan suv vip'})[r.svc]||'',r.v.region,r.v.location].join(' ')).includes(n)));
  const market=rateStats(all), shown=Object.values(rateStats(n?rows:typed)).sort((a,b)=>b.all.length-a.all.length);
  const first=r=>r.rates.length?r.rates[0].price:null;
  const sorted=[...rows].sort((a,b)=> t.sort==='low'||t.sort==='high' ? ((first(a)==null)-(first(b)==null) || (t.sort==='low'?first(a)-first(b):first(b)-first(a))) : String(b.ref||'').localeCompare(String(a.ref||'')));
  const cap=t.allStats?shown.length:6;
  box.innerHTML=`
    ${shown.length?`<div class="qstats">${shown.slice(0,cap).map(statCard).join('')}</div>${shown.length>cap?`<button class="mini" id="qtMore" type="button">Show all ${shown.length} averages</button>`:''}
      <p class="hint" style="margin:6px 0 0">${n?'Averages for what matches your search. ':''}High season is August, December and the weeks of Pesach and Sukkot (Chol HaMoed), worked out from each quote's dates. Averages use quotes from the last two years.</p>`:''}
    <div class="qt-bar"><span>${rows.length} quote${rows.length===1?'':'s'} from ${new Set(rows.map(r=>r.v.id)).size} supplier${new Set(rows.map(r=>r.v.id)).size===1?'':'s'}</span>
      <select id="qtSort" aria-label="Sort quotes"><option value="new"${t.sort==='new'?' selected':''}>Newest dates first</option><option value="low"${t.sort==='low'?' selected':''}>Cheapest first</option><option value="high"${t.sort==='high'?' selected':''}>Most expensive first</option></select></div>
    ${sorted.length?sorted.map(r=>trackerCard(r,market)).join(''):'<div class="empty" style="padding:20px"><p>No quotes match. Try another type, season or search.</p></div>'}`;
  const more=box.querySelector('#qtMore'); if(more) more.onclick=()=>{ t.allStats=true; drawTracker(); };
  box.querySelector('#qtSort').onchange=e=>{ t.sort=e.target.value; drawTracker(); };
  box.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>openDetail(b.dataset.open));
}

  const inp=w.querySelector('#qpq'), list=w.querySelector('#qpList');

// ---------- booking sheets: the guide's side ----------
// A guide fills in the job, sends the bus or van company a link, and the company fills in the price and terms.
// Open to Eretz Israel Tours only until the Team tab switch opens it to colleagues (whoami.bookings).
(function(){ const st=document.createElement('style'); st.textContent=BKS_CSS; document.head.appendChild(st); })();
const bookingsOn=()=>!LIVE||!!(S.me&&S.me.bookings);
const bkLink=b=>LIVE?APP_URL+'b/?k='+encodeURIComponent(b.key):APP_URL+'b/index.html?demo=1';
const BK_SERVICES=[...VEHICLES.map(x=>[x[0],x[1]]),['jeep_vehicle','Jeep / 4x4 with driver'],['transfer','Airport transfer']];
const BK_STATUS={waiting:['pending','Waiting for the company'],answered:['high','Your turn · check and accept'],confirmed:['approved','Accepted by both sides'],cancelled:['inactive','Cancelled']};
const bkPill=b=>{ const s=BK_STATUS[b.status]||BK_STATUS.waiting; return `<span class="pill ${s[0]}">${esc(s[1])}</span>`; };
const bkVendor=b=>S.vendors.find(v=>v.id===b.vendor_id);
const BK_NUM=['price','hours_incl','km_incl','overtime','extra_km','tip_amt'];
function bkCard(b, withVendor){ const t=b.terms||{};
  return `<button class="qcard bkcard${b.status==='cancelled'?' old':''}" type="button" data-bk="${esc(b.id)}">
    <div class="qhead"><b>${esc(withVendor?(b.vendor_name||'Supplier'):bkRange(b,false)||'No date yet')}</b>${bkPill(b)}</div>
    <div class="qsub">${[withVendor?esc(bkRange(b,false)):'',esc(bkVehicle(b,false)),b.pax?esc(b.pax)+' people':'',b.client_ref?esc(b.client_ref):''].filter(Boolean).join(' · ')}</div>
    ${t.price?`<div class="qrate"><span class="p">${esc(bkMoney(t,t.price))}</span><span class="u">per day${BK_VAT[t.vat]?' · '+esc(BK_VAT[t.vat][1]):''}</span></div>`:''}
    ${!b.mine&&b.owner_name?`<div class="qsub">Sheet from ${esc(b.owner_name)}${b.owner_role?' · '+esc(b.owner_role):''}</div>`:''}</button>`; }
// Open the sheet from the list at once, then swap in the server's copy if the company has acted since the list loaded.
function bkWireCards(root, list){ root.querySelectorAll('[data-bk]').forEach(el=>el.onclick=()=>{ const b=list.find(x=>String(x.id)===el.dataset.bk); if(!b) return; openBookingView(b);
  if(LIVE) DB.loadBookings(b.vendor_id).then(fresh=>{ const nb=(fresh||[]).find(x=>String(x.id)===String(b.id));
    if(nb&&nb.updated_at!==b.updated_at&&S.viewingBk===String(b.id)&&document.getElementById('bvClose')){ S.bookings=null; openBookingView(nb); } }).catch(()=>{}); }); }
function bkExplain(then){
  let seen=false; try{ seen=localStorage.getItem('eitv_bk_seen')==='1'; }catch(e){}
  if(seen) return then();
  const w=sheet('How booking sheets work', `<p style="margin:0 0 10px">A booking sheet puts a bus or van booking in writing, so the price can't change afterwards.</p>
    <ol style="margin:0 0 12px;padding-left:20px;line-height:1.5"><li><b>You fill in the job</b>: date, passengers, vehicle, pick-up, outline of the day, drop-off.</li>
    <li><b>You send the company a link</b> on WhatsApp or email. It opens that one booking and nothing else. The company never sees this list.</li>
    <li><b>The company fills in the price and terms</b>: hours and km included, overtime, extra km, Kvish 6, parking, tip, cancellation, payment.</li>
    <li><b>Both sides accept.</b> The company accepts by sending its terms; you accept by tapping Accept. Then the sheet locks, and either side can save it as a PDF.</li>
    <li><b>A change goes back for approval.</b> If you or the company change anything before both have accepted, it shows in red on the other side, who has to accept again.</li></ol>
    <p class="hint" style="margin:0">The company sees your name and phone and the job. It never sees the client, your private note or anything else in the app. A confirmed price and its terms are shared with colleagues in the Quotes tab without your name, unless you switch that off on the sheet.</p>`,
    `<button class="btn primary" id="bkOk" type="button">Got it</button>`);
  w.querySelector('#bkOk').onclick=()=>{ try{ localStorage.setItem('eitv_bk_seen','1'); }catch(e){} then(); };
}
async function viewBookings(){
  const box=document.getElementById('bkBody'); if(!box) return;
  if(!S.bookings){ box.innerHTML='<p class="hint" style="padding:24px 0">Loading booking sheets…</p>';
    try{ S.bookings=await DB.loadBookings('')||[]; }catch(e){ box.innerHTML=`<div class="msg err">Couldn't load booking sheets: ${esc(e.message)}</div>`; return; }
    if(!document.getElementById('bkBody')) return; }
  const list=S.bookings, b2=document.getElementById('bkBody');
  if(!list.length){ b2.innerHTML=`<div class="empty"><h3>No booking sheets yet</h3><p>Booking a bus or a van? Fill in the job, send the company its link, and get the price and every extra back in writing.</p><button class="btn accent" id="bkFirst" type="button">+ New booking sheet</button></div>`;
    b2.querySelector('#bkFirst').onclick=()=>bkExplain(openBookingPicker); return; }
  const open=list.filter(b=>b.status==='waiting'||b.status==='answered'), done=list.filter(b=>b.status==='confirmed'||b.status==='cancelled');
  b2.innerHTML=`${open.length?`<p class="favs-h" style="margin:4px 2px 8px">Open</p>${open.map(b=>bkCard(b,true)).join('')}`:''}
    ${done.length?`<p class="favs-h" style="margin:14px 2px 8px">Closed</p>${done.map(b=>bkCard(b,true)).join('')}`:''}`;
  bkWireCards(b2, list);
}
async function drawBookings(v){
  const box=document.getElementById('bookingsBox'); if(!box) return;
  let list=[]; try{ list=await DB.loadBookings(v.id)||[]; }catch(e){ box.innerHTML=`<div class="msg err">Couldn't load booking sheets: ${esc(e.message)}</div>`; return; }
  if(!document.getElementById('bookingsBox')) return;
  if(!list.length){ box.innerHTML='<p class="hint" style="margin:0 0 10px">No booking sheets yet. Send the job, get the price and every extra back in writing: hours, km, Kvish 6, tip.</p>'; return; }
  box.innerHTML=list.map(b=>bkCard(b,false)).join(''); bkWireCards(box, list);
}
function openBookingPicker(){
  const w=sheet('New booking sheet', `<p style="margin:0 0 10px">Which bus or van company are you booking?</p>
    <label class="search" for="bpq">${icons.search}<input id="bpq" type="search" placeholder="Search company or driver" autocomplete="off"></label>
    <div id="bpList" style="margin-top:10px"></div>
    <p class="hint" style="margin-top:12px">Not on the list? Add the company first, in the Suppliers tab.</p>`, `<button class="btn soft" id="bpc" type="button">Cancel</button>`);
  const inp=w.querySelector('#bpq'), list=w.querySelector('#bpList');
  const draw=()=>{ const n=normN(inp.value);
    const hits=S.vendors.filter(v=>catsOf(v).includes('Transport')&&(!n||normN([v.name,v.contactPerson,v.tags,v.region,v.location].join(' ')).includes(n))).sort((a,b)=>a.name.localeCompare(b.name)).slice(0,40);
    list.innerHTML=hits.length?hits.map(v=>`<button class="pick" type="button" data-v="${esc(v.id)}"><b>${esc(v.name)}</b><span>${esc(isIndep(v)?'Van driver':(v.region||v.location||'Transport'))}</span></button>`).join(''):'<p class="hint">No transport supplier with that name.</p>';
    list.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{ const v=S.vendors.find(x=>x.id===b.dataset.v); if(v) openBookingForm(v,null,'quotes'); }); };
  inp.addEventListener('input',draw); w.querySelector('#bpc').onclick=closeSheet; draw(); setTimeout(()=>inp.focus(),50);
}
// The price-and-terms fields, used for "terms you expect" and for typing in the company's answer.
function bkTermsForm(t,p){ t=t||{};
  const seg=(k,opts)=>`<div class="tgs seg" data-seg="${k}" role="group">${opts.map(([val,l])=>`<button class="tg" type="button" data-val="${val}" aria-pressed="${t[k]===val}">${esc(l)}</button>`).join('')}</div>`;
  const inp=(k,label,ph,mode)=>`<div class="f"><label for="${p}${k}">${label}</label><input id="${p}${k}" data-t="${k}" ${mode?`inputmode="${mode}"`:''} value="${esc(t[k]||'')}" placeholder="${esc(ph||'')}"></div>`;
  return `<div class="grid bkterms">
    ${inp('price','Price per day','3000','decimal')}
    <div class="f"><label for="${p}currency">Currency</label><select id="${p}currency" data-t="currency">${['ILS','USD','EUR'].map(c=>`<option value="${c}"${(t.currency||'ILS')===c?' selected':''}>${c}</option>`).join('')}</select></div>
    <div class="f wide"><span class="lab">VAT</span>${seg('vat',[['including_vat','Including VAT'],['plus_vat','Plus VAT'],['not_applicable','No VAT (tourists)']])}</div>
    ${inp('hours_incl','Hours included in a day','10','decimal')}
    ${inp('km_incl','Km included in a day','250','numeric')}
    <div class="f wide"><span class="lab">Hours counted from</span>${seg('hours_from',[['pickup','The pick-up'],['depot','Leaving the depot']])}</div>
    ${inp('overtime','Extra hour','200','decimal')}
    ${inp('extra_km','Extra km','5','decimal')}
    <div class="f wide"><span class="lab">Kvish 6 and tolls</span>${seg('tolls',[['incl','Included'],['extra','Extra']])}<input data-t="tolls_note" aria-label="Kvish 6 note" value="${esc(t.tolls_note||'')}" placeholder="Note, e.g. by the bill"></div>
    <div class="f wide"><span class="lab">Parking</span>${seg('parking',[['incl','Included'],['extra','Extra, by receipt']])}</div>
    <div class="f wide"><span class="lab">Driver tip</span>${seg('tip',[['none','Not expected'],['customary','Customary']])}<input data-t="tip_amt" inputmode="decimal" aria-label="Customary tip a day" value="${esc(t.tip_amt||'')}" placeholder="Customary amount a day"></div>
    <div class="f wide"><label for="${p}cancel">Cancellation policy</label><textarea id="${p}cancel" data-t="cancel" rows="3" maxlength="1500" placeholder="Paste the company's cancellation policy, e.g. free until 48 hours before, then 50%">${esc(t.cancel||'')}</textarea></div>
    <div class="f wide"><label for="${p}extras">Other extras: driver overnight, night, Shabbat</label><input id="${p}extras" data-t="extras" value="${esc(t.extras||'')}" placeholder="Driver overnight ₪350"></div>
    <div class="f wide"><label for="${p}payment">Payment: how and when</label><input id="${p}payment" data-t="payment" value="${esc(t.payment||'')}" placeholder="Bank transfer after the trip"></div>
    <div class="f wide"><label for="${p}note">Anything else</label><textarea id="${p}note" data-t="note" rows="2" placeholder="Free text">${esc(t.note||'')}</textarea></div>
  </div>`; }
function bkWireTerms(root){ root.querySelectorAll('.seg .tg').forEach(b=>b.onclick=()=>{ const on=b.getAttribute('aria-pressed')==='true'; b.parentNode.querySelectorAll('.tg').forEach(x=>x.setAttribute('aria-pressed','false')); b.setAttribute('aria-pressed',String(!on)); }); }
function bkReadTerms(root){ const t={};
  root.querySelectorAll('[data-t]').forEach(i=>{ let val=i.value.trim(); if(BK_NUM.includes(i.dataset.t)) val=val.replace(/[,₪$€\s]/g,''); if(val) t[i.dataset.t]=val; });
  root.querySelectorAll('[data-seg]').forEach(s=>{ const on=s.querySelector('.tg[aria-pressed="true"]'); if(on) t[s.dataset.seg]=on.dataset.val; });
  if(Object.keys(t).length===1&&t.currency) return {};
  return t; }
function bkBadTerms(t){ const bad=BK_NUM.find(k=>t[k]&&!(k==='km_incl'?/^\d{1,4}$/:k==='hours_incl'?/^\d{1,2}(\.\d)?$/:/^\d{1,7}(\.\d{1,2})?$/).test(t[k]));
  return bad?'Check the numbers: '+({price:'price',hours_incl:'hours included',km_incl:'km included',overtime:'extra hour',extra_km:'extra km',tip_amt:'tip'})[bad]+' must be a plain number.':''; }
// Terms a quote already holds, so the sheet can start from them.
function bkFromQuote(q,o){ const t={}, f=o.fees||{}, base=(o.lines||[]).find(l=>l.kind==='Base'&&/per day/.test(l.unit)&&l.price!=='');
  if(base) t.price=String(base.price); if(q.currency) t.currency=q.currency; if(q.vat) t.vat=q.vat;
  if(o.hours_incl) t.hours_incl=o.hours_incl; if(o.km_incl) t.km_incl=o.km_incl;
  if(f.overtime&&f.overtime.s==='extra'&&f.overtime.amt) t.overtime=f.overtime.amt; if(f.extra_km&&f.extra_km.s==='extra'&&f.extra_km.amt) t.extra_km=f.extra_km.amt;
  if(f.tolls){ t.tolls=f.tolls.s; if(f.tolls.note) t.tolls_note=f.tolls.note; } if(f.parking) t.parking=f.parking.s;
  return t; }
function openBookingForm(v, b0, back){
  const isNew=!b0;
  const b=JSON.parse(JSON.stringify(b0||{client_ref:'',booker_name:(S.me&&S.me.name)||'',booker_phone:(S.me&&S.me.phone)||'',date_from:'',date_to:'',pax:'',service:'',seats:'',tourists:true,pickup_time:'',pickup_place:'',route:'',dropoff_time:'',dropoff_place:'',note:'',private_note:'',proposed:{},shared:!v.prices_private}));
  const fleet=[...fleetOf(v)]; if(isNew&&fleet.length===1) b.service=fleet[0];
  const opt=(arr,val)=>arr.map(([k,t])=>`<option value="${esc(k)}"${String(val)===k?' selected':''}>${esc(t)}</option>`).join('');
  const places=[...new Set([...(S.bookings||[]).flatMap(x=>[x.pickup_place,x.dropoff_place]),...TOWNS].filter(Boolean))];
  const body=`<form id="bf" novalidate>
    <div id="bkFill"></div>
    <fieldset><legend>The job</legend><div class="grid">
      <div class="f"><label for="b_from">Date <em>*</em></label><input id="b_from" type="date" value="${esc(b.date_from)}"></div>
      <div class="f"><label for="b_to">Until (more than one day)</label><input id="b_to" type="date" value="${esc(b.date_to)}"></div>
      <div class="f"><label for="b_pax">Passengers</label><input id="b_pax" inputmode="numeric" value="${esc(b.pax)}" placeholder="24"></div>
      <div class="f"><label for="b_seats">Seats needed</label><input id="b_seats" inputmode="numeric" value="${esc(b.seats)}" placeholder="30"></div>
      <div class="f wide"><label for="b_svc">Vehicle <em>*</em></label><select id="b_svc">${opt([['','Choose…'],...BK_SERVICES],b.service)}</select></div>
      <div class="f"><label for="b_ptime">Pick-up time</label><input id="b_ptime" type="time" value="${esc(b.pickup_time)}"></div>
      <div class="f"><label for="b_pplace">Pick-up place</label><input id="b_pplace" list="bkPlaces" value="${esc(b.pickup_place)}" placeholder="Hotel, Jerusalem"></div>
      <div class="f wide"><label for="b_route">Outline of the day</label><textarea id="b_route" rows="3" placeholder="Caesarea, Zichron Yaakov, back to Jerusalem">${esc(b.route)}</textarea></div>
      <div class="f"><label for="b_dtime">Drop-off time, about</label><input id="b_dtime" type="time" value="${esc(b.dropoff_time)}"></div>
      <div class="f"><label for="b_dplace">Drop-off place</label><input id="b_dplace" list="bkPlaces" value="${esc(b.dropoff_place)}" placeholder="Same as pick-up"></div>
      <div class="f wide"><label for="b_note">Notes for the company</label><textarea id="b_note" rows="2" placeholder="Free text: strong air conditioning, luggage, child seats…">${esc(b.note)}</textarea></div>
    </div><datalist id="bkPlaces">${places.map(p=>`<option value="${esc(p)}">`).join('')}</datalist>
    <label class="switch" for="b_tour" style="margin-top:10px"><input id="b_tour" type="checkbox" ${b.tourists?'checked':''}><span><b>Tourists from abroad</b><br><span class="hint">Tells the company which rate and VAT apply.</span></span></label></fieldset>
    <fieldset><legend>Booked by</legend><div class="grid">
      <div class="f"><label for="b_name">Your name <em>*</em></label><input id="b_name" value="${esc(b.booker_name)}" autocomplete="name"></div>
      <div class="f"><label for="b_phone">Your phone <em>*</em></label><input id="b_phone" type="tel" value="${esc(b.booker_phone)}" placeholder="050-000-0000" autocomplete="tel"></div>
    </div><p class="hint" style="margin:6px 0 0">The company sees these, so it knows who is asking and can answer you on WhatsApp.</p></fieldset>
    <details class="bkexp" id="bkExp"${Object.keys(b.proposed||{}).length?' open':''}><summary>Terms you expect <span class="hint">optional · the company sees them filled in and confirms or changes them</span></summary>
      <p class="hint" id="bkExpNote" style="margin:8px 0"></p>${bkTermsForm(b.proposed,'bp_')}</details>
    <fieldset><legend>Only for you</legend><div class="grid">
      <div class="f wide"><label for="b_ref">For which trip or client? (private)</label><input id="b_ref" value="${esc(b.client_ref)}" placeholder="Jacobs family, Oct 2026"></div>
      <div class="f wide"><label for="b_priv">Private note</label><textarea id="b_priv" rows="2" placeholder="Only you${S.admin?'':' and Eretz Israel Tours'} can see this">${esc(b.private_note)}</textarea></div>
    </div>
    <label class="switch" for="b_shared" style="margin-top:10px"><input id="b_shared" type="checkbox" ${b.shared&&!v.prices_private?'checked':''} ${v.prices_private?'disabled':''}><span><b>Share the confirmed price and terms with colleagues, without ${S.admin?'the name':'your name'}</b><br><span class="hint">${v.prices_private?'This supplier\'s prices are kept private, so nothing is shared.':'Once you confirm, it shows in the Quotes tab like any quote: supplier, dates, price and extras. Never the client, the notes or who booked.'}</span></span></label></fieldset>
    <div id="bErr"></div></form>`;
  const w=sheet(isNew?'New booking sheet · '+v.name:'Edit booking sheet', body, `<button class="btn soft" id="bc" type="button">Cancel</button><button class="btn primary" id="bs" type="button">${isNew?'Save and send':'Save'}</button>`);
  const g=id=>w.querySelector('#'+id), exp=g('bkExp');
  bkWireTerms(exp);
  const setTerms=(t,from)=>{ exp.querySelector('.bkterms').outerHTML=bkTermsForm(t,'bp_'); bkWireTerms(exp); exp.open=true; g('bkExpNote').textContent=from?'Filled in from '+from+'. Change what is different.':''; };

  // Autofill: earlier sheets with this company, and its quotes.
  (async()=>{ const box=g('bkFill'); if(!box) return; let mine=[], quotes=[];
    try{ mine=(await DB.loadBookings(''))||[]; }catch(e){} try{ quotes=(await DB.loadQuotes(v.id))||[]; }catch(e){}
    if(!document.body.contains(box)) return;
    const here=mine.filter(x=>x.vendor_id===v.id&&(!b0||x.id!==b0.id)), last=mine.find(x=>!b0||x.id!==b0.id);

    qopts.forEach(({q,o})=>srcs.push({label:'Quote · '+(fmtRange(q).split(' · ')[0]||'no dates')+' · '+(o.name||svcLabel(o.service)),from:'the quote for '+(fmtRange(q).split(' · ')[0]||o.name),quote:{q,o},terms:bkFromQuote(q,o)}));

    if(isNew&&last&&!g('b_phone').value&&last.booker_phone) g('b_phone').value=last.booker_phone;
    if(!srcs.length) return;
    box.innerHTML=`<div class="bkfill"><b>⚡ Fill in from</b><div class="presets" style="margin:6px 0 0">${srcs.map((s,i)=>`<button class="mini" type="button" data-src="${i}">${esc(s.label)}</button>`).join('')}</div></div>`;
    const apply=(s,quiet)=>{
      if(s.job){ const j=s.job; const put=(id,val)=>{ if(val&&!g(id).value) g(id).value=val; };
        put('b_ptime',j.pickup_time); put('b_pplace',j.pickup_place); put('b_dtime',j.dropoff_time); put('b_dplace',j.dropoff_place);
        if(!s.placesOnly){ put('b_pax',j.pax); put('b_seats',j.seats); if(!g('b_svc').value&&j.service) g('b_svc').value=j.service; put('b_note',j.note); } }
      if(s.quote){ const {q,o}=s.quote; if(!g('b_pax').value&&q.pax) g('b_pax').value=q.pax; if(!g('b_seats').value&&o.seats) g('b_seats').value=o.seats;
        if(!g('b_svc').value&&VEH[o.service]) g('b_svc').value=o.service; if(!g('b_from').value&&q.date_from&&q.date_from>=today()){ g('b_from').value=q.date_from; g('b_to').value=q.date_to&&q.date_to!==q.date_from?q.date_to:''; }
        if(!g('b_ref').value&&q.title) g('b_ref').value=q.title; }
      if(s.terms&&Object.keys(s.terms).length) setTerms(s.terms,s.from);
      if(!quiet) toast('Filled in. Check it and change what is different.'); };
    box.querySelectorAll('[data-src]').forEach(el=>el.onclick=()=>apply(srcs[+el.dataset.src]));
    // A new sheet starts with what this company agreed to last time (or its latest quote), so there is less to type.

  })();
  const done=()=>{ S.bookings=null; };
  g('bc').onclick=()=>{ if(b0) openBookingView(b0); else if(back==='quotes') closeSheet(); else openDetail(v.id); };
