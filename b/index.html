<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>דף הזמנת רכב · Vehicle booking sheet</title>
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="מחיר ותנאים להזמנת אוטובוס או ואן · Price and terms for a bus or van booking">
<meta property="og:title" content="דף הזמנת רכב · Vehicle booking sheet">
<meta property="og:description" content="נא למלא מחיר ותנאים להזמנה · Please fill in the price and terms for this booking">
<meta name="theme-color" content="#1d4fa3">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Hebrew:wght@400;500;600;700&display=swap">
<style>
/* The company's side of a booking sheet. This page knows one booking (the key in its link) and nothing else. */
:root{--ink:#16181d;--ink-2:#4a4f57;--line:#d0d4da;--edge:#8a909a;--ground:#f2f3f5;--card:#fff;--blue:#1d4fa3;--blue-wash:#e9eef7;--warn-wash:#fbefd9;--ok:#1f6b3f;--ok-wash:#e3f1e7;--bad:#a63b2e;--bad-wash:#f8e3df}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--ground);color:var(--ink);font-family:"IBM Plex Sans Hebrew","Rubik",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;font-size:16px;line-height:1.4}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
.wrap{max-width:560px;margin:0 auto;padding:0 0 calc(40px + env(safe-area-inset-bottom,0px))}
.top{background:var(--card);border-bottom:1px solid var(--line);padding:20px 16px 16px}
.top h1{margin:0;font-size:22px;line-height:1.2}
.en{display:block;direction:ltr;text-align:right;font-size:13px;color:var(--ink-2);font-weight:400}
.top p{margin:10px 0 0;font-size:15px}
.sec{margin:16px 16px 0}
.sec h2{margin:0;font-size:18px;line-height:1.3}
.fields{display:flex;flex-direction:column;gap:16px;margin-top:14px}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.three{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
label,.lab{display:block;font-size:15px;font-weight:600;line-height:1.25;margin-bottom:6px}
label .en,.lab .en{margin-top:1px}
input[type=text],input[type=tel],select,textarea{width:100%;min-height:46px;border:1px solid var(--edge);border-radius:8px;padding:10px 12px;font-size:16px;background:var(--card)}
textarea{min-height:84px;resize:vertical}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
fieldset{border:0;padding:0;margin:0;min-width:0}
legend{padding:0}
.seg button{min-height:56px;border-radius:8px;border:1px solid var(--edge);background:var(--card);padding:6px 6px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:15px;font-weight:500;line-height:1.2}
.seg button small{direction:ltr;font-size:12px;font-weight:400}
.seg button[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:#fff}
.sub{margin-top:8px}
.price{display:grid;grid-template-columns:minmax(0,1fr) 92px;gap:8px}
.note{background:var(--blue-wash);border-radius:8px;padding:10px 12px;font-size:14px}
.stmt{margin:20px 16px 0;background:var(--card);border:2px solid var(--ink);border-radius:8px;padding:12px 14px;font-weight:700}
.big{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;width:100%;min-height:56px;border:0;border-radius:8px;background:var(--blue);color:#fff;font-size:16px;font-weight:600;text-decoration:none;padding:8px 10px;text-align:center}
.big small{direction:ltr;font-size:12px;font-weight:400}
.big.soft{background:var(--card);color:var(--ink);border:1px solid var(--edge)}
.big:disabled{opacity:.55}
.acts{margin:16px 16px 0;display:flex;flex-direction:column;gap:10px}
.ban{margin:16px 16px 0;border-radius:8px;padding:12px 14px;font-weight:600}
.ban.ok{background:var(--ok-wash);color:var(--ok)}
.ban.warn{background:var(--warn-wash)}
.ban p .en{font-weight:400}
.ban.bad{background:var(--bad-wash);color:var(--bad)}
.ban .en{color:inherit;opacity:.85}
.err{margin:12px 16px 0;background:var(--bad-wash);color:var(--bad);border-radius:8px;padding:10px 12px;font-size:15px}
.sheetbox{margin:16px 16px 0}
@media screen{.sheetbox .bks-h{display:none}}
.foot{margin:24px 16px 0;font-size:12.5px;color:var(--ink-2);text-align:center}
@media print{
  body{background:#fff}
  .wrap>*:not(.sheetbox){display:none!important}
  .sheetbox{margin:0}.bks{border:0!important}
  @page{margin:14mm}
}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="sec"><p>טוען… <span class="en">Loading…</span></p></div></div>
<script>
(function(){

const LIVE = /(^|\.)github\.io$/.test(location.hostname) || /(^|\.)eretzisraeltours\.com$/.test(location.hostname);

const BK_VEH={bus:['אוטובוס','Bus'],midibus:['מידיבוס','Midibus'],van20:['מיניבוס 17–20 מקומות','Van, 17–20 seats'],van16:['מיניבוס 11–16 מקומות','Van, 11–16 seats'],van10:['ואן 9–10 מקומות','Van, 9–10 seats'],van8:['ואן עד 8 מקומות','Van, up to 8 seats'],car:['רכב פרטי','Car'],jeep_vehicle:['ג׳יפ / 4x4','Jeep / 4x4'],transfer:['העברה','Transfer']};

const bkMoney=(t,x)=>(BK_SIGN[(t&&t.currency)||'ILS']||'₪')+Number(x).toLocaleString('en-US');
function bkDate(iso,he){ if(!iso) return ''; const d=new Date(iso+'T12:00:00'); if(isNaN(d)) return iso;
  try{ return he ? d.toLocaleDateString('he-IL',{weekday:'short',day:'numeric',month:'numeric',year:'numeric'}) : d.toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short',year:'numeric'}); }catch(e){ return iso; } }
const bkRange=(b,he)=> b.date_to&&b.date_to!==b.date_from ? bkDate(b.date_from,he)+' – '+bkDate(b.date_to,he) : bkDate(b.date_from,he);

const bkPicked=b=>[...new Set(String((b&&b.days)||'').split(',').filter(x=>/^\d{4}-\d{2}-\d{2}$/.test(x)))].sort();
function bkSpan(from,to,max){ const out=[]; if(!/^\d{4}-\d{2}-\d{2}$/.test(from||'')) return out; const d=new Date(from+'T12:00:00'), end=/^\d{4}-\d{2}-\d{2}$/.test(to||'')&&to>from?to:from;
  for(let i=0;i<(max||400);i++){ const iso=bkIso(d); if(iso>end) break; out.push(iso); d.setDate(d.getDate()+1); } return out; }
function bkDayCount(b){ const p=bkPicked(b); if(p.length) return p.length; if(!b||!b.date_from) return 0; if(!b.date_to||b.date_to<=b.date_from) return 1;
  const n=Math.round((new Date(b.date_to+'T12:00:00')-new Date(b.date_from+'T12:00:00'))/86400000)+1; return n>0?n:1; }
const BK_WD_HE=['א׳','ב׳','ג׳','ד׳','ה׳','ו׳','ש׳'];
// "5 ימים: ד׳ 18.11, ה׳ 19.11, א׳ 22.11.2026" · "5 days: Wed 18 Nov, Thu 19 Nov, Sun 22 Nov 2026"
function bkDayList(days,he){ if(!days.length) return ''; const ds=days.map(x=>new Date(x+'T12:00:00')), oneYear=ds.every(d=>d.getFullYear()===ds[0].getFullYear());
  const one=(d,i)=>{ const yr=!oneYear||i===ds.length-1;
    if(he) return BK_WD_HE[d.getDay()]+' '+d.getDate()+'.'+(d.getMonth()+1)+(yr?'.'+d.getFullYear():'');
    let s; try{ s=d.toLocaleDateString('en-GB',{weekday:'short'})+' '+d.getDate()+' '+d.toLocaleDateString('en-GB',{month:'short'}); }catch(e){ s=days[i]; } return s+(yr?' '+d.getFullYear():''); };
  return (he?days.length+' ימים: ':days.length+' days: ')+ds.map(one).join(', '); }
// The date line of a booking sheet: the chosen days, or the period with its number of days.
function bkDates(b,he){ const p=bkPicked(b); if(p.length>1) return bkDayList(p,he); if(p.length===1) return bkDate(p[0],he);
  const r=bkRange(b,he), n=bkDayCount(b); return r&&n>1 ? r+' · '+n+(he?' ימים':' days') : r; }
// Each day's own times (D-24). b.day_plan = {'2026-10-20':{start:'08:30',end:'18:00',route:'Dead Sea'}, …}: only on a booking
// of more than one day, and only when the days differ. Empty = the pick-up and drop-off times of the sheet apply to every day.
// A finish time is always shown as an estimate.
const bkPlan=b=>{ const p=b&&b.day_plan; return p&&typeof p==='object'&&!Array.isArray(p)?p:{}; };
const bkHasPlan=b=>Object.keys(bkPlan(b)).length>0;
const bkAllDays=b=>{ const p=bkPicked(b); return p.length?p:bkSpan(b.date_from,b.date_to,62); };
function bkDayLabel(iso,he){ const d=new Date(iso+'T12:00:00'); if(isNaN(d)) return iso; if(he) return BK_WD_HE[d.getDay()]+' '+d.getDate()+'.'+(d.getMonth()+1);
  try{ return d.toLocaleDateString('en-GB',{weekday:'short'})+' '+d.getDate()+' '+d.toLocaleDateString('en-GB',{month:'short'}); }catch(e){ return iso; } }
function bkDayLine(x,he){ x=x||{}; const a=[];
  if(x.start) a.push(he?'איסוף '+x.start:'pick-up '+x.start);
  if(x.end) a.push(he?'סיום משוער '+x.end:'finish about '+x.end); else if(x.start) a.push(he?'שעת סיום תימסר':'finish time to follow');
  if(x.route) a.push(x.route);
  return a.length?a.join(' · '):(he?'שעות יימסרו':'times to follow'); }
const bkDayRows=b=>{ if(!bkHasPlan(b)) return []; const p=bkPlan(b); return bkAllDays(b).map(d=>[bkDayLabel(d,true),bkDayLabel(d,false),bkDayLine(p[d],true),bkDayLine(p[d],false)]); };
function bkVehicle(b,he){ const v=BK_VEH[b.service];
  if(!v) return b.seats?(he?b.seats+' מקומות':b.seats+' seats'):'';
  if(b.seats&&/^(bus|midibus|van)/.test(b.service)){
    const base = he ? ({bus:'אוטובוס',midibus:'מידיבוס'}[b.service]||(+b.seats>10?'מיניבוס':'ואן')) : ({bus:'bus',midibus:'midibus'}[b.service]||'van');
    return he ? base+' '+b.seats+' מקומות' : b.seats+'-seat '+base; }
  return v[he?0:1]; }
// Rows are [Hebrew label, English label, Hebrew value, English value]. English value null = the same typed text.
function bkJobRows(b,all){ return [
  ['תאריך','Date',bkDates(b,true),bkDates(b,false)],
  ...bkDayRows(b),
  ['נוסעים','Passengers',b.pax?b.pax+(b.tourists?' · תיירים מחו״ל':''):(b.tourists?'תיירים מחו״ל':''),b.pax?b.pax+(b.tourists?' · tourists from abroad':''):(b.tourists?'tourists from abroad':'')],
  ['רכב','Vehicle',bkVehicle(b,true),bkVehicle(b,false)],
  ['איסוף','Pick-up',[b.pickup_time,b.pickup_place].filter(Boolean).join(', '),null],
  ['מסלול היום','Outline of the day',b.route||'',null],
  ['פיזור','Drop-off',[b.dropoff_time,b.dropoff_place].filter(Boolean).join(', '),null],
  ['הערות המזמין','Notes from the guide',b.note||'',null]].filter(r=>all||r[2]); }
function bkTermRows(t){ t=t||{}; const m=x=>bkMoney(t,x), vat=BK_VAT[t.vat];
  const inc=[[t.hours_incl,'עד '+t.hours_incl+' שעות','up to '+t.hours_incl+' hours'],[t.km_incl,'עד '+t.km_incl+' ק״מ','up to '+t.km_incl+' km']].filter(x=>x[0]);
  const ie=(k,note)=>BK_IE[t[k]]?[BK_IE[t[k]][0]+(note?' · '+note:''),BK_IE[t[k]][1]+(note?' · '+note:'')]:['',''];
  const tip=t.tip==='none'?['לא מצופה','not expected']:t.tip==='customary'?['מקובל'+(t.tip_amt?' '+m(t.tip_amt)+' ליום':''),'customary'+(t.tip_amt?', '+m(t.tip_amt)+' a day':'')]:['',''];
  return [
    ['מחיר ליום','Price per day',t.price?m(t.price)+(vat?' · '+vat[0]:''):'',t.price?m(t.price)+(vat?' · '+vat[1]:''):''],
    ['המחיר כולל','Price includes',inc.map(x=>x[1]).join(' · '),inc.map(x=>x[2]).join(' · ')],
    ['השעות נספרות מ־','Hours counted from',({pickup:'נקודת האיסוף',depot:'היציאה מהחניון'})[t.hours_from]||'',({pickup:'the pick-up',depot:'leaving the depot'})[t.hours_from]||''],
    ['שעה נוספת','Extra hour',t.overtime?m(t.overtime):'',t.overtime?m(t.overtime):''],
    ['ק״מ נוסף','Extra km',t.extra_km?m(t.extra_km):'',t.extra_km?m(t.extra_km):''],
    ['כביש 6 ואגרות','Highway 6 and tolls',...ie('tolls',t.tolls_note)],
    ['חניה','Parking',...ie('parking')],
    ['טיפ לנהג','Driver tip',...tip],
    ['מדיניות ביטול','Cancellation policy',t.cancel||'',null],
    ['תוספות אחרות','Other extras',t.extras||'',null],
    ['תשלום','Payment',t.payment||'',null],
    ['הערות החברה','Notes from the company',t.note||'',null]]; }
// What a price without these still leaves open: where surprise charges come from.
function bkMissing(t){ t=t||{}; const out=[];
  if(!t.vat) out.push(['מע״מ','VAT']); if(!t.hours_incl) out.push(['שעות ביום','hours in a day']); if(!t.km_incl) out.push(['ק״מ כלולים','km included']);
  if(!t.overtime) out.push(['שעה נוספת','extra hour']); if(!t.extra_km&&t.km_incl) out.push(['ק״מ נוסף','extra km']); if(!t.tolls) out.push(['כביש 6','Highway 6']); if(!t.tip) out.push(['טיפ','tip']); if(!t.cancel) out.push(['מדיניות ביטול','cancellation policy']);
  return out; }
const BK_MUST=9; // the first rows of bkTermRows always show, "not stated" when empty
const bkWhen=iso=>{ try{ const d=new Date(iso); return d.getDate()+'.'+(d.getMonth()+1)+'.'+d.getFullYear(); }catch(e){ return ''; } };
// Who has accepted this version. [Hebrew label, English label, Hebrew value, English value, accepted?]
function bkOkRows(b){
  if(b.guide_ok_at===undefined&&b.company_ok_at===undefined) return null; // database without the acceptance step
  const g=b.guide_ok_at?bkWhen(b.guide_ok_at):'', c=b.company_ok_at?bkWhen(b.company_ok_at):'', by=b.answered_by||'', via=b.company_ok_via==='guide';
  return [['אישור המזמין','Accepted by the guide',g?'✓ '+g:'ממתין לאישור',g?'✓ '+g:'waiting',!!g],
    ['אישור החברה','Accepted by the company',c?'✓ '+(via?c+' · נמסר למזמין'+(by?' ('+by+')':''):[by,c].filter(Boolean).join(' · ')):'ממתין לאישור',
      c?'✓ '+(via?c+' · told to the guide'+(by?' ('+by+')':''):[by,c].filter(Boolean).join(' · ')):'waiting',!!c]]; }
// o.seen = the version this reader last sent or accepted: rows the other side changed since are marked red, with the
// earlier value. o.loose = compare only rows the earlier version had filled in (the guide's "terms you expect").
function bkSheetHtml(b,t,o){ o=o||{}; const has=!!(t&&t.price), comp=b.company||b.vendor_name||'', seen=o.seen||null;
  const oldJob=seen&&('date_from' in seen)?Object.fromEntries(bkJobRows(seen,true).map(r=>[r[1],r[2]])):null;
  const st=seen&&seen.terms, oldTerm=st&&Object.keys(st).length?Object.fromEntries(bkTermRows(st).map(r=>[r[1],r[2]])):null;
  const was=(old,r)=>{ if(!old) return null; const prev=old[r[1]]||''; if(prev===(r[2]||'')) return null; if(o.loose&&!prev) return null; return prev||'—'; };
  const nd=bkDayCount(b), perDay=r=>r[1]==='Price per day'&&r[2]&&nd>1?`<small class="xd" dir="rtl">× ${nd} ימים</small><small class="xd" dir="ltr">× ${nd} days</small>`:'';
  const row=(r,old,cls)=>{ const w=was(old,r);
    return `<div class="bks-r${r[2]?'':' ns'}${w!=null?' chg':''}${cls||''}"><dt>${esc(r[0])}<small dir="ltr">${esc(r[1])}</small></dt><dd dir="auto">${r[2]?esc(r[2]):'לא צוין'}${r[2]?(r[3]&&r[3]!==r[2]?`<small dir="ltr">${esc(r[3])}</small>`:''):'<small dir="ltr">not stated</small>'}${perDay(r)}${w!=null?`<small class="was" dir="auto">קודם · was: ${esc(w)}</small>`:''}</dd></div>`; };
  const jobs=bkJobRows(b,true).filter(r=>r[2]||was(oldJob,r)!=null);
  const terms=has?bkTermRows(t).filter((r,i)=>r[2]||i<BK_MUST||was(oldTerm,r)!=null):[];
  const ok=has?bkOkRows(b):null;
  const who=[['מזמין','Booked by',[b.booker_name,b.booker_phone].filter(Boolean).join(' · ')],['חברה','Company',comp],
    has&&!ok?[b.terms_by==='guide'?'נרשם ע״י המזמין':'מולא ע״י','Filled in by',b.terms_by==='guide'?'לפי תשובת החברה'+(b.answered_by?' ('+b.answered_by+')':''):[b.answered_by,b.answered_at?bkWhen(b.answered_at):''].filter(Boolean).join(' · '),b.terms_by==='guide'?'entered by the guide from the company\'s answer':null]:null,
    has&&!ok&&b.status==='confirmed'?['אושר','Confirmed',b.confirmed_at?bkWhen(b.confirmed_at):'✓',null]:null].filter(r=>r&&r[2]);
  return `<div class="bks" dir="rtl" lang="he">
    <div class="bks-h"><b>דף הזמנת רכב</b><span dir="ltr">Vehicle booking sheet</span></div>
    <dl>${who.map(r=>row(r)).join('')}${ok?ok.map(r=>row(r,null,r[4]?' okd':' ns')).join(''):''}</dl>
    <div class="bks-sec">ההזמנה<small dir="ltr">The job</small></div>
    <dl>${jobs.map(r=>row(r,oldJob)).join('')}</dl>
    ${has?`<div class="bks-sec">מחיר ותנאים<small dir="ltr">Price and terms</small></div><dl>${terms.map(r=>row(r,oldTerm)).join('')}</dl>
    <div class="bks-stmt">${esc(BK_STMT[0])}<small dir="ltr">${esc(BK_STMT[1])}</small></div>`:''}</div>`; }
// How many rows the other side changed (same rule as the red rows above).
function bkChanged(b,t,seen,loose){ if(!seen) return 0; let n=0;
  if('date_from' in seen){ const o=Object.fromEntries(bkJobRows(seen,true).map(r=>[r[1],r[2]])); bkJobRows(b,true).forEach(r=>{ if((o[r[1]]||'')!==(r[2]||'')) n++; }); }
  const st=seen.terms; if(st&&Object.keys(st).length&&t){ const o=Object.fromEntries(bkTermRows(st).map(r=>[r[1],r[2]])); bkTermRows(t).forEach(r=>{ const p=o[r[1]]||''; if(p!==(r[2]||'')&&!(loose&&!p)) n++; }); }
  return n; }
// Plain text for WhatsApp or email. ask = short note with the link; template = no link, blanks to fill in; summary = the filled sheet.
function bkText(b,t,mode,link){ const L=[], comp=b.company||b.vendor_name||'';
  const two=r=>{ if(r[3]==null||r[3]===r[2]) L.push(r[0]+' · '+r[1]+': '+r[2]); else { L.push(r[0]+': '+r[2]); L.push(r[1]+': '+r[3]); } };

    if(!(B.terms&&B.terms.cancel)&&!noPolicyOk) return noCancelWarn(()=>accept(true), toForm, ['אישור בלי מדיניות ביטול','Accept without a cancellation policy']);
    btn.disabled=true; err.innerHTML='';
    try{ B=await api('booking_accept',{p_key:KEY,p_name:B.answered_by||''}); draw(true); window.scrollTo(0,0); }
    catch(e){ btn.disabled=false; err.innerHTML=`<div class="err">${esc(e.message)}</div>`; } };
  app.querySelector('#accept').onclick=()=>accept(false);
  app.querySelector('#change').onclick=toForm;
}
function draw(justSent){
  if(B.status==='cancelled'){ app.innerHTML=`${header()}<div class="ban bad">${two('ההזמנה בוטלה.','This booking was cancelled.')}</div>${jobCard(false)}`; return; }
  const answered=!!(B.terms&&B.terms.price);
  if(B.status==='confirmed') return doneView(justSent);
  if(editing||!answered) return formView();
  if(B.status==='answered') return doneView(justSent);
  reviewView();
}
(async()=>{
  if(!KEY&&!DEMO){ app.innerHTML=`<div class="top"><h1>דף הזמנת רכב<span class="en">Vehicle booking sheet</span></h1></div><div class="ban bad">${two('הקישור אינו שלם. בקשו מהמזמין לשלוח אותו שוב.','This link is incomplete. Ask the person who sent it to send it again.')}</div>`; return; }
  try{ B=await api('booking_open',{p_key:KEY}); draw(); }
  catch(e){ const dead=e.code==='28000'||/not active/i.test(e.message);
    app.innerHTML=`<div class="top"><h1>דף הזמנת רכב<span class="en">Vehicle booking sheet</span></h1></div><div class="ban bad">${dead?two('הקישור אינו פעיל. בקשו מהמזמין קישור חדש.','This link is not active. Ask the person who sent it for a new one.'):esc(e.message)}</div>
      ${dead?'':'<div class="acts"><button class="big soft" id="retry" type="button">נסו שוב<small>Try again</small></button></div>'}`;
    const r=app.querySelector('#retry'); if(r) r.onclick=()=>location.reload(); }
})();
})();
</script>
