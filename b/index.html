<style>
/* The company's side of a booking sheet. This page knows one booking (the key in its link) and nothing else. */
:root{--ink:#16181d;--ink-2:#4a4f57;--line:#d0d4da;--edge:#8a909a;--ground:#f2f3f5;--card:#fff;--blue:#1d4fa3;--blue-wash:#e9eef7;--warn-wash:#fbefd9;--ok:#1f6b3f;--ok-wash:#e3f1e7;--bad:#a63b2e;--bad-wash:#f8e3df}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--ground);color:var(--ink);font-family:"IBM Plex Sans Hebrew","Rubik",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;font-size:16px;line-height:1.4}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
.wrap{max-width:560px;margin:0 auto;padding:0 0 calc(40px + env(safe-area-inset-bottom,0px))}
.top{background:var(--card);border-bottom:1px solid var(--line);padding:20px 16px 16px}
.top h1{margin:0;font-size:22px;line-height:1.2}
.en{display:block;direction:ltr;text-align:right;font-size:13px;color:var(--ink-2);font-weight:400}
.top p{margin:10px 0 0;font-size:15px}
.sec{margin:16px 16px 0}
.sec h2{margin:0;font-size:18px;line-height:1.3}
.fields{display:flex;flex-direction:column;gap:16px;margin-top:14px}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.three{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
label,.lab{display:block;font-size:15px;font-weight:600;line-height:1.25;margin-bottom:6px}
label .en,.lab .en{margin-top:1px}
input[type=text],input[type=tel],select,textarea{width:100%;min-height:46px;border:1px solid var(--edge);border-radius:8px;padding:10px 12px;font-size:16px;background:var(--card)}
textarea{min-height:84px;resize:vertical}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
fieldset{border:0;padding:0;margin:0;min-width:0}
legend{padding:0}
.seg button{min-height:56px;border-radius:8px;border:1px solid var(--edge);background:var(--card);padding:6px 6px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:15px;font-weight:500;line-height:1.2}
.seg button small{direction:ltr;font-size:12px;font-weight:400}
.seg button[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:#fff}
.sub{margin-top:8px}
.price{display:grid;grid-template-columns:minmax(0,1fr) 92px;gap:8px}
.note{background:var(--blue-wash);border-radius:8px;padding:10px 12px;font-size:14px}
.stmt{margin:20px 16px 0;background:var(--card);border:2px solid var(--ink);border-radius:8px;padding:12px 14px;font-weight:700}
.big{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;width:100%;min-height:56px;border:0;border-radius:8px;background:var(--blue);color:#fff;font-size:16px;font-weight:600;text-decoration:none;padding:8px 10px;text-align:center}
.big small{direction:ltr;font-size:12px;font-weight:400}
.big.soft{background:var(--card);color:var(--ink);border:1px solid var(--edge)}
.big:disabled{opacity:.55}
.acts{margin:16px 16px 0;display:flex;flex-direction:column;gap:10px}
.ban{margin:16px 16px 0;border-radius:8px;padding:12px 14px;font-weight:600}
.ban.ok{background:var(--ok-wash);color:var(--ok)}
.ban.warn{background:var(--warn-wash)}
.ban.bad{background:var(--bad-wash);color:var(--bad)}
.ban .en{color:inherit;opacity:.85}
.err{margin:12px 16px 0;background:var(--bad-wash);color:var(--bad);border-radius:8px;padding:10px 12px;font-size:15px}
.sheetbox{margin:16px 16px 0}
@media screen{.sheetbox .bks-h{display:none}}
.foot{margin:24px 16px 0;font-size:12.5px;color:var(--ink-2);text-align:center}
@media print{
  body{background:#fff}
  .wrap>*:not(.sheetbox){display:none!important}
  .sheetbox{margin:0}.bks{border:0!important}
  @page{margin:14mm}
}
</style>
</head>

<script>
(function(){

const esc = s => String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
// ---------- booking sheets: shared wording ----------

const BK_VEH={bus:['אוטובוס','Bus'],midibus:['מידיבוס','Midibus'],van20:['מיניבוס 17–20 מקומות','Van, 17–20 seats'],van16:['מיניבוס 11–16 מקומות','Van, 11–16 seats'],van10:['ואן 9–10 מקומות','Van, 9–10 seats'],van8:['ואן עד 8 מקומות','Van, up to 8 seats'],car:['רכב פרטי','Car'],jeep_vehicle:['ג׳יפ / 4x4','Jeep / 4x4'],transfer:['העברה','Transfer']};

const BK_IE={incl:['כלול במחיר','included'],extra:['בנוסף','extra']};

const bkMoney=(t,x)=>(BK_SIGN[(t&&t.currency)||'ILS']||'₪')+Number(x).toLocaleString('en-US');
function bkDate(iso,he){ if(!iso) return ''; const d=new Date(iso+'T12:00:00'); if(isNaN(d)) return iso;
  try{ return he ? d.toLocaleDateString('he-IL',{weekday:'short',day:'numeric',month:'numeric',year:'numeric'}) : d.toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short',year:'numeric'}); }catch(e){ return iso; } }
const bkRange=(b,he)=> b.date_to&&b.date_to!==b.date_from ? bkDate(b.date_from,he)+' – '+bkDate(b.date_to,he) : bkDate(b.date_from,he);

  return v[he?0:1]; }
// Rows are [Hebrew label, English label, Hebrew value, English value]. English value null = the same typed text.
function bkJobRows(b){ return [
  ['תאריך','Date',bkRange(b,true),bkRange(b,false)],
  ['נוסעים','Passengers',b.pax?b.pax+(b.tourists?' · תיירים מחו״ל':''):(b.tourists?'תיירים מחו״ל':''),b.pax?b.pax+(b.tourists?' · tourists from abroad':''):(b.tourists?'tourists from abroad':'')],
  ['רכב','Vehicle',bkVehicle(b,true),bkVehicle(b,false)],
  ['איסוף','Pick-up',[b.pickup_time,b.pickup_place].filter(Boolean).join(', '),null],
  ['מסלול היום','Outline of the day',b.route||'',null],
  ['פיזור','Drop-off',[b.dropoff_time,b.dropoff_place].filter(Boolean).join(', '),null],
  ['הערות המזמין','Notes from the guide',b.note||'',null]].filter(r=>r[2]); }
function bkTermRows(t){ t=t||{}; const m=x=>bkMoney(t,x), vat=BK_VAT[t.vat];
  const inc=[[t.hours_incl,'עד '+t.hours_incl+' שעות','up to '+t.hours_incl+' hours'],[t.km_incl,'עד '+t.km_incl+' ק״מ','up to '+t.km_incl+' km']].filter(x=>x[0]);
  const ie=(k,note)=>BK_IE[t[k]]?[BK_IE[t[k]][0]+(note?' · '+note:''),BK_IE[t[k]][1]+(note?' · '+note:'')]:['',''];
  const tip=t.tip==='none'?['לא מצופה','not expected']:t.tip==='customary'?['מקובל'+(t.tip_amt?' '+m(t.tip_amt)+' ליום':''),'customary'+(t.tip_amt?', '+m(t.tip_amt)+' a day':'')]:['',''];
  return [
    ['מחיר ליום','Price per day',t.price?m(t.price)+(vat?' · '+vat[0]:''):'',t.price?m(t.price)+(vat?' · '+vat[1]:''):''],
    ['המחיר כולל','Price includes',inc.map(x=>x[1]).join(' · '),inc.map(x=>x[2]).join(' · ')],
    ['השעות נספרות מ־','Hours counted from',({pickup:'נקודת האיסוף',depot:'היציאה מהחניון'})[t.hours_from]||'',({pickup:'the pick-up',depot:'leaving the depot'})[t.hours_from]||''],
    ['שעה נוספת','Extra hour',t.overtime?m(t.overtime):'',t.overtime?m(t.overtime):''],
    ['ק״מ נוסף','Extra km',t.extra_km?m(t.extra_km):'',t.extra_km?m(t.extra_km):''],
    ['כביש 6 ואגרות','Highway 6 and tolls',...ie('tolls',t.tolls_note)],
    ['חניה','Parking',...ie('parking')],
    ['טיפ לנהג','Driver tip',...tip],
    ['תוספות אחרות','Other extras',t.extras||'',null],
    ['ביטול ללא חיוב עד','Free cancellation until',t.cancel||'',null],
    ['תשלום','Payment',t.payment||'',null],
    ['הערות החברה','Notes from the company',t.note||'',null]]; }
// What a price without these still leaves open: where surprise charges come from.
function bkMissing(t){ t=t||{}; const out=[];
  if(!t.vat) out.push(['מע״מ','VAT']); if(!t.hours_incl) out.push(['שעות ביום','hours in a day']); if(!t.km_incl) out.push(['ק״מ כלולים','km included']);
  if(!t.overtime) out.push(['שעה נוספת','extra hour']); if(!t.extra_km&&t.km_incl) out.push(['ק״מ נוסף','extra km']); if(!t.tolls) out.push(['כביש 6','Highway 6']); if(!t.tip) out.push(['טיפ','tip']);
  return out; }
function bkSheetHtml(b,t){ const has=!!(t&&t.price), comp=b.company||b.vendor_name||'';
  const row=r=>`<div class="bks-r${r[2]?'':' ns'}"><dt>${esc(r[0])}<small dir="ltr">${esc(r[1])}</small></dt><dd dir="auto">${r[2]?esc(r[2]):'לא צוין'}${r[2]?(r[3]&&r[3]!==r[2]?`<small dir="ltr">${esc(r[3])}</small>`:''):'<small dir="ltr">not stated</small>'}</dd></div>`;
  const terms=has?bkTermRows(t).filter((r,i)=>r[2]||i<8):[];
  const when=iso=>{ try{ const d=new Date(iso); return d.getDate()+'.'+(d.getMonth()+1)+'.'+d.getFullYear(); }catch(e){ return ''; } };
  const who=[['מזמין','Booked by',[b.booker_name,b.booker_phone].filter(Boolean).join(' · ')],['חברה','Company',comp],
    has?[b.terms_by==='guide'?'נרשם ע״י המזמין':'מולא ע״י','Filled in by',b.terms_by==='guide'?'לפי תשובת החברה'+(b.answered_by?' ('+b.answered_by+')':''):[b.answered_by,b.answered_at?when(b.answered_at):''].filter(Boolean).join(' · '),b.terms_by==='guide'?'entered by the guide from the company\'s answer':null]:null,
    b.status==='confirmed'?['אושר','Confirmed',b.confirmed_at?when(b.confirmed_at):'✓',null]:null].filter(r=>r&&r[2]);
  return `<div class="bks" dir="rtl" lang="he">
    <div class="bks-h"><b>דף הזמנת רכב</b><span dir="ltr">Vehicle booking sheet</span></div>
    <dl>${who.map(row).join('')}</dl>
    <div class="bks-sec">ההזמנה<small dir="ltr">The job</small></div>
    <dl>${bkJobRows(b).map(row).join('')}</dl>
    ${has?`<div class="bks-sec">מחיר ותנאים<small dir="ltr">Price and terms</small></div><dl>${terms.map(row).join('')}</dl>
    <div class="bks-stmt">${esc(BK_STMT[0])}<small dir="ltr">${esc(BK_STMT[1])}</small></div>`:''}</div>`; }
// Plain text for WhatsApp or email. ask = short note with the link; template = no link, blanks to fill in; summary = the filled sheet.
function bkText(b,t,mode,link){ const L=[], comp=b.company||b.vendor_name||'';
  const two=r=>{ if(r[3]==null||r[3]===r[2]) L.push(r[0]+' · '+r[1]+': '+r[2]); else { L.push(r[0]+': '+r[2]); L.push(r[1]+': '+r[3]); } };
  if(mode==='ask'){
    L.push('שלום, יש לי הזמנת רכב: '+[bkRange(b,true),bkVehicle(b,true),b.pax?b.pax+' נוסעים':''].filter(Boolean).join(', ')+'.');
    if(b.pickup_time||b.pickup_place) L.push('איסוף: '+[b.pickup_time,b.pickup_place].filter(Boolean).join(', ')+'.');
    L.push('נא למלא מחיר ותנאים בקישור, זה לוקח דקה:'); L.push(link); L.push('תודה, '+(b.booker_name||''));
    L.push(''); L.push('Vehicle booking for '+bkRange(b,false)+'. Please fill in the price and terms at the link. Thanks, '+(b.booker_name||''));
    return L.join('\n'); }
  L.push('*דף הזמנת רכב · Vehicle booking sheet*'); if(comp) L.push(comp);
  L.push(''); bkJobRows(b).forEach(two);
  if(mode==='template'){
    L.push(''); L.push('*נא למלא ולהחזיר · Please fill in and send back:*');
    [['מחיר ליום: ₪ ____ (כולל מע״מ / בתוספת / ללא)','Price per day: ₪ ____ (incl. VAT / plus VAT / none)'],['כולל עד __ שעות ועד __ ק״מ','Includes up to __ hours and __ km'],['השעות נספרות מ: האיסוף / החניון','Hours counted from: pick-up / depot'],
     ['שעה נוספת: ₪ ____','Extra hour: ₪ ____'],['ק״מ נוסף: ₪ ____','Extra km: ₪ ____'],['כביש 6 ואגרות: כלול / בנוסף','Highway 6 and tolls: included / extra'],['חניה: כלול / בנוסף','Parking: included / extra'],
     ['טיפ לנהג: לא מצופה / ₪ ____ ליום','Driver tip: not expected / ₪ ____ a day'],['תוספות אחרות (לינה, לילה, שבת): ____','Other extras (overnight, night, Shabbat): ____'],['ביטול ללא חיוב עד: ____','Free cancellation until: ____'],['תשלום: ____','Payment: ____'],['הערות: ____','Notes: ____']]
      .forEach(p=>{ L.push(p[0]); L.push(p[1]); });
  } else if(t&&t.price){
    L.push(''); L.push('*מחיר ותנאים · Price and terms*');
    bkTermRows(t).forEach((r,i)=>{ if(r[2]) two(r); else if(i<8){ L.push(r[0]+': לא צוין'); L.push(r[1]+': not stated'); } });
  }
  L.push(''); L.push('*'+BK_STMT[0]+'*'); L.push(BK_STMT[1]);
  L.push(''); L.push('מזמין · Booked by: '+[b.booker_name,b.booker_phone].filter(Boolean).join(', '));
  if(mode==='summary'&&b.answered_by) L.push('מולא ע״י · Filled in by: '+b.answered_by);
  return L.join('\n'); }
const BKS_CSS=`.bks{background:#fff;color:#16261e;border:1px solid #cfd6cd;border-radius:10px;padding:14px 16px;font-size:15px;line-height:1.35;text-align:right}

.bks-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;border-bottom:2px solid #16261e;padding-bottom:6px;margin-bottom:4px}

(function(){ const st=document.createElement('style'); st.textContent=BKS_CSS; document.head.appendChild(st); })();
const app = document.getElementById('app');
const BK_NUM = ['price','hours_incl','km_incl','overtime','extra_km','tip_amt'];
const two = (he,en) => `${esc(he)}<span class="en">${esc(en)}</span>`;
const intlDigits = ph => { let d=String(ph||'').replace(/[^\d+]/g,''); if(d.startsWith('+')) return d.slice(1); if(d.startsWith('00')) return d.slice(2); if(d.startsWith('0')) return '972'+d.slice(1); return d; };

// ---------- the only two calls this page can make ----------
let demo = {status:'waiting',company:'Galil Buses',booker_name:'Yael Levi',booker_role:'Licensed tour guide',booker_phone:'050-000-0000',date_from:'2026-11-10',date_to:'',pax:'24',service:'midibus',seats:'30',tourists:true,
  pickup_time:'08:00',pickup_place:'מלון בירושלים',route:'קיסריה ← זכרון יעקב ← חזרה לירושלים',dropoff_time:'18:00',dropoff_place:'מלון בירושלים',note:'מזגן חזק',
  proposed:{price:'3000',currency:'ILS',vat:'not_applicable',hours_incl:'10',km_incl:'250',overtime:'200',tolls:'incl'},terms:{},terms_by:'',answered_by:'',answered_at:null,confirmed_at:null};
async function api(fn, args){
  if(DEMO){ await new Promise(r=>setTimeout(r,150));
    if(fn==='booking_answer') demo=Object.assign({},demo,{terms:args.p_terms,terms_by:'company',answered_by:args.p_name,answered_at:new Date().toISOString(),status:'answered'});
    return JSON.parse(JSON.stringify(demo)); }
  let r; try{ r=await fetch(SUPABASE_URL+'/rest/v1/rpc/'+fn,{method:'POST',headers:{'Content-Type':'application/json',apikey:SUPABASE_KEY,Authorization:'Bearer '+SUPABASE_KEY},body:JSON.stringify(args)}); }
  catch(e){ throw new Error('אין חיבור לאינטרנט. נסו שוב. · No connection. Try again.'); }
  let j=null; try{ j=await r.json(); }catch(e){}
  if(!r.ok){ const e=new Error((j&&j.message)||'Something went wrong. Try again.'); e.code=j&&j.code; throw e; }
  return j;
}

// ---------- views ----------
let B = null;       // the booking as the server returned it
let editing = false;

function field(k, he, en, t, mode, ph){ return `<div><label for="t_${k}">${two(he,en)}</label><input id="t_${k}" data-t="${k}" type="text" ${mode?`inputmode="${mode}"`:''} dir="auto" value="${esc(t[k]||'')}" placeholder="${esc(ph||'')}" autocomplete="off"></div>`; }
function formView(){
  const answered=!!(B.terms&&B.terms.price), t=answered?B.terms:(B.proposed||{}), pre=!answered&&Object.keys(t).length>0;
  app.innerHTML=`${header()}${jobCard()}
    <div class="sec"><h2>מחיר ותנאים<span class="en">Price and terms · filled in by the bus company</span></h2>
    ${pre?`<p class="note sub">${two('חלק מהשדות מולאו מראש לפי מה שהמזמין מצפה. שנו מה שצריך.','Some fields are filled in with what the guide expects. Change anything that is different.')}</p>`:''}
    <form id="f" class="fields" novalidate>
      <div><label for="t_price">${two('מחיר ליום','Price per day')}</label>
        <div class="price"><input id="t_price" data-t="price" type="text" inputmode="decimal" value="${esc(t.price||'')}" placeholder="3000" autocomplete="off">
        <select data-t="currency" aria-label="מטבע · Currency">${['ILS','USD','EUR'].map(c=>`<option value="${c}"${(t.currency||'ILS')===c?' selected':''}>${BK_SIGN[c]} ${c}</option>`).join('')}</select></div>
        <fieldset class="sub"><legend class="lab" style="font-weight:400;font-size:13px;color:var(--ink-2)">מע״מ · VAT</legend>${seg('vat',[['including_vat','כולל מע״מ','incl. VAT'],['plus_vat','בתוספת מע״מ','plus VAT'],['not_applicable','ללא מע״מ, תיירים','no VAT, tourists']],t,3)}</fieldset></div>
      <div class="two">${field('hours_incl','כולל עד שעות','Hours included',t,'decimal','10')}${field('km_incl','כולל עד ק״מ','Km included',t,'numeric','250')}</div>
      <fieldset><legend class="lab">${two('השעות נספרות מ־','Hours counted from')}</legend>${seg('hours_from',[['pickup','נקודת האיסוף','the pick-up'],['depot','היציאה מהחניון','leaving the depot']],t)}</fieldset>
      <div class="two">${field('overtime','שעה נוספת','Extra hour',t,'decimal','200')}${field('extra_km','ק״מ נוסף','Extra km',t,'decimal','5')}</div>
      <fieldset><legend class="lab">${two('כביש 6 ואגרות','Highway 6 and tolls')}</legend>${seg('tolls',[['incl','כלול במחיר','included'],['extra','בנוסף','extra']],t)}
        <input class="sub" data-t="tolls_note" type="text" dir="auto" aria-label="הערה לכביש 6 · Highway 6 note" value="${esc(t.tolls_note||'')}" placeholder="למשל: לפי חשבון · e.g. by the bill"></fieldset>
      <fieldset><legend class="lab">${two('חניה','Parking')}</legend>${seg('parking',[['incl','כלול במחיר','included'],['extra','בנוסף, לפי קבלה','extra, by receipt']],t)}</fieldset>
      <fieldset><legend class="lab">${two('טיפ לנהג','Driver tip')}</legend>${seg('tip',[['none','לא מצופה','not expected'],['customary','מקובל','customary']],t)}
        <input class="sub" data-t="tip_amt" type="text" inputmode="decimal" aria-label="סכום מקובל ליום · Customary amount a day" value="${esc(t.tip_amt||'')}" placeholder="סכום מקובל ליום · amount a day"></fieldset>
      ${field('extras','תוספות אחרות: לינה, לילה, שבת','Other extras: overnight, night, Shabbat',t,'','')}
      ${field('cancel','ביטול ללא חיוב עד','Free cancellation until',t,'','48 שעות לפני')}
      ${field('payment','תשלום: איך ומתי','Payment: how and when',t,'','העברה בנקאית אחרי הנסיעה')}
      <div><label for="t_note">${two('הערות','Anything else · free text')}</label><textarea id="t_note" data-t="note" dir="auto">${esc(t.note||'')}</textarea></div>
      <div><label for="by">${two('השם שלך','Your name')}</label><input id="by" type="text" dir="auto" value="${esc(B.answered_by||'')}" autocomplete="name"></div>
    </form></div>
    <div class="stmt">${two(BK_STMT[0],BK_STMT[1])}</div>
    <div id="err"></div>
    <div class="acts"><button class="big" id="send" type="button">שליחה למזמין<small>Send to the guide</small></button>
      ${answered&&B.status==='answered'?'<button class="big soft" id="back" type="button">ביטול<small>Cancel</small></button>':''}</div>
    <p class="foot">${two('הדף הזה מציג הזמנה אחת בלבד.','This page shows this one booking only.')}</p>`;
  app.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{ const on=b.getAttribute('aria-pressed')==='true'; b.parentNode.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed','false')); b.setAttribute('aria-pressed',String(!on)); });
  const back=app.querySelector('#back'); if(back) back.onclick=()=>{ editing=false; draw(); };
  app.querySelector('#send').onclick=send;
}
function readTerms(){ const t={};
  app.querySelectorAll('[data-t]').forEach(i=>{ let v=i.value.trim(); if(BK_NUM.includes(i.dataset.t)) v=v.replace(/[,₪$€\s]/g,''); if(v) t[i.dataset.t]=v; });
  app.querySelectorAll('[data-seg]').forEach(s=>{ const on=s.querySelector('button[aria-pressed="true"]'); if(on) t[s.dataset.seg]=on.dataset.val; });
  return t; }
async function send(){
  const err=app.querySelector('#err'), t=readTerms(), btn=app.querySelector('#send');
  const fail=(he,en,id)=>{ err.innerHTML=`<div class="err">${two(he,en)}</div>`; const el=id&&app.querySelector('#'+id); if(el) el.focus(); err.scrollIntoView({block:'center'}); };
  if(!t.price) return fail('נא למלא מחיר ליום.','Fill in the price per day.','t_price');
  const pat={price:/^\d{1,7}(\.\d{1,2})?$/,hours_incl:/^\d{1,2}(\.\d)?$/,km_incl:/^\d{1,4}$/,overtime:/^\d{1,7}(\.\d{1,2})?$/,extra_km:/^\d{1,7}(\.\d{1,2})?$/,tip_amt:/^\d{1,7}(\.\d{1,2})?$/};
  const bad=BK_NUM.find(k=>t[k]&&!pat[k].test(t[k]));
  if(bad) return fail('בשדות המחיר, השעות והק״מ יש לכתוב מספר בלבד.','Price, hours and km fields take a number only.', bad==='tip_amt'?null:'t_'+bad);
  btn.disabled=true; err.innerHTML='';
  try{ B=await api('booking_answer',{p_key:KEY,p_terms:t,p_name:app.querySelector('#by').value.trim()}); editing=false; draw(true); window.scrollTo(0,0); }
  catch(e){ btn.disabled=false; err.innerHTML=`<div class="err">${esc(e.message)}</div>`; }
}
function doneView(justSent){
  const conf=B.status==='confirmed', wa='https://wa.me/'+(B.booker_phone?intlDigits(B.booker_phone):'')+'?text='+encodeURIComponent(bkText(B,B.terms,'summary'));
  app.innerHTML=`${header()}
    <div class="ban ${conf?'ok':'ok'}">${conf?two('ההזמנה אושרה ע״י המזמין. אלה התנאים שסוכמו.','The guide confirmed this booking. These are the agreed terms.'):two(justSent?'נשלח. המזמין רואה את התשובה שלך.':'התשובה שלך נשלחה.',justSent?'Sent. The guide can see your answer.':'Your answer was sent.')}</div>
    ${jobCard()}
    <div class="acts">
      <a class="big" id="wa" href="${esc(wa)}" target="_blank" rel="noopener">שליחת עותק בוואטסאפ למזמין<small>Send a copy on WhatsApp${B.booker_name?' to '+esc(B.booker_name):''}</small></a>
      <button class="big soft" id="print" type="button">הדפסה / שמירה כ-PDF<small>Print / save as PDF</small></button>
      ${conf?'':'<button class="big soft" id="change" type="button">תיקון התשובה<small>Change my answer</small></button>'}
    </div>
    <p class="foot">${conf?two('לשינוי אחרי אישור, פנו למזמין.','To change anything after confirmation, contact the guide.'):two('אפשר לתקן עד שהמזמין מאשר.','You can change your answer until the guide confirms.')}</p>`;
  app.querySelector('#print').onclick=()=>window.print();
  const ch=app.querySelector('#change'); if(ch) ch.onclick=()=>{ editing=true; draw(); window.scrollTo(0,0); };
}
function draw(justSent){
  if(B.status==='cancelled'){ app.innerHTML=`${header()}<div class="ban bad">${two('ההזמנה בוטלה.','This booking was cancelled.')}</div>${jobCard()}`; return; }
  const answered=!!(B.terms&&B.terms.price);
  if(B.status==='confirmed'||(answered&&B.status==='answered'&&!editing)) return doneView(justSent);
  editing=true; formView();
}
(async()=>{
  if(!KEY&&!DEMO){ app.innerHTML=`<div class="top"><h1>דף הזמנת רכב<span class="en">Vehicle booking sheet</span></h1></div><div class="ban bad">${two('הקישור אינו שלם. בקשו מהמזמין לשלוח אותו שוב.','This link is incomplete. Ask the person who sent it to send it again.')}</div>`; return; }
  try{ B=await api('booking_open',{p_key:KEY}); draw(); }
  catch(e){ const dead=e.code==='28000'||/not active/i.test(e.message);
    app.innerHTML=`<div class="top"><h1>דף הזמנת רכב<span class="en">Vehicle booking sheet</span></h1></div><div class="ban bad">${dead?two('הקישור אינו פעיל. בקשו מהמזמין קישור חדש.','This link is not active. Ask the person who sent it for a new one.'):esc(e.message)}</div>
      ${dead?'':'<div class="acts"><button class="big soft" id="retry" type="button">נסו שוב<small>Try again</small></button></div>'}`;
    const r=app.querySelector('#retry'); if(r) r.onclick=()=>location.reload(); }
})();
})();
</script>
</body>
</html>
